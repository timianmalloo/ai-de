const proposal="<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>AI-DE — a notebook workbench for work and systems<\/title><style>\n:root { color-scheme: light dark; --bg:#f7f5ef; --panel:#fff; --text:#20201d;\n  --muted:#66645f; --line:#d9d5ca; --accent:#3157a4; --code:#f0eee7; }\n@media (prefers-color-scheme: dark) {\n  :root { --bg:#171816; --panel:#20221f; --text:#f2f1eb; --muted:#b8b6ae;\n    --line:#3d403a; --accent:#8fb0ff; --code:#292c27; }\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--bg); color:var(--text);\n  font:16px/1.65 system-ui,-apple-system,\"Segoe UI\",sans-serif; }\nmain { width:min(920px,calc(100% - 32px)); margin:32px auto; padding:40px;\n  background:var(--panel); border:1px solid var(--line); border-radius:12px; }\nh1,h2,h3,h4,h5,h6 { line-height:1.2; margin:1.5em 0 .55em; }\nh1 { margin-top:0; font-size:2.2rem; } h2 { border-bottom:1px solid var(--line); padding-bottom:.3em; }\na { color:var(--accent); } code { background:var(--code); padding:.12em .35em; border-radius:4px; }\npre { overflow:auto; padding:16px; background:var(--code); border-radius:8px; }\npre code { padding:0; } blockquote { margin:1em 0; padding:.2em 1em; color:var(--muted);\n  border-left:4px solid var(--line); }\ntable { width:100%; border-collapse:collapse; margin:1em 0; display:block; overflow:auto; }\nth,td { padding:.55em .75em; border:1px solid var(--line); text-align:left; vertical-align:top; }\nth { background:var(--code); } hr { border:0; border-top:1px solid var(--line); }\n.source { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }\n@media (max-width:640px) { main { width:100%; margin:0; padding:24px 18px; border:0; border-radius:0; } }\n<\/style><\/head><body><main><div class=\"source\">Rendered from local-software-factory-v2.md<\/div><h1>AI-DE: start with the work, or start with the system<\/h1>\n<p><strong>Exploratory proposal — not an accepted implementation specification.<\/strong> AI-DE remains a local Windows desktop workbench. This iteration preserves Factory, Review and Understand, changes the primary authoring experience, and restores docking as a central product behavior.<\/p>\n<p><a href=\"local-software-factory-v2-interactive.html\">Open the full interactive proposal<\/a>. Try the mockup from <a href=\"../mockups/factory-workbench-v2.html?entry=work\">work<\/a>, <a href=\"../mockups/factory-workbench-v2.html?entry=system\">the system<\/a>, or <a href=\"../mockups/factory-workbench-v2.html?entry=review\">a PR review<\/a>.<\/p>\n<p>The recommendation is a <strong>continuous, intelligent notebook beside a first-class execution and evaluation surface<\/strong>. Diagrams, code, metadata and checklists dock around that pair. The left navigation describes where to work; the panes describe what is open. Moving a pane never changes the identity of the question, draft, run or evidence inside it.<\/p>\n<h2>Two legitimate paths<\/h2>\n<p>These are both viable product approaches, not a preferred design versus a deliberately weak alternative. They solve different arrival conditions. The proposed product supports both over the same underlying model and remembers the user&#x27;s last context.<\/p>\n<table><thead><tr><th><\/th><th>Path A — start with work<\/th><th>Path B — start with the system<\/th><\/tr><\/thead><tbody><tr><td>Arrival<\/td><td>“I need to change, build or review this.”<\/td><td>“I need to understand what exists or what this PR means.”<\/td><\/tr><tr><td>First object<\/td><td>Intent notebook, task, work item or PR<\/td><td>Repository/PR investigation, question or selected symbol<\/td><\/tr><tr><td>First surface<\/td><td>Editor + execution/evaluation<\/td><td>Question editor + visualizer; execution and checklist alongside<\/td><\/tr><tr><td>Progress<\/td><td>Accepted intent → bounded run → evidence → review decision<\/td><td>Question → scoped answer → inspect relationships → capture uncertainty → next question<\/td><\/tr><tr><td>Structure<\/td><td>Explicit acceptance and ownership make delivery legible<\/td><td>Discovery is allowed before a correct task can be named<\/td><\/tr><tr><td>Strength<\/td><td>Productive when the desired change is already understood<\/td><td>Productive in unfamiliar repositories, ambiguous requirements and review<\/td><\/tr><tr><td>Cost/risk<\/td><td>Premature tasks can encode the wrong problem<\/td><td>Exploration can remain open-ended without a stopping question or scope<\/td><\/tr><tr><td>Control<\/td><td>Revise intent before execution; keep acceptance separate from a plan<\/td><td>Show investigated scope and open questions; explicitly promote selected findings to work<\/td><\/tr><tr><td>Legitimate stopping point<\/td><td>A reviewable change and its proof<\/td><td>A useful explanation, diagram or checklist—even if no code changes<\/td><\/tr><\/tbody><\/table>\n<p><strong>Meet the user where they are.<\/strong> Do not force an “Ask the repo” question through task creation. Do not require someone with a precise task to tour the whole architecture first. “Promote to work” is an explicit bridge that preserves the originating question, scope and evidence. A PR can enter either path: as work requiring a decision, or as a system delta to understand.<\/p>\n<h2>Three loops, one left navigation<\/h2>\n<table><thead><tr><th>Section<\/th><th>Left-side children<\/th><th>Primary relationship<\/th><\/tr><\/thead><tbody><tr><td>Factory — development<\/td><td>Prompt notebook, Work items, Execution, Coordination<\/td><td>Intent and acceptance beside the run that acts on them<\/td><\/tr><tr><td>Review<\/td><td>Pull requests, Review notebook, Test evidence, Rigor backlog<\/td><td>Questions and human judgment beside change/evidence packets<\/td><\/tr><tr><td>Understand<\/td><td>Ask the repo, Ask a PR, Visualizer, Checklists<\/td><td>Question, answer, diagram/code/metadata and open obligations<\/td><\/tr><\/tbody><\/table>\n<p>Feature destinations do not become right-pane tabs. Document identities may have tabs where the native dock needs them. A visualizer&#x27;s Sequence / Components / Data / Code / Metadata selector changes the representation of the current object; it is not a second navigation system.<\/p>\n<h2>The editor must earn its place beyond CLI<\/h2>\n<p>The author works in a document, not in a stack of input boxes. The editing surface fills its pane: headings, prose, code, inline references and acceptance statements share one reading rhythm. A margin gutter carries section execution and diagnostics; contextual tools appear near a selection. Formatting controls do not compete with the text all the time.<\/p>\n<table><thead><tr><th>Core capability<\/th><th>Expected experience<\/th><th>What is demonstrated / still needed<\/th><\/tr><\/thead><tbody><tr><td>Autocomplete and IntelliSense<\/td><td><code>@<\/code> files/symbols/requirements, slash skills, variables, Ctrl+Space; keyboard selection and escape<\/td><td>Working fixture suggestions in rich and source projections; production index, ranking and freshness integration needed<\/td><\/tr><tr><td>Inline help<\/td><td>Hover/focus/signature help shows the actual selected identity, documentation, source and baseline<\/td><td>Known and unknown-reference paths; no substitution of a different symbol<\/td><\/tr><tr><td>Diagnostics<\/td><td>Explain ambiguous acceptance, unresolved context, stale evidence or budget mismatch at its location<\/td><td>Measurability hint and explicit correction; production semantic diagnostics need contracts<\/td><\/tr><tr><td>Editing power<\/td><td>Multi-selection, find/replace, folding, structural navigation, undo/redo, code fences, precise caret behavior<\/td><td>Exact multi-edit preview/apply/undo works; true native multi-cursor/IME/clipboard behavior remains qualification work<\/td><\/tr><tr><td>Prompt stack<\/td><td>Back/forward, saved revisions, compare, branch; scratch preserved<\/td><td>Local draft history and immutable snapshots demonstrated<\/td><\/tr><tr><td>Scoped execution<\/td><td>Run the document, a section or selected text; inspect exact serialized input first<\/td><td>Working fixture input preview, revision binding and selection execution<\/td><\/tr><tr><td>Context composition<\/td><td>Insert a reference or selected range with scope and provenance; inspect what will be sent<\/td><td>Inline references and explicit selected context; no silent whole-repository attachment<\/td><\/tr><tr><td>Notebook output<\/td><td>Result remains linked to the submitted revision; edits mark the previous result stale<\/td><td>Working staleness and immutable submitted-input behavior<\/td><\/tr><tr><td>Multimodal context<\/td><td>Attach diagram selection, code range, image/annotation or test output to a question<\/td><td>Diagram/code selection works; file/image/audio ingestion is a subsequent scoped capability, not claimed in the HTML<\/td><\/tr><\/tbody><\/table>\n<p>Deterministic completions should be immediate and index-backed. Optional model-generated rewrites, next-edit suggestions and critiques are a distinct layer with preview/accept/reject and their own latency/usage disclosure. The whole workbench is LLM-enabled, but an ungrounded model guess must not masquerade as symbol resolution or an execution receipt.<\/p>\n<p><strong>Editor implementation alternatives:<\/strong> reuse the existing CodeMirror 6/WebView2 composer as a canonical Markdown document with rich decorations, widgets and semantic services; or adopt a schema-governed rich document engine with embedded code editors. Both are real paths. Recommend CodeMirror first because it is already shipped and preserves source editing, multi-selection and precise context ranges. Choose the second only if qualification shows that document semantics or collaborative rich editing cannot be met cleanly. Do not introduce two competing authoritative documents. The HTML uses bounded contenteditable/source projections to review interaction; it is not evidence that a production rich engine is complete.<\/p>\n<p>“Superior to CLI” is an acceptance obligation, not a marketing claim. Benchmark: insert and inspect a symbol reference, revise repeated text safely, compare prompt versions, ask about a diagram edge, understand a failed run and capture a test gap. The GUI must preserve keyboard speed while reducing copy/paste, lost context and ambiguous scope. Native typing, IME, clipboard, undo and large-document budgets must pass before making this the default.<\/p>\n<h2>Execution is a peer, not a console drawer<\/h2>\n<p>The execution surface shows <strong>approach summaries when supplied<\/strong>, concrete tool activity, human permissions, outputs, evaluations and gaps. It does not fabricate hidden reasoning. “No reasoning summary supplied” is a valid state. Raw native output remains an inspectable evidence view, not the primary user interface.<\/p>\n<p>The surface distinguishes preparing, running, waiting for permission, waiting for input, queued, stop requested, interruption acknowledged, failed, disconnected/outcome unknown, response complete and evidence ready for review. An exit code is not semantic success. Denied tools, omitted scope and absent usage remain visible. Closing the pane does not stop the run; Stop does not imply rollback.<\/p>\n<p>Queue adds a later turn without mutating the active input. Steer is an explicit amendment when the native route supports it. Retry creates a new attempt after inspection; it does not replay work silently. Reading old output suspends follow-latest rather than moving the user&#x27;s scroll position. Changing loops or selecting another harness cannot relabel or reset an existing run.<\/p>\n<p>Evaluation joins intent to observations: criterion → production/test artifact → assertion → test attempt/environment → evidence → human disposition. A model&#x27;s useful response can be complete while the work remains unproven. A checkbox can mean acknowledgment; it cannot manufacture a test pass.<\/p>\n<h2>A shell designed for docking<\/h2>\n<p>Reuse AI-DE&#x27;s WPF, AvalonDock, zone service, controller, rails and per-perspective layout persistence. The existing <code>DockHost<\/code> already composes them. Keep surface identities independent of placement and make model lifetimes workspace-owned; do not tie an active run to a pane&#x27;s visual lifetime.<\/p>\n<p>Default arrangements are <strong>editor + execution<\/strong>, <strong>execution below<\/strong>, <strong>focus editor<\/strong> and <strong>investigation<\/strong>. They are starting points, not locked templates. Notebook, execution, visualizer and checklist can move, resize, float, hide and reopen. Keyboard move/resize is a first-class route. The HTML floating pane is deliberately an in-window approximation; native auxiliary windows and mixed-DPI restoration require later proof.<\/p>\n<p>Every content pane carries object identity and scope. Linked selection follows the current investigation; pinning retains an older run/baseline visibly. Retain layout per loop and restore focus and caret. Avoid treating navigation, document switching and moving a pane as the same action.<\/p>\n<h2>Review and understanding journeys<\/h2>\n<p><strong>PR review:<\/strong> open the exact base/head, read the behavioral change, inspect the human decisions, ask a question in the review notebook, open the cited code/diagram/test evidence beside it, capture a gap, and record a reasoned disposition. “Did they think of X?” can establish what the implementation and recorded evidence show; it cannot establish the author&#x27;s unrecorded intention. A new head makes old answers and decisions stale. Recording a local disposition is distinct from approving or merging.<\/p>\n<p><strong>Test review:<\/strong> inspect assertion relevance, affected considerations, execution attempts, gaps, redundancy, efficiency and suspected flakiness at PR, component or repository scope. Keep numerator, denominator, time window and environment. “Not recorded” is not zero coverage; a successful retry does not erase a failed attempt. Suggest a backlog item rather than deleting tests from a score.<\/p>\n<p><strong>Understand:<\/strong> a question is a first-class document. Its answer can open a sequence/component/data diagram, source contract or metadata view. Selecting a node or code range becomes the next question. Keep open questions, tasks and risks in a linked checklist. A useful explanation can be the final outcome, with no work item. Architecture review uses the same loop at system and boundary scales; runtime evidence must be distinguished from extracted or inferred source relationships.<\/p>\n<p><strong>Rigor:<\/strong> proposed resilience, compliance, privacy, performance and security findings carry scope, evidence, impact, uncertainty, owner and disposition. A finding becomes accepted work only through an explicit decision. Contradictory evidence remains attached rather than being hidden by a summary.<\/p>\n<h2>Existing subscriptions, explicit native sign-in<\/h2>\n<p>This is grounded in the working <code>x-harness-x-model-bench<\/code> implementation at <strong>`8f514607`<\/strong>, not a new credential-broker design. AI-DE already defines subscription credentials as engine-owned.<\/p>\n<p>The flow is <strong>choose native harness → check its existing native session → explicitly open its sign-in only when needed → qualify the selected headless profile → run<\/strong>. AI-DE does not transparently negotiate subscription auth, offer a new OAuth identity, request API keys or extract a native token for a generic model client. Where a harness uses a browser/device/terminal sign-in, the user sees that harness-owned flow.<\/p>\n<table><thead><tr><th>Choice<\/th><th>Preferred product route<\/th><th>Honest qualification boundary<\/th><\/tr><\/thead><tbody><tr><td>Anthropic / Claude<\/td><td>Native Claude Code headless using native login or operator-issued setup-token<\/td><td>Respect credential refresh and distribution policy; SDK third-party login rules are separate from this native route<\/td><\/tr><tr><td>OpenAI / Codex<\/td><td>Native ChatGPT sign-in; local app-server or qualified native adapter<\/td><td>Verify model/profile access; no new app-owned OAuth flow required<\/td><\/tr><tr><td>Microsoft / GitHub Copilot<\/td><td>Native Copilot CLI and credential store; qualified programmatic/ACP route<\/td><td>GitHub entitlement and organization policy; consumer Copilot is distinct<\/td><\/tr><tr><td>Meta / Muse<\/td><td>Native Muse Code onboarding and exec JSON<\/td><td>New benchmark profile required; serve/MSP and subscription billing through it are separate qualification<\/td><\/tr><tr><td>Grok<\/td><td>Native Grok login; qualified ACP/headless profile<\/td><td>Respect credential-home concurrency and measured optional capabilities<\/td><\/tr><tr><td>Google / Antigravity<\/td><td>Native <code>agy<\/code> keyring sign-in and stream-json<\/td><td>Not Gemini CLI; policy-driven headless permissions are not an interactive approval protocol<\/td><\/tr><\/tbody><\/table>\n<p>Reuse benchmark environment sanitation so an inherited API key cannot silently change the requested billing route. Respect native credential-store and refresh semantics; never archive copied secrets. Reuse native-home concurrency controls. Do <strong>not<\/strong> import benchmark always-approve/trust policies as workbench defaults. Keep installed, signed in, account/plan known, model available, quota known and headless-ready as separate observations. Auth failure, quota pressure, unsupported capability and permission denial have different recoveries. The UI offers a deliberate route change, never hidden API billing or an unannounced model fallback.<\/p>\n<p>ACP is useful where qualified; it is not a requirement to erase native capabilities. Codex RPC, Copilot programmatic/ACP, Grok ACP, Antigravity stream-json and Muse exec can project into a common event model while retaining the raw source, version and unsupported states. The <a href=\"../knowledge/workbench-loops-20261018.md\">research note<\/a> gives official sources and precise limits.<\/p>\n<h2>Bring current AI-Forward coordination into the workbench<\/h2>\n<p>The source is pinned to <strong>`83a7834`<\/strong>, revision <strong>112<\/strong>. AI-DE&#x27;s manifest says 102, but its runner, board, decision helper and coordination doctrine already match source 112 byte-for-byte. The primary gap is a product projection and control integration—not simply copying ten pack revisions.<\/p>\n<p>Support native sub-agent fleets, cross-harness spawned workers and independently registered sessions. Show relationship and harness separately. An Owner is a model seat; the human supplies consent. A Coordinator decomposes, dispatches and joins. A registered peer is not an owned process.<\/p>\n<p>The coordination workspace should reveal:<\/p>\n<ul><li>the designated leader/epoch and observation freshness;<\/li><li>a task graph with the actual five-part contract, allowed tools, artifacts, budgets and termination;<\/li><li>scoped claims and seams, without pretending leases are correctness locks;<\/li><li>requests, exact-revision acknowledgments, overdue decisions and numbered rulings;<\/li><li>presence, meaningful progress and task outcome as separate dimensions;<\/li><li>transport completion, evidence presence, review readiness, acceptance and integration as separate stages;<\/li><li>interrupted attempts and concrete recovery actions, without silent replay, reassignment or cleanup.<\/li><\/ul>\n<p>Reuse pack refs, request/mail/ruling stores and qualified runner controls as their authorities. Do not create a disconnected C# coordination database. Preserve source identities, epochs, sequence and qualification fingerprints through a read model. AI-DE&#x27;s <code>ParentAgentId<\/code> is currently unpopulated and its watcher uses heartbeat age; neither proves a functioning delegation/progress graph. The source names <code>coord delegate<\/code> but does not implement that command: use the actual runner manifest contract. Preserve the repo&#x27;s enhanced durable join recovery during any future pack update.<\/p>\n<h2>Terminal&#x27;s retained role<\/h2>\n<p>Retire terminal/CLI prompting as the default navigation and authoring model. “Open repo terminal” remains explicit and creates a hosted native CLI at the chosen repository/worktree path. It is useful for direct tools, diagnostics and native sign-in; it does not replace the notebook or silently grant an agent execution permission. Raw console output is available as evidence. Existing terminal code can remain as this secondary capability while the main workflow migrates.<\/p>\n<h2>Shared model and durable representation<\/h2>\n<p>Notebook, run, assessment, layout and harness binding have separate invariants. Core identities are dimensions; revisions, attempts, permission decisions and evidence observations are append-only facts. One revision row is exactly one immutable document revision; one run row is exactly one attempt against one pinned input and route; one evidence-link row connects one exact claim/criterion revision to one artifact/attempt; one decision row records one actor&#x27;s disposition at one baseline.<\/p>\n<p>Use revision history when an attribute change would rewrite past meaning. Derive readiness and coverage rather than storing competing definitions. Counts are additive only for disjoint populations; rates retain numerator/denominator; parallel durations are not additive wall time. Provider usage and cost remain Not recorded unless actually emitted. The next component design must bind these objects to existing store and wire contracts before implementing additional panes.<\/p>\n<h2>How to get there from here<\/h2>\n<table><thead><tr><th>Slice<\/th><th>Reuse<\/th><th>Build / change<\/th><th>Exit evidence<\/th><\/tr><\/thead><tbody><tr><td>0. Stabilize evidence foundations<\/td><td>Existing forensic inventory and focused probes<\/td><td>Resolve known freshness/framing findings before relying on large-scale automated assurance<\/td><td>Failure-specific regression evidence, not a full-suite count alone<\/td><\/tr><tr><td>1. Desktop composition<\/td><td>DockHost, zone services, perspective registry, layout persistence<\/td><td>Left feature hierarchy; editor/run/visualizer/checklist surface identities; two entry paths; preserve old layout migration<\/td><td>Native focus, close/reopen, float/redock and mixed-DPI restoration with live run/draft<\/td><\/tr><tr><td>2. Intelligent authoring<\/td><td>CodeMirror 6/WebView2 composer, draft and host-owned prepare/send<\/td><td>Versioned notebook, semantic completion sources, inline help/diagnostics, selected scope, history and canonical request<\/td><td>IME/clipboard/multi-selection/undo, language/whitespace round-trip, 100k-character input and stale-prepare refusal<\/td><\/tr><tr><td>3. Native profile bootstrap<\/td><td>ProviderRegistry, FirstUse, benchmark profile/credential isolation patterns<\/td><td>Explicit native sign-in, environment sanitation, exact-profile readiness, account/model/capability observations; qualify Muse<\/td><td>Six separate capability records, no inherited API-key surprise, auth/refresh/concurrency failure fixtures<\/td><\/tr><tr><td>4. Execution and evaluation<\/td><td>GovernedRunHost, RunEventRelay, session/read models, cancellation/queue primitives<\/td><td>Peer execution surface, immutable attempt identity, native permissions, partial/disconnect/stop acknowledgment, evidence evaluation<\/td><td>Provider-specific stream, cancellation, permission and unknown-event tests; no competing stream reader<\/td><\/tr><tr><td>5. Review and understanding<\/td><td>Source viewer, diagrams, graph/document knowledge, assurance research<\/td><td>Repo/PR question notebooks, linked visualizers, test-worthiness and rigor checklist, explicit promotion<\/td><td>End-to-end question→evidence→gap→decision with stale-head invalidation and unknown fallback<\/td><\/tr><tr><td>6. Coordination projection, then commands<\/td><td>Current pack runner/board/decide, existing lease/seam and durable join evidence<\/td><td>Read-only graph and requests first; then qualified dispatch, permissions, enqueue/finish/cancel and join previews<\/td><td>Native-child/cross-harness/registered cases, stale ACK/leader epoch/stalled progress/interrupted join proof<\/td><\/tr><\/tbody><\/table>\n<p>Each slice is a vertical migration, not a second workbench running beside the first. Introduce the new surface behind the existing host; preserve draft/run identity and migrate layout by stable IDs. Keep Console as a secondary pane. A renderer message cannot become an uncontrolled execution path.<\/p>\n<h2>What this iteration proves—and leaves for implementation<\/h2>\n<p>The HTML is self-contained and contains working local interactions, including both entry paths, left navigation, rich/source editing, completion and help, revision/branch/compare, multi-edit, request preview, run/permission/queue/stop fixtures, diagrams, checklist, docking and native-login simulation. It makes no real provider call, repository edit, login or approval. All example PRs, metrics and runs are labeled fixtures.<\/p>\n<p>The <a href=\"../specs/workbench-loops-ux.md\">UX contract<\/a>, <a href=\"../reviews/ui-factory-workbench-v2.md\">review<\/a> and <a href=\"../proof/workbench-loops-20261018.md\">proof<\/a> retain the interaction checks and limitations. Native UIA/IME/DPI, actual providers, complete rich-editor semantics, large repository indexing, package trust and production coordination remain implementation work.<\/p>\n<h2>Decisions settled and questions for the next specification<\/h2>\n<p>Settled by the user: local desktop; dockable shell; Factory/Review/Understand; first-class intelligent editor and execution; left feature navigation; optional hosted terminal; explicit native subscription sign-in; both work-first and system-first paths. These are not reopened as permission questions.<\/p>\n<p>The prototype is complete enough to review without deciding release policy. Before production implementation, <code>/specify<\/code> must settle the initial qualified harness/version matrix, exact notebook document interoperability floor, default per-route permission policies, native layout migration and which measured outcomes justify a lighter human review policy. Those questions do not silently default to broad execution authority. The first <code>/design-slice<\/code> should cover the <strong>notebook/run identity seam<\/strong>, then native profile bootstrap and the editor qualification spike.<\/p><\/main><\/body><\/html>\n",mockup="<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>AI-DE — the notebook workbench<\/title>\n<style>\n:root{color-scheme:dark;--surface:#12151A;--raised:#1A1F26;--sunken:#0D1014;--border:#2A313B;--ink:#E4E9EF;--muted:#98A3B2;--strong:#7C8896;--accent:#5B9DD9;--on-accent:#0D1014;--good:#5FB98F;--warn:#D8A650;--bad:#E07A6F;--focus:#8FC0EA;--float:#232A33;--ui:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;--mono:'Cascadia Mono',Consolas,ui-monospace,monospace;--small:12px;--body:13px;--prose:15px;--section:18px;--title:22px;--radius:4px;--right-width:40%;--speed:150ms}\nbody[data-theme=light]{color-scheme:light;--surface:#F4F6F8;--raised:#FFFFFF;--sunken:#E7EBEF;--border:#C7CFD8;--ink:#1A1F26;--muted:#55606E;--strong:#5F6977;--accent:#27649A;--on-accent:#FFFFFF;--good:#1C724A;--warn:#7D5900;--bad:#A8372B;--focus:#1B4F7E;--float:#EEF1F4}\nbody[data-theme=hc]{--surface:#0D1014;--raised:#12151A;--sunken:#0D1014;--border:#7C8896;--ink:#FFFFFF;--muted:#E4E9EF;--strong:#E4E9EF;--accent:#8FC0EA;--on-accent:#0D1014;--focus:#FFFFFF}\n*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--sunken);color:var(--ink);font:var(--body)/1.5 va )+'%';$('visualScope').textContent='Selected: '+state.selectedNode+' · '+(state.viewState==='stale'?'stale fixture':'scope pinned')+' · text alternative available'}\nfunction askAbout(text){if(state.mode!=='understand'&&state.mode!=='review')switchMode('understand',state.scope==='pr'?'pr':'repo');state.view=state.mode==='review'?'notebook':state.scope==='pr'?'pr':'repo';pushUndo();current().md+='\\n\\n## Follow-up\\n\\n'+text;current().dirty=true;renderCollection();paintDocument();renderNav();saveLocal();$('editor').focus();toast('Question added with selected-object context. Review it before running.')}\nfunction renderCollection(){const isCollection=['work','pulls','tests','rigor','coordination'].includes(state.view);$('documentShell').hidden=isCollection;$('collection').hidden=!isCollection;if(!isCollection)return;let html='';if(state.view==='work')html='<h1>Work that is ready to move<\/h1><p class=\"intro\">Intent, execution and evidence stay linked. Open a notebook to continue a piece of work.<\/p>'+[['WI-142','Cancellation stays bounded','Plan review needed · 3 obligations'],['WI-139','Keep graph freshness honest','Evidence missing · 1 open finding'],['WI-137','Explain a PR before approval','Ready for human review · 2 decisions']].map(([id,t,m])=>`<div class=\"listrow\"><div class=\"grow\"><span class=\"small muted mono\">${id} · fixture<\/span><div><button class=\"link\" data-action=\"open-work\">${t}<\/button><\/div><p>${m}<\/p><\/div><button class=\"outline\" data-action=\"open-work\">Open notebook<\/button><\/div>`).join('')+'<div class=\"row wrap\" style=\"margin-top:20px\"><button class=\"outline\" data-action=\"new-notebook\">New intent notebook<\/button><button data-action=\"start-system\">Start from the system instead<\/button><\/div>';\n if(state.view==='pulls')html='<h1>Review by behavior<\/h1><p class=\"intro\">Start with the decision, then inspect the evidence. Repository approval remains a separate, explicit action.<\/p><div class=\"listrow\"><div class=\"grow\"><span class=\"small muted mono\">PR #184 · b72 → c91 · fixture<\/span><div><button class=\"link\" data-action=\"open-pr\">Keep cancellation state honest<\/button><\/div><p>2 human decisions · 1 missing test consideration · 6 changed files<\/p><div class=\"rowactions\"><button class=\"outline\" data-action=\"open-pr\">Open review notebook<\/button><button data-action=\"scope-pr\">Ask this PR<\/button><\/div><\/div><span class=\"state\">Needs judgment<\/span><\/div><div class=\"listrow\"><div class=\"grow\"><span class=\"small muted mono\">PR #181 · fixture<\/span><div class=\"title\">Restore a docked investigation<\/div><p>Native mixed-DPI proof not recorded.<\/p><\/div><button data-action=\"open-pr\">Inspect<\/button><\/div>';\n if(state.view==='tests')html='<h1>Test evidence, not just a percentage<\/h1><p class=\"intro\">Inspect assertions, execution attempts, gaps, redundancy and flakiness for the selected PR. Values below are fixture data.<\/p><div class=\"tablewrap\"><table><thead><tr><th>Consideration<\/th><th>Assertion / execution<\/th><th>Attempts<\/th><th>Next action<\/th><\/tr><\/thead><tbody><tr><td>Stop is acknowledged<\/td><td>Named assertion · fixture pass<\/td><td class=\"numeric\">8 / 8<\/td><td><button data-action=\"show-code\">Inspect<\/button><\/td><\/tr><tr><td>Disconnect mid-turn<\/td><td>Assertion missing<\/td><td class=\"numeric\">0 / 0<\/td><td><button data-action=\"test-gap\">Ask about gap<\/button><\/td><\/tr><tr><td>Background process cleanup<\/td><td>2 observed fixture failures; flakiness unproven<\/td><td class=\"numeric\">18 / 20<\/td><td><button data-action=\"test-gap\">Investigate<\/button><\/td><\/tr><tr><td>Duplicate lifecycle smoke<\/td><td>Same assertion · redundant candidate<\/td><td class=\"numeric\">12 / 12<\/td><td><button data-action=\"test-gap\">Compare value<\/button><\/td><\/tr><\/tbody><\/table><\/div><p class=\"small muted\" style=\"margin-top:16px\">Unknown is not zero coverage. Pass rate is per attempt and environment; retry success does not erase the first failure.<\/p>';\n if(state.view==='rigor')html='<h1>Risks worth a deliberate decision<\/h1><p class=\"intro\">A proposed backlog with evidence and owners. Findings are not automatically accepted tasks.<\/p>'+[['Resilience','A disconnected run can leave work active'],['Privacy','Context egress must match the selected profile'],['Security','Human permission must identify the concrete action'],['Performance','Large notebook input and event bursts need a budget'],['Compliance','Retain the decision and its exact evidence baseline']].map(([c,t])=>`<div class=\"listrow\"><div class=\"grow\"><span class=\"small muted\">${c} · proposed fixture<\/span><div class=\"title\">${t}<\/div><p>Evidence and disposition required before promotion.<\/p><\/div><button class=\"outline\" data-action=\"risk-concern\" data-title=\"${esc(t)}\">Ask / inspect<\/button><\/div>`).join('');\n if(state.view==='coordination')html='<h1>Coordinate the work, inspect the contract<\/h1><p class=\"intro\">Same task graph; different control relationships. These records illustrate the current pack semantics, not existing C# orchestration.<\/p><div class=\"row wrap\"><span class=\"badge\">Owner model: Codex<\/span><span class=\"badge\">Designated leader · epoch 12 · fixture<\/span><button data-action=\"coord-pattern\">Compare coordination patterns<\/button><\/div><div class=\"treeitem\"><div class=\"label\">Coordinator · cancellation investigation<\/div><div class=\"description\">Presence: observed · Progress: 4 artifact deltas · Outcome: working<\/div><button class=\"outline\" data-action=\"contract\">Inspect five-part contract<\/button><div class=\"treeitem\"><div class=\"label\">Native sub-agent · test architect <span class=\"badge\">spawned<\/span><\/div><div class=\"description\">Harness: Codex · context ceiling: 12k tokens · evidence ready, not accepted<\/div><button data-action=\"coord-evidence\">Inspect evidence / join<\/button><\/div><div class=\"treeitem\"><div class=\"label\">Peer session · architecture lens <span class=\"badge\">registered<\/span><\/div><div class=\"description warning\">Presence: fresh heartbeat · Progress: stalled (0 deltas) · Outcome: unknown<\/div><button data-action=\"decision-request\">Inspect blocking request<\/button><button data-action=\"request-stop\">Request stop<\/button><\/div><\/div><div class=\"listrow\"><div class=\"grow\"><h3>One request needs a ruling<\/h3><p>ACK names an older artifact revision. A fresh heartbeat does not make the acknowledgment current.<\/p><\/div><button class=\"outline\" data-action=\"decision-request\">Open request<\/button><\/div>';\n $('collection').innerHTML=html}\nfunction showConnections(){const p=providers.find(x=>x.id===state.provider),phase=state.auth[p.id]||'notchecked';showDialog('Use your signed-in harness',`<p class=\"muted\">Choose a native harness. Sign-in is explicit and owned by that harness; AI-DE does not negotiate subscription authentication or collect an API key.<\/p><div class=\"providerlist\"><div class=\"providers\">${providers.map(x=>`<button class=\"${x.id===p.id?'selected':''}\" data-action=\"provider\" data-provider=\"${x.id}\">${esc(x.name)}<\/button>`).join('')}<\/div><div class=\"providerinfo\"><h3>${esc(p.short)}<\/h3><div class=\"steps\"><span class=\"current\">Select<\/span><span>Native sign-in<\/span><span>Check profile<\/span><\/div><dl><dt>Selected route<\/dt><dd>${esc(p.route)}<\/dd><dt>Account state<\/dt><dd id=\"authPhase\">${phase==='ready'?'Demo profile ready · no real account checked':phase==='signedin'?'Native sign-in completed in fixture; headless check pending':phase==='pending'?'Waiting for explicit native sign-in confirmation':phase==='expired'?'Native sign-in expired; open its sign-in and check again':'Not checked'}<\/dd><dt>Sign-in experience<\/dt><dd>${esc(p.login)}<\/dd><dt>Credential boundary<\/dt><dd>${esc(p.detail)}<\/dd><\/dl><p class=\"small warning\">${esc(p.limit)}<\/p><p class=\"small muted\">The benchmark pattern sanitizes inherited API-key variables and respects native-home locks. It does not import benchmark auto-approval policies.<\/p><\/div><\/div>`,`<button data-action=\"close-dialog\">Close<\/button><button class=\"outline\" data-action=\"native-login\">Open native sign-in (demo)<\/button>${phase==='pending'?'<button class=\"outline\" data-action=\"confirm-login\">I completed sign-in (demo)<\/button>':''}${phase==='notchecked'?'<button class=\"outline\" data-action=\"check-existing\">Check existing native sign-in (demo)<\/button>':''}<button class=\"primary\" data-action=\"check-auth\" ${phase!=='signedin'&&phase!=='ready'?'disabled':''}>Check selected profile (demo)<\/button>`)}\nfunction renderState(){const v=state.viewState,b=$('stateBanner');b.hidden=v==='ready';const texts={empty:'No notebook content yet. Create a question or intent without losing your existing draft.',loading:'Loading the selected scope. Existing draft and last successful output remain available.',error:'The fixture run failed. Your document is retained; inspect the attempt before retrying.',partial:'Partial analysis: 3 references inspected; background-task evidence omitted. Do not treat this as complete.',stale:'Input baseline changed. The previous answer and decisions are stale until refreshed.',wrong:'This answer has been challenged. Retain it, inspect counter-evidence and record the unresolved concern.',quota:'The native harness reports a limit. Reset time and remaining quota are not recorded.',signedout:'Native sign-in is needed. Open the selected harness’s sign-in, then check the exact profile again.',overflow:'Overflow fixture: long names, large counts and narrow panes must remain readable.'};b.innerHTML=`<span class=\"grow\">${esc(texts[v]||'')}<\/span><button class=\"outline\" data-action=\"${v==='signedout'?'connections':v==='wrong'?'concern':v==='quota'?'connections':v==='empty'?'new-notebook':'recover'}\">${v==='signedout'?'Open native sign-in':v==='wrong'?'Ke t>Deadline and fallback<\/dt><dd>Deadline: 480 seconds after dispatch. At expiry, hold the dependent join, request a partial evidence return and escalate to Coordinator then Owner. No automatic reassignment, hidden retry or killing a registered peer.<\/dd><\/dl><p>Native sub-agents and spawned cross-harness workers share the same contract. An independently registered session has a request relationship, not an owned process.<\/p>`)}\nfunction showReviewDecision(){showDialog('Record a review disposition',`<p>PR #184 · base b72 → head c91 · fixture. This records a local review decision, not a GitHub approval or merge.<\/p><label class=\"field\">Disposition<select id=\"disposition\"><option>Needs more evidence<\/option><option>Intentional with documented reason<\/option><option>Ready for human approval<\/option><option>False positive<\/option><option>Deferred with owner<\/option><\/select><\/label><label class=\"field\">Reason<input id=\"decisionReason\" placeholder=\"Explain the evidence and remaining limit\"><\/label>`,`<button data-action=\"close-dialog\">Cancel<\/button><button class=\"primary\" data-action=\"record-decision\" ${state.viewState==='stale'||state.persona==='observer'?'disabled':''}>Record disposition<\/button>`)}\nfunction showTerminal(){showDialog('Optional repo terminal',`<p>The notebook remains the primary authoring surface. In the desktop product this action opens a hosted CLI at the selected repository path.<\/p><div class=\"terminal\"><div>Working directory: C:\\\\Projects\\\\ai-de<\/div><div class=\"muted\">No command is running in this HTML prototype.<\/div><div class=\"prompt\">PS C:\\\\Projects\\\\ai-de&gt; <span class=\"muted\">[interactive native terminal]<\/span><\/div><\/div><p class=\"small muted\">Opening a terminal grants no agent permission. Native sign-in may use its own terminal/browser/device flow. Closing the terminal is separate from stopping an agent run.<\/p>`)}\nfunction auditUI(){const app=$('app').getBoundingClientRect();let findings=[];if(!app.width||!app.height)findings.push('Page not rendered');const visible=e=>!!(e.getClientRects().length)&&getComputedStyle(e).visibility!=='hidden';const rgb=c=>{const m=c.match(/[\\d.]+/g);return m?m.slice(0,3).map(Number):null};const lum=c=>c.map(v=>v/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);const root=getComputedStyle(document.body),pairs=[['text','--ink'],['muted','--muted'],['accent','--accent'],['warning','--warn'],['danger','--bad']];let min=99;for(const [name,token]of pairs){const a=rgb(root.getPropertyValue(token).trim().startsWith('#')?hexRgb(root.getPropertyValue(token).trim()):root.getPropertyValue(token));const bg=rgb(hexRgb(root.getPropertyValue('--surface').trim()));if(a&&bg){const x=lum(a),y=lum(bg),ratio=(Math.max(x,y)+.05)/(Math.min(x,y)+.05);min=Math.min(min,ratio);if(ratio<4.5)findings.push(name+' contrast '+ratio.toFixed(2))}}const controls=[...$('app').querySelectorAll('button,select,input')].filter(visible),small=controls.filter(e=>(e.getBoundingClientRect().height<24||e.getBoundingClientRect().width<24)&&e.type!=='checkbox');if(small.length)findings.push(small.length+' controls under 24px');if(document.documentElement.scrollWidth>innerWidth+1)findings.push('Page-level horizontal overflow');const text=`HTML frame ${Math.round(app.width)} × ${Math.round(app.height)} px; ${controls.length} visible controls; token contrast floor ${min.toFixed(2)}:1; ${findings.length?findings.join('; '):'no measured layout/target failures'}. Native UIA/DPI/IME unverified.`;$('harnessOutput').textContent=text;window.__lastAudit={frame:{width:app.width,height:app.height},controls:controls.length,minContrast:min,findings};return window.__lastAudit}\nfunction hexRgb(v){const h=v.replace('#','');return /^([0-9a-f]{6})$/i.test(h)?'rgb('+[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',')+')':v}\nfunction action(a,el){closeTransient();if(a==='mode'){const mode=el.dataset.mode;switchMode(mode);
