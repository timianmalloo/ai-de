ected`** — Whether a floating pane's display is still present.\n\n## `TreeToZones`\n\n*class* — `TreeToZones.cs`\n\nConverts a legacy proportional split-tree `Layout` into a `WorkbenchLayout`\nof named zones. The Expand step of the ADR-0021 migration: existing saved `layout.json` trees\nare read through this so no surface is lost and every surface lands in a deterministic zone (AC-F9).\n\n**Remarks.** Pure and deterministic — the same tree always yields the same zones, which is what lets a golden\n`layout.json` fixture pin the conversion. Each tree stack is classified *as a unit* so its\ntab grouping survives the move (the graph's document tabs stay together in the Center rather than\nscattering). Stacks that map to the same zone are concatenated. Floating stacks carry over unchanged.\n\n| Member | Summary |\n|---|---|\n| `WorkbenchLayout Convert(Layout tree)` | Converts a tree layout to zones, losing no surface. |\n\n## `WorkbenchCommand`\n\n*record* — `WorkbenchCommands.cs`\n\nOne keyboard-reachable layout command, as the command palette lists it.\n\n**Remarks.** This catalog is the machine-checkable form of SC 2.5.7: every operation reachable by dragging\nmust have a keyboard equivalent. Because both the palette and the conformance test read the same\nlist, an operation added without a command fails the suite instead of shipping mouse-only.\n\n**Placement is a Core decision that used to live in a Design-owned file.** Adding a command\nand putting it in a menu is one atomic change — a conformance test requires every catalog command\nto be reachable — so a Core addition forced an edit to `MainMenuBuilder`. Declaring it here lets\nthe menu builder derive its grouping instead, and the seam stops crossing. Additive with a\ndefault, so nothing breaks before the builder reads it.\n\n## `WorkbenchCommandCatalog`\n\n*class* — `WorkbenchCommands.cs`\n\n*No doc comment on this type.* **(gap)**\n\n| Member | Summary |\n|---|---|\n| `IReadOnlyList<WorkbenchCommand> All { get; } =` | The commands, in palette order. Gestures follow Windows/Fluent conventions and deliberately avoid the Alt+<letter> menu-mnemonic space. |\n| `IEnumerable<WorkbenchCommand> Search(string term)` | **(gap)** |\n\n## `KeyboardResizeSession`\n\n*class* — `WorkbenchCommands.cs`\n\nThe keyboard resize interaction, modelled after Eclipse's `Alt+-` → Size → arrows — the only\nkeyboard resize proven in any of the four exemplars.\n\n**Remarks.** It is a small explicit state machine rather than a stream of resize operations because the user\nmust be able to **see which edge is selected** before moving it, and to **cancel back to where\nthey started**. Adjustments are applied live so the effect is visible, and Cancel restores the\nlayout captured on entry.\n\n| Member | Summary |\n|---|---|\n| `bool IsActive { get; private set; }` | **(gap)** |\n| `string? SplitId { get; private set; }` | **(gap)** |\n| `int EdgeIndex { get; private set; }` | **(gap)** |\n| `double Step { get; init; } = 0.02` | The step per arrow press, as a share of the split. Matches the mockup's declared increments. |\n| `string Begin(string splitId, int edgeIndex, string edgeLabel)` | Enters resize mode on an edge and announces which edge is selected. |\n| `LayoutResult Adjust(int direction)` | Applies one arrow press. A refusal (minimum size) keeps the session open. |\n| `string Commit()` | **(gap)** |\n| `string Cancel()` | Abandons the resize and puts the layout back exactly as it was on entry. |\n| `string Describe()` | **(gap)** |\n\n## `ZoneBackedLayoutService`\n\n*class* — `ZoneBackedLayoutService.cs`\n\nAn `ILayoutService` whose real state is a `WorkbenchLayout` of named zones,\nprojected to a fixed-shape `Layout` tree for the existing adapter/persistence to render\n(ADR-0021). Every tree-shaped operation is translated to a zone-scoped one, so an operation on one\npane changes only the zone(s) it names — the frame cannot \"flip\" (defect class DC-063). This is the\nStrangler that lets the layout logic become zone-based without touching the adapter, controller,\npersistence or shell wiring, all of which speak `ILayoutService`.\n\n| Member | Summary |\n|---|---|\n| `ZoneBackedLayoutService(WorkbenchLayout? initial = null)` | **(gap)** |\n| `WorkbenchLayout Zones` | The zone model — the real source of truth behind the projected tree. |\n| `void RestoreZones(WorkbenchLayout zones)` | Replaces the whole zone arrangement (used by persistence restore). |\n| `Layout Current` | **(gap)** |\n| `bool IsLocked { get; set; }` | **(gap)** |\n| `void Restore(Layout layout)` | **(gap)** |\n| `bool ReconcileFromView(Layout layout)` | Reconciles a native drag from the VIEW's fixed-frame tree by POSITION only. Returns true when it mapped confidently and applied; returns **false without touching the model** when it cannot — so an unmappable drag reve… |\n| `LayoutResult Apply(LayoutOperation operation)` | **(gap)** |\n\n## `ZoneId`\n\n*enum* — `ZoneLayout.cs`\n\nThe four named, absolute regions of the workbench frame. Unlike the proportional split tree\n(`Layout`), these are **stable containers**: the frame never restructures, so an\noperation on a pane can only change the zone(s) that pane belongs to — never relocate or reorient\nan unrelated pane (defect class DC-063). See `adr-0021-named-dock-zones`.\n\n## `ZoneContent`\n\n*record* — `ZoneLayout.cs`\n\nWhat a zone holds: either a single tab stack or, within the Center, a split into editor groups.\n\n**Remarks.** The load-bearing rule is that a `ZoneSplit`'s children never leave the zone — a split\nis *scoped to its zone*. That is what keeps the top-level frame from being a tree: there is\nno operation that restructures the relationship *between* zones. A zone with no content is\nrepresented by a null `Content` (a rail for a tool zone; a placeholder for\nthe Center), not by an empty stack — an empty `ZoneStack` is not constructible.\n\n| Member | Summary |\n|---|---|\n| `IEnumerable<Surface> Surfaces()` | Every surface this content holds, in tab/traversal order. |\n\n## `ZoneStack`\n\n*record* — `ZoneLayout.cs`\n\nA tab stack of one or more surfaces. The unit v1 tool zones are built from.\n\n| Member | Summary |\n|---|---|\n| `ZoneStack(ImmutableList<Surface> surfaces, int activeIndex = 0)` | **(gap)** |\n| `ImmutableList<Surface> Tabs { get; init; }` | **(gap)** |\n| `int ActiveIndex { get; init; }` | **(gap)** |\n| `Surface Active` | **(gap)** |\n| `IEnumerable<Surface> Surfaces()` | **(gap)** |\n\n## `ZoneSplit`\n\n*record* — `ZoneLayout.cs`\n\nA split into editor groups, scoped to its zone (Center only in v1). Its children are themselves\nzone content, so a group can be a stack or a nested split — but always inside this zone.\n\n| Member | Summary |\n|---|---|\n| `ZoneSplit(Orientation orientation, ImmutableList<ZoneContent> children, ImmutableList<double> weights)` | **(gap)** |\n| `Orientation Orientation { get; init; }` | **(gap)** |\n| `ImmutableList<ZoneContent> Children { get; init; }` | **(gap)** |\n| `ImmutableList<double> Weights { get; init; }` | **(gap)** |\n| `IEnumerable<Surface> Surfaces()` | **(gap)** |\n\n## `ZoneState`\n\n*record* — `ZoneLayout.cs`\n\nOne zone's state: what it holds, its cross-axis size relative to the Center, and whether it is\ncollapsed to a rail. The Center is never collapsed and its `Extent` is ignored (it\ntakes the remaining space).\n\n| Member | Summary |\n|---|---|\n| `double DefaultExtent = 0.22` | Default cross-axis extent for a tool zone, as a proportion of the frame. |\n| `bool IsEmpty` | **(gap)** |\n| `IEnumerable<Surface> Surfaces()` | **(gap)** |\n\n## `MaximizeMemo`\n\n*record* — `ZoneLayout.cs`\n\nThe arrangement to restore a maximized zone or pane back to.\n\n## `WorkbenchLayout`\n\n*record* — `ZoneLayout.cs`\n\nThe whole workbench arrangement as named zones: a fixed frame plus the floating stacks held\noutside it. Replaces the proportional split tree (`Layout`).\n\n**Remarks.** All four zones are **always present** in `Zones` — an empty zone has null content,\nit is never removed. That is what makes \"the Center is always there\" and \"moving a pane cannot\ndelete a zone\" structural rather than rules to remember. Floating stacks live outside the frame,\nunchanged from the tree model (only docked layout changes in ADR-0021).\n\n| Member | Summary |\n|---|---|\n| `WorkbenchLayout Default()` | The default arrangement: graph document in the Center, a terminal in the Bottom. |\n| `WorkbenchLayout Empty()` | An empty frame — all four zones present, none with content. Used by the converter as a base. |\n| `ZoneState Zone(ZoneId id)` | **(gap)** |\n| `IEnumerable<Surface> AllSurfaces()` | **(gap)** |\n| `ZoneId? FindZoneOf(string surfaceId)` | The zone currently holding , or null if it is floating/absent. |\n| `WorkbenchLayout WithZone(ZoneState zone)` | Replaces one zone's state, leaving the other three byte-identical (the containment primitive). |\n| `void AssertInvariant()` | The frame invariant, checked after every operation: the four zones exist, the Center is never collapsed, no surface appears twice, and no stack is empty. |\n| `string Shape()` | Structural signature ignoring extents — the oracle for \"which zone holds what, in what order\". Two layouts with the same shape are the same arrangement of panes. |\n\n## `ZoneLayoutResult`\n\n*record* — `ZoneLayoutService.cs`\n\nThe outcome of a zone-layout operation, carrying the accessibility announcement (SC 4.1.3).\n\n## `ZoneLayoutService`\n\n*class* — `ZoneLayoutService.cs`\n\nThe zone-scoped layout operations. Every operation names a `ZoneId`, and its effect is\nconfined to that zone (and, for a move, the destination zone) — the other zones come through\nreference-identical via `WithZone`. That confinement is the structural\nremedy for DC-063: there is no operation that restructures the relationship between zones.\n\n**Remarks.** Pure functions over an immutable `WorkbenchLayout`; no shell/UI dependency.\n\n| Member | Summary |\n|---|---|\n| `ZoneLayoutResult MovePane(` | Moves a surface into , changing only its source and destination zones. |\n| `ZoneLayoutResult OpenPane(WorkbenchLayout layout, Surface surface, ZoneId target)` | Opens a new surface as the active tab of  — destination-local. |\n| `ZoneLayoutResult ClosePane(WorkbenchLayout layout, string surfaceId)` | Closes a surface, changing only its own zone. The Center never disappears (becomes empty). |\n| `ZoneLayoutResult Activate(WorkbenchLayout layout, string surfaceId)` | Activates a surface's tab in whichever zone holds it. |\n| `ZoneLayoutResult CollapseZone(WorkbenchLayout layout, ZoneId zoneId)` | Collapses a tool zone to its rail; its panes are retained (AC-F4). The Center refuses. |\n| `ZoneLayoutResult ExpandZone(WorkbenchLayout layout, ZoneId zoneId)` | Re-expands a collapsed tool zone, restoring the same panes and active tab. |\n| `ZoneLayoutResult ResizeZone(WorkbenchLayout layout, ZoneId zoneId, double extent)` | Resizes a tool zone. Only that zone changes size; the Center absorbs the difference (AC-F6). |\n| `ZoneLayoutResult Maximize(WorkbenchLayout layout, ZoneId zoneId)` | Maximizes a zone (others collapse to rails), snapshotting the arrangement for an exact restore. |\n| `ZoneLayoutResult Restore(WorkbenchLayout layout)` | Restores the arrangement captured at the last `Maximize` — exactly (AC-F5). |\n\n## `ZoneEnvelope`\n\n*record* — `ZoneLayoutStore.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ZoneLayoutDto`\n\n*record* — `ZoneLayoutStore.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ZoneStateDto`\n\n*record* — `ZoneLayoutStore.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ZoneContentDto`\n\n*record* — `ZoneLayoutStore.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ZoneStackDto`\n\n*record* — `ZoneLayoutStore.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ZoneSurfaceDto`\n\n*record* — `ZoneLayoutStore.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ZoneLayoutStore`\n\n*class* — `ZoneLayoutStore.cs`\n\nSaves and restores a `WorkbenchLayout` of named zones as JSON (ADR-0021 dz-persist),\npreserving what the projected tree cannot: collapsed-zone content, per-zone extent, and exact\nplacement. Restore filters out surfaces the app can no longer provide, so a saved terminal whose\nprocess is gone (or a surface kind the build dropped) does not resurrect — an empty zone simply\nbecomes a placeholder, never a broken pane.\n\n| Member | Summary |\n|---|---|\n| `int CurrentSchemaVersion = 1` | **(gap)** |\n| `string FilePath` | **(gap)** |\n| `void Save(WorkbenchLayout layout)` | **(gap)** |\n| `WorkbenchLayout? Load(IReadOnlySet<string> availableSurfaces, IReadOnlySet<string> restorableKinds)` | Loads the saved zone layout, dropping surfaces that are no longer available. Returns null when there is no file, it cannot be read, or it does not deserialize — the caller then keeps its current arrangement (or the de… |\n\n## `ZonesToTree`\n\n*class* — `ZonesToTree.cs`\n\nProjects a `WorkbenchLayout` of named zones into a **fixed-shape** legacy\n`Layout` tree, so the existing AvalonDock adapter, persistence and controller render\nzones without change (the Strangler-Fig step of ADR-0021). The projected tree is always the same\nframe — `Vertical[ Horizontal[left, center, right], bottom ]` — so rendering it can never\n\"flip\": closing or opening a pane changes only which surfaces a zone's pane holds, never the frame.\n\n**Remarks.** Node ids are deterministic per zone (`zone-left`, `zone-center`, …) so the projection is\nstable across renders. Collapsed tool zones are omitted from the tree (their content is retained in\nthe zone model — the rail visual is a later phase). An empty Center still renders, via a synthetic\nwelcome placeholder, because the Center is never absent (AC-F3).\n\n| Member | Summary |\n|---|---|\n| `string CenterStackId = \"zone-center\"` | **(gap)** |\n| `string LeftStackId = \"zone-left\"` | **(gap)** |\n| `string RightStackId = \"zone-right\"` | **(gap)** |\n| `string BottomStackId = \"zone-bottom\"` | **(gap)** |\n| `string ColumnsSplitId = \"frame-cols\"` | **(gap)** |\n| `string RootSplitId = \"frame-root\"` | **(gap)** |\n| `Surface WelcomePlaceholder = new(\"welcome\", \"welcome\", \"Welcome\")` | The surface shown when the Center has no documents (kept out of the zone model itself). |\n| `Layout ToTree(WorkbenchLayout zones)` | Builds the fixed-shape tree for the current zones. |\n| `ZoneId? ZoneOfStackId(string stackId)` | Which zone a projected stack id belongs to, or null for an unknown id. |\n"}, {"id": "api-aide-core", "title": "AiDe.Core", "group": "API reference", "markdown": "\n# API: `AiDe.Core`\n\n**2 public types · 14 public members · 56% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `WorkspaceCore`\n\n*class* — `WorkspaceCore.cs`\n\nThe in-process authority core (ADR-0009): the composition root the shell talks to in Phase 1 and\nthe same contract a separate daemon exposes over IPC from Phase 2, so the split is a deployment\nsubstitution rather than a redesign.\n\n| Member | Summary |\n|---|---|\n| `string WorkspaceId { get; }` | **(gap)** |\n| `string RootPath { get; }` | **(gap)** |\n| `string DataDirectory { get; private set; } = string.Empty` | Where workspace-local state lives. The layout file sits beside the fact store (ADR-0013). |\n| `WorkspaceStore Store { get; }` | **(gap)** |\n| `ProjectionService Projections { get; }` | **(gap)** |\n| `DispatchService Dispatch { get; }` | **(gap)** |\n| `McpToolGateway Mcp { get; }` | **(gap)** |\n| `HealthIncidentSidecar Incidents { get; }` | **(gap)** |\n| `WorkspaceCore Open(string workspaceId, string rootPath, string dataDirectory, IExtractor? extractor = null)` | Opens a workspace and runs recovery before serving anything. Sweeping first is deliberate: a caller must never be able to observe an unresolved attempt and read it as \"never sent\". |\n| `Task<ExtractionResult> RefreshScopeAsync(` | Extracts one scope and commits it as a complete snapshot. An incomplete extraction is recorded as a health incident and the previous snapshot stands — a failed refresh never empties the graph. |\n| `Task<IndexResult> IndexCSharpAsync(` | Discovers every C# scope under the workspace root and refreshes each one. |\n| `IReadOnlyList<(string ScopeId, int Generations)> CheckCompactionNeeded(` | Raises a health incident for any scope whose generation count has passed the compaction threshold. |\n| `string DatabasePath` | The path compaction operates on. Compaction requires the store to be closed. |\n| `void Dispose()` | Closes what this object opened — both stores. |\n\n### `Task<ExtractionResult> RefreshScopeAsync(`\n\nExtracts one scope and commits it as a complete snapshot. An incomplete extraction is recorded\nas a health incident and the previous snapshot stands — a failed refresh never empties the graph.\n\n- **`rootPathOverride`** — What the extractor should read, when it is not the workspace root. A C# scope is one PROJECT built for one framework, so the request must carry that project's path — the workspace root names the repository, not the thing being extracted.\n\n### `Task<IndexResult> IndexCSharpAsync(`\n\nDiscovers every C# scope under the workspace root and refreshes each one.\n\n- **`force`** — Re-extract every scope even when its inputs are unchanged. The escape hatch for \"I do not believe the cache\", which is a thing an operator must always be able to say.\n\n**Remarks.** **Per scope, not per repository.** Each project/framework pair gets its own budget,\nits own generation and its own snapshot, so one project that fails to load quarantines itself\nand leaves every other project's evidence standing (`P2-EXT-02`).\n\n\n\n\n\n**The per-scope budget is enforced here.** A 60-second cap per scope, from the\ndesign — applied with a linked token so a caller cancelling the whole index still stops\neverything, while one slow project cannot consume the entire run.\n\n### `IReadOnlyList<(string ScopeId, int Generations)> CheckCompactionNeeded(`\n\nRaises a health incident for any scope whose generation count has passed the compaction\nthreshold.\n\n**Remarks.** P1-PERF measured refresh going over budget at roughly ten generations of the same scope. The\ngrowth is the append-only design working as intended, so the operator is told rather than the\nslowdown being absorbed silently — a workspace that has quietly become slow is the shape of\nproblem people stop reporting and start working around.\n\nThis reports; it does not compact. Compaction replaces the database file, so it belongs to a\ndeliberate maintenance moment, not to a background timer that could fire mid-session.\n\n### `void Dispose()`\n\nCloses what this object opened — both stores.\n\n**Remarks.** The watcher store is disposed here because `Open` created it. Whoever opens a handle\nowns closing it, and the alternative — taking the store as a constructor parameter so the\ncaller owns its lifetime — would move that ownership rather than remove it.\n\n## `IndexResult`\n\n*record* — `WorkspaceCore.cs`\n\nThe result of indexing a whole repository's C# scopes.\n"}, {"id": "api-aide-mcp", "title": "AiDe.Mcp", "group": "API reference", "markdown": "\n# API: `AiDe.Mcp`\n\n**10 public types · 19 public members · 93% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `BoardEntry`\n\n*record* — `BoardTools.cs`\n\nOne board message as an agent sees it.\n\n**Remarks.** **The flags travel verbatim.** `Quarantined` and `InjectionFlagged` are carried\nrather than filtered: hiding a flagged post would hide it from the agent most able to recognise\nwhat it is, and the flag already means \"treat as data, not instruction\". Suppression would also\nmake the board's own honesty invisible — the surface says it flags rather than deletes, and a\nreader that silently drops the flagged ones makes that a lie.\n\n## `BoardRead`\n\n*record* — `BoardTools.cs`\n\nWhat a board read found, or why it found nothing.\n\n**Remarks.** `Unavailable` is a separate channel from an empty list, because \"this repository has\nno posts\" and \"there is no store to read\" are different facts and only one is about the\nrepository. Collapsing them would let an absence render as a result — the shape this codebase has\ncorrected in four surfaces already (DC-025).\n\n## `BoardTools`\n\n*class* — `BoardTools.cs`\n\nThe board half of the MCP surface: read what other agents said, and say something back.\n\n**Remarks.** **Reading is the half that did not exist.** `board-post` has been a contract kind\nsince the board shipped; there was no read path of any kind for an agent, so two agents on one\nboard could not see each other. Measured 2026-09-03: two registered agents, asked whether they\nknew about Loomkeeper, both correctly said no.\n\n\n\n\n\n**Writing goes through the contract log, never the store.** A direct write would bypass\n`TrustedRegistrar`, capability verification and quarantine — every guarantee the ingest\nexists to provide — and it would make the cross-path equivalence gate unprovable, because the two\npaths would no longer share a mechanism.\n\n\n\n\n\nPure but for its two injected collaborators, so the equivalence gate can compare a tool call\nagainst a hand-written line with no transport in the way.\n\n| Member | Summary |\n|---|---|\n| `int MaxLimit = 200` | Most messages one read may return. |\n| `int DefaultLimit = 50` | Messages returned when the caller names no limit. |\n| `BoardRead Read(` | Reads this session's repository board — never another's. |\n| `string Post(` | Posts to this session's board by appending one contract line. |\n| `IReadOnlyList<string> KnownKinds { get; } =` | The kinds an agent may send, spelled the way the wire spells them. |\n\n### `int MaxLimit = 200`\n\nMost messages one read may return.\n\n**Remarks.** A resource bound on a reply that crosses into an agent's context window, not a modelling\nclaim. Its basis is **not recorded**; it may tighten and must never silently relax.\n\n### `BoardRead Read(`\n\nReads this session's repository board — never another's.\n\n**Remarks.** **The repository comes from the binding, never from an argument.** There is\ndeliberately no repository parameter, for the reason the contract already gives about writes:\nnaming another repository is the one thing worth forging on a surface whose entire purpose is\nthat another agent reads it and believes it. A read parameter would hand that over for\nfree.\n\n\n\n\n\nNewest last, so an agent appending to its context reads the board in the order it was\nwritten — the order a person reads a thread in.\n\n### `string Post(`\n\nPosts to this session's board by appending one contract line.\n\n**Returns.** What the ingest will do with it, in the agent's terms — including a refusal, stated at call time rather than left to be discovered by a post that never appears.\n\n**Remarks.** **The refusals are reported, not enforced.** This checks the same conditions the ingest\nchecks and says what will happen; the ingest still decides. Enforcing here would be a second\nset of rules to drift from the first — and a caller that refused something the ingest would\nhave accepted is a path where MCP and JSONL disagree, which is precisely what the equivalence\ngate forbids.\n\n### `IReadOnlyList<string> KnownKinds { get; } =`\n\nThe kinds an agent may send, spelled the way the wire spells them.\n\n**Remarks.** Derived from `BoardMessageKind` and hyphenated at each interior capital, because\nthe contract's vocabulary is kebab-case (`knowledge-candidate`) while the enum is Pascal.\nTyping the list out would be a second copy to drift (DC-021); deriving it means a new kind is\nadded once, in the enum.\n\n## `EpisodeTools`\n\n*class* — `EpisodeTools.cs`\n\nDeclaring a Work Episode — the unit scoring attaches to.\n\n**Remarks.** **Why an agent declares this and the product cannot.** The workbench knows a terminal\nexists; it does not know what the agent inside it is trying to do. Opening an episode with a\nplaceholder goal would fabricate one, and the scorer already treats a missing goal honestly — Not\nScored, with the reason — so the declaration comes from the only party that has it.\n\n\n\n\n\n**The one thing an agent may say about its own quality is a POINTER.**\n`episode.artifacts` names files; the product goes and looks. There is no\n`acceptance_met` and there never will be: a verdict an agent asserts about itself is what\nthe scoring design exists to refuse, while a path is something anyone can check. An agent cannot\nmake a file exist by asserting it harder.\n\n\n\n\n\nMeasured 2026-09-03: of 292 skill entries in this repository's own audit log, 33 carried a\ngoal. The other 259 could never become episodes at all — which is why these tools state what will\nhappen rather than accepting silence.\n\n| Member | Summary |\n|---|---|\n| `IReadOnlyList<string> Outcomes { get; } =` | The four outcomes the contract admits. Nothing is defaulted. |\n| `string Open(` | Opens an episode by appending an `episode-open` line. |\n| `string Close(` | Closes an episode, optionally naming the evidence. |\n\n### `string Open(`\n\nOpens an episode by appending an `episode-open` line.\n\n**Remarks.** A second open while one is live **supersedes** it: the first closes `Superseded` and a\nnew generation opens. That is deliberate rather than a fallback — changing the goal starts a\nnew episode — and it is said here so an agent reframing its work knows it did not lose the\nfirst one.\n\n### `string Close(`\n\nCloses an episode, optionally naming the evidence.\n\n**Remarks.** **Ending your session leaves an open episode open.** The watcher will not invent an\noutcome, so an episode nobody closes is never scored — said at call time because an agent that\ndoes not know this simply stops, and the silence looks like the product losing its work.\n\n## `Program`\n\n*class* — `Program.cs`\n\nThe stdio MCP server: JSON-RPC on stdin/stdout, three tools, no authority an agent lacks.\n\n**Remarks.** **Hand-rolled rather than taking an SDK.** The Solution-Selection Ladder puts a new\ndependency past rung 5, and JSON-RPC over stdio is a hundred lines against\n`System.Text.Json`. A package here would be a supply-chain surface and a version to track,\nbought for framing that the framework already provides.\n\n\n\n\n\n**Nothing may be written to stdout but a response.** stdout IS the protocol channel, so a\nstray `Console.WriteLine` corrupts the stream and the client reports a malformed server\nrather than the message that caused it. Every diagnostic goes to stderr, which the client logs.\n\n| Member | Summary |\n|---|---|\n| `Task<int> Main(string[] args)` | **(gap)** |\n\n## `ServerContext`\n\n*record* — `ServerContext.cs`\n\nEverything the server resolved about where it is and who is calling — including the absences.\n\n**Remarks.** Resolved once at startup rather than per call, because the answers are properties of how the\nprocess was launched and cannot change under it. The one thing that could — a session ending —\nis read from the store on each call instead.\n\n\n\n\n\n**Every failure here is a state, not an exception.** No workspace, no store, no session:\nthe server starts anyway and each tool says which of them is missing. A server that refuses to\nstart tells the agent only that something is wrong, and the agent has no way to find out what.\n\n| Member | Summary |\n|---|---|\n| `string? DatabasePath` | The store, opened read-only per call. Null when there is none to open. |\n| `ServerContext None(string reason)` | A context that resolved nothing, for a self-test or a shell outside AI-DE. |\n| `ServerContext Discover()` | Resolves the context from the environment and the working directory. |\n| `string Describe()` | One line for stderr, so a failure to identify is visible in the client's log. |\n| `IReadOnlyList<SessionRecord> ReadSessions(string? storePath)` | Opens the store read-only, or returns an empty list with the reason. |\n\n### `ServerContext Discover()`\n\nResolves the context from the environment and the working directory.\n\n**Remarks.** `AIDE_CONTRACT_LOG` gives the coordination directory; the workspace store sits beside it,\nbecause `WatcherHost.Open` puts the coord log inside the workspace data directory. That\nrelationship is derived from the launcher rather than configured, so there is no second path\nto keep in step.\n\n### `IReadOnlyList<SessionRecord> ReadSessions(string? storePath)`\n\nOpens the store read-only, or returns an empty list with the reason.\n\n**Remarks.** **Read-only is a design property, not caution.** The server's claim is that it holds no\nauthority an agent lacks; a write handle to the fact store would be exactly such an authority,\nand would bypass every guarantee the ingest provides. A test asserts the connection string\ncarries it.\n\n## `IdentitySource`\n\n*enum* — `SessionIdentity.cs`\n\nHow the server decided which session is calling, and on what evidence.\n\n## `ResolvedIdentity`\n\n*record* — `SessionIdentity.cs`\n\nThe resolved caller, or the stated reason there is none.\n\n| Member | Summary |\n|---|---|\n| `bool IsResolved` | **(gap)** |\n\n## `SessionIdentity`\n\n*class* — `SessionIdentity.cs`\n\nDecides which AI-DE session is calling, from two independent signals.\n\n**Remarks.** **Two signals, because one of them goes stale silently.** The environment is inherited —\nverified 2026-09-04, `spikes/mcp-stdio-environment`: a stdio server sees the launching\nclient's environment in full, so `AIDE_SESSION` arrives without configuration. But\ninheritance is exactly why a shell that outlives its terminal carries a DEAD session id forward,\nand nothing in the variable says so.\n\n\n\n\n\nThe same spike found the second signal: the server's working directory is the invocation\ndirectory, and since `c235611` an agent terminal runs in its own git worktree — a path the\nstore already holds. So identity can be corroborated rather than merely claimed.\n\n\n\n\n\n**Disagreement is refused, not resolved.** A board post attributed to the wrong agent is\nthe most damaging thing this surface can do: the board's whole purpose is that another agent\nreads it and believes it. When the two signals name different sessions the honest answer is\nneither, with both named so the operator can see which is stale.\n\n\n\n\n\nPure but for the two ambient reads, which are injected — so the whole decision table is\ntestable without an environment or a filesystem.\n\n| Member | Summary |\n|---|---|\n| `string SessionVariable = \"AIDE_SESSION\"` | The variable AI-DE sets on every terminal it launches. |\n| `ResolvedIdentity Resolve(` | Resolves the caller from the environment, the working directory, and the store. |\n\n## `Tools`\n\n*class* — `Tools.cs`\n\nThe five tools, their schemas, and the dispatch between them.\n\n**Remarks.** **Every tool answers, including when it cannot do its job.** No tool throws and none\nreturns an MCP error for a missing session, an unopened workspace or an unreadable store: each is\na state the agent can act on, and a protocol-level error tells it only that something broke. The\ndistinction matters most for the case that prompted this whole surface — an agent that does not\nknow whether it is registered needs an answer, not a stack trace.\n\n| Member | Summary |\n|---|---|\n| `JsonArray Schema()` | The tool list, as `tools/list` returns it. |\n| `JsonObject Call(JsonObject? parameters, ServerContext context)` | Dispatches one `tools/call`. |\n"}];
