e whole exchange.** It is the idempotency key: if the start\nreply is lost and the caller retries, the daemon returns the job it already has rather than\nextracting the scope twice.\n\n## `DescribeRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nThe four read projections, as they travel across the boundary.\n\n**Remarks.** Explicit request records rather than loose strings: the operation name and its arguments arrive\nas one payload from a process we do not control, and a positional or free-form encoding would\nhave to be validated by hand at every call site.\n\n## `ImpactRequest`\n\n*record* — `WorkspaceOperations.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `FindRequest`\n\n*record* — `WorkspaceOperations.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `SearchContentRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nAsk for lines of workspace files containing a term.\n\n## `InteractionRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nAsk for one caller's outgoing calls in order.\n\n## `EvidenceRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nAsks for one page of every current assertion.\n\n## `OverviewRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nAsks for the workspace as groups rather than nodes.\n\n## `PathsRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nAsks how one node reaches another.\n\n## `GraphRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nAsks for the graph — all of it, or the part the filters name.\n\n## `KnowledgeRequest`\n\n*record* — `WorkspaceOperations.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `NodeContentRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nOne node, for the reader that selected it (ADR-0018 node-content-reader-contract).\n\n## `DispatchBeginRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nPhase 1 of a dispatch: make the attempt durable before any byte leaves the shell.\n\n## `DispatchFinalizeRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nPhase 2 of a dispatch: record the outcome the shell observed.\n\n## `IndexSolutionRequest`\n\n*record* — `WorkspaceOperations.cs`\n\nIndex every C# scope in the workspace.\n\n**Remarks.** Additive with a default, so a client built before this field still decodes and still means \"use\nthe cache\" — which is the safe reading of an absent flag. It exists because an operator must\nalways be able to say \"I do not believe the cache\", and until it was reachable that sentence had\nno button behind it.\n\n## `DaemonOperations`\n\n*class* — `WorkspaceOperations.cs`\n\nOperations every daemon answers, whatever workspace it serves.\n\n**Remarks.** Separate from the projections because they are about the *daemon* rather than the\nworkspace's contents: a shell needs them to establish that it is talking to a live peer and which\nepoch its commands will be judged against, before it has anything to ask.\n\n| Member | Summary |\n|---|---|\n| `string Ping = \"ping\"` | **(gap)** |\n| `string Epoch = \"epoch\"` | **(gap)** |\n| `void Register(DaemonEndpoint endpoint, Func<long> epoch)` | Registers them against a live epoch source. |\n\n## `WorkspaceOperations`\n\n*class* — `WorkspaceOperations.cs`\n\nPuts the core's read surface behind the daemon endpoint.\n\n**Remarks.** **This is what the process split was for.** Until now the boundary existed and almost\nnothing crossed it: the daemon answered `ping` while the shell called the core in-process,\nso the trust boundary was real and unused. Every day that persists, new code is written against\nthe in-process path and has to be moved later.\n\n\n\n\n\n**Read projections only, and that is the whole surface today.** Dispatch — writing to a\nterminal, staging a prompt — carries the two-phase receipt semantics of ADR-0010, and moving it\nacross is a separate piece of work with its own failure modes. Naming that here is better than\nregistering a handler that half-implements it.\n\n\n\n\n\n**The projections are already bounded** (`ProjectionService` clamps every\nlimit and reports what it omitted), which is what makes them safe to expose to a caller who\nchooses the numbers. Nothing here re-validates: doing so would create a second definition of the\nbound, and two definitions of one quantity is a defect signature.\n\n| Member | Summary |\n|---|---|\n| `string Describe = \"describe\"` | **(gap)** |\n| `string Impact = \"impact\"` | **(gap)** |\n| `string Find = \"find\"` | **(gap)** |\n| `string SearchContent = \"search-content\"` | Lines in the workspace's own files that contain a term. |\n| `string Interaction = \"interaction\"` | One caller's outgoing calls, in call order — a sequence diagram's feed. |\n| `string Knowledge = \"knowledge\"` | **(gap)** |\n| `string NodeContent = \"nodeContent\"` | One node's content, on demand (ADR-0018 node-content-reader-contract). |\n| `string Evidence = \"evidence\"` | **(gap)** |\n| `string Graph = \"graph\"` | **(gap)** |\n| `string Paths = \"paths\"` | **(gap)** |\n| `string Overview = \"overview\"` | **(gap)** |\n| `string DispatchBegin = \"dispatch.begin\"` | **(gap)** |\n| `string DispatchFinalize = \"dispatch.finalize\"` | **(gap)** |\n| `string IndexSolution = \"index.solution\"` | **(gap)** |\n| `JsonSerializerOptions Wire { get; } = new(JsonSerializerDefaults.Web)` | How every payload on this boundary is encoded. |\n| `void Register(DaemonEndpoint endpoint, ProjectionService projections)` | Registers the read projections on . |\n| `void RegisterDispatch(DaemonEndpoint endpoint, BoundaryDispatcher dispatcher)` | Registers the two durable phases of prompt dispatch (ADR-0010) on . |\n| `void RegisterIndex(DaemonEndpoint endpoint, Func<string, bool, CancellationToken, Task<IndexSummary>> index)` | Turns a domain refusal into a stable error response instead of letting it escape.  Registers the workspace-wide C# index on . |\n\n### `string SearchContent = \"search-content\"`\n\nLines in the workspace's own files that contain a term.\n\n**Remarks.** Separate from `Find` because it answers a different question and costs a\ndifferent amount: Find reads the store, this opens files. A client should be able to offer\nthe cheap one on every keystroke and the expensive one on demand.\n\n### `JsonSerializerOptions Wire { get; } = new(JsonSerializerDefaults.Web)`\n\nHow every payload on this boundary is encoded.\n\n**Remarks.** **Enums travel as strings.** By number, adding a member in the middle of an enum silently\nrenumbers the ones after it — and with a dual-major handshake designed so an old shell may\nmeet a new daemon, that is a wire break with no error and no symptom except wrong answers.\nA name costs a few bytes and cannot be renumbered.\n\n### `void RegisterDispatch(DaemonEndpoint endpoint, BoundaryDispatcher dispatcher)`\n\nRegisters the two durable phases of prompt dispatch (ADR-0010) on .\n\n**Remarks.** Separate from the projection registration because these are the first WRITES on the read\nendpoint, and because a daemon can legitimately serve projections without them.\n\n### `void RegisterIndex(DaemonEndpoint endpoint, Func<string, bool, CancellationToken, Task<IndexSummary>> index)`\n\nTurns a domain refusal into a stable error response instead of letting it escape.\n\nRegisters the workspace-wide C# index on .\n\n**Remarks.** **Found by a test, and it was worse than it looked.** A stale-epoch dispatch threw a\n`WorkspaceStoreException` out of the handler, past `Handle{TRequest}`\n— which deliberately guards only decoding — and out of the server's listen loop. One client\nholding a stale epoch would have taken the daemon down for *every* shell attached to the\nworkspace.\n\n\n\n\n\n**Why the distinction matters and is not a widening of the catch.** `Handle`'s rule\nstands: a projection that throws is a defect in us and must not be swallowed. But a stale\nepoch is not a defect — it is the expected answer when the core was replaced under a caller,\nand the design requires it to come back as a stable denial code. Only\n`WorkspaceStoreException` is mapped, because it is the type that carries one;\neverything else still escapes.\n"}, {"id": "api-aide-core-mcp", "title": "AiDe.Core.Mcp", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Mcp`\n\n**6 public types · 8 public members · 50% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `McpErrorCodes`\n\n*class* — `McpToolGateway.cs`\n\n*No doc comment on this type.* **(gap)**\n\n| Member | Summary |\n|---|---|\n| `string EgressDenied = \"AIDE-MCP-EGRESS-DENIED\"` | **(gap)** |\n| `string CrossWorkspace = \"AIDE-AUTH-CROSS-WORKSPACE\"` | **(gap)** |\n| `string LimitExceeded = \"AIDE-MCP-LIMIT-EXCEEDED\"` | **(gap)** |\n| `string NotFound = \"AIDE-MCP-NOT-FOUND\"` | The tool ran and its subject does not exist — distinct from a tool that refused. |\n\n### `string NotFound = \"AIDE-MCP-NOT-FOUND\"`\n\nThe tool ran and its subject does not exist — distinct from a tool that refused.\n\n**Remarks.** An absent subject must not come back as an empty payload. An empty standing reads as \"you\nhave no rank and no reasons\", which is a claim about the agent rather than about the lookup\n(DC-087) — and the same is true of an empty description or an empty result set.\n\n## `McpCallerContext`\n\n*record* — `McpToolGateway.cs`\n\nIdentifies the calling agent session, including where its bytes go next.\n\n## `ToolAuthorization`\n\n*enum* — `McpToolGateway.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `McpToolResult`\n\n*record* — `McpToolGateway.cs`\n\nA tool result that knows whether it was reduced, and why.\n\n## `McpToolGateway`\n\n*class* — `McpToolGateway.cs`\n\nThe MCP boundary. Every tool call is authorized against the calling session's declared\nprocessing class before any workspace content is assembled (ADR-0011).\n\n**Remarks.** Pattern: Policy-Bound Egress. Loopback binding answers \"who connected\", not \"where do these bytes\ngo next\" — an externally-processing agent runs locally and forwards to its provider, so a\ntransport control cannot close that path. Authorization therefore follows the session class, and\nan unknown class fails closed exactly like an external one.\n\n| Member | Summary |\n|---|---|\n| `ToolAuthorization Authorize(McpCallerContext caller, string toolName)` | The deterministic (T0) authorization decision. A model never influences this — it runs before any content is read.  Authorizes a tool call. Bound to session identity and workspace, never to a processing class. |\n| `McpToolResult Describe(McpCallerContext caller, string nodeId, int maxNeighbors)` | **(gap)** |\n| `McpToolResult Find(McpCallerContext caller, string term, int maxResults)` | **(gap)** |\n| `McpToolResult Standing(McpCallerContext caller, string episodeId)` | The agent's own standing for one episode: rank where comparable, trend, and one evidence-backed reason per dimension (US-16). |\n\n### `ToolAuthorization Authorize(McpCallerContext caller, string toolName)`\n\nThe deterministic (T0) authorization decision. A model never influences this — it runs before\nany content is read.\n\nAuthorizes a tool call. Bound to session identity and workspace, never to a processing class.\n\n**Remarks.** **ADR-0022 supersedes ADR-0011 here.** This used to deny writes and reduce reads for\na session declared `ExternalProcessing`, on the reasoning that a provider-backed agent\nwould exfiltrate workspace content. The threat model does not survive contact with the\nproduct's shape: an agent in AI-DE has a TERMINAL in the workspace — since `c235611`, in\nits own worktree of it — and can `cat`, `grep` and `find` anything the user\ncan. Denying it the same content through a tool removed no capability it did not already have\nand only made the enlightened path weaker than the shell beside it.\n\n\n\n\n\nA control that constrains the polite interface while the impolite one is wide open is\nnot a boundary; it is a tax on the well-behaved. The owner overruled the Security hard veto on\nexactly that reasoning, and ADR-0022 records the decision and its residual risk.\n\n\n\n\n\n**THE CONDITION THAT REVIVES THE GATE, named so it is discoverable rather than\nremembered:** this argument rests entirely on the agent already having a shell in the tree.\nA remote agent, a sandboxed agent, or any agent granted MCP access *without* a terminal\nis a genuinely different case, and a processing-class gate is the right control for it. If\nAI-DE ever hosts one, reopen ADR-0022 before extending this method.\n\n\n\n\n\nWhat authorization still does is enforced elsewhere and deliberately not here: the\nworkspace check in `Guarded` (a caller may not read another workspace), the result\nbounds every tool applies, and — for writes, when they exist — session capability\nverification, which is what stops knowing an id being enough to post as it.\n\n### `McpToolResult Standing(McpCallerContext caller, string episodeId)`\n\nThe agent's own standing for one episode: rank where comparable, trend, and one\nevidence-backed reason per dimension (US-16).\n\n**Remarks.** **A PULL, deliberately.** US-16 says the agent receives its standing each turn, and\nthe obvious reading is a push. A push would put the scorer's output into the agent's context\nevery turn whether or not it asked — and ADR-0019 advisory-evaluator-calibration's anti-Goodhart section is precisely about\nwhat an agent is shown regarding its own scoring. An agent that asks has chosen to look.\n\n\n\n\n\n**Guarded like every other tool**, which is the reason it lives here rather than on a\nnew seam: it inherits the workspace check, the authorization gate and the\nminimum-metadata degradation rather than restating any of them. A standing is an evaluation\nof the caller, so a tool that skipped the cross-workspace check would let one workspace read\nanother's scoring.\n\n\n\n\n\n**An unknown episode is an error, not an empty standing.** An empty one reads as\n\"you have no rank and no reasons\" — a claim about the agent rather than about the lookup\n(DC-087).\n\n## `MinimumMetadata`\n\n*record* — `McpToolGateway.cs`\n\nWhat a non-LocalOnly caller is allowed to learn: that there is data, not what it says.\n"}, {"id": "api-aide-core-presentation", "title": "AiDe.Core.Presentation", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Presentation`\n\n**32 public types · 83 public members · 64% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `CanvasNode`\n\n*record* — `CanvasGraphViewModel.cs`\n\nOne node as the canvas draws it.\n\nOne node as the canvas draws it.\n\n**Remarks.** **The count is on the node because a dot standing for 240 types is only honest while the 240 is\non it.** Without it the overview renders a group exactly like a single type, and the picture\nsays the workspace is small rather than that the view is summarised. Defaulted to 1, so every\nexisting construction means what it always meant.\n\n## `CanvasEdge`\n\n*record* — `CanvasGraphViewModel.cs`\n\nOne edge as the canvas draws it.\n\n| Member | Summary |\n|---|---|\n| `bool IsJoin` | True for a join across artifact types — code to schema, schema to infrastructure. |\n| `bool IsInferred` | True when the claim is a convention rather than a declaration. |\n\n### `bool IsJoin`\n\nTrue for a join across artifact types — code to schema, schema to infrastructure.\n\n**Remarks.** Drawn differently because it is a different KIND of claim. An edge inside one artifact was\nresolved by a compiler; a join between two was resolved by a convention or a literal match,\nand it looks more authoritative than it is precisely because it spans more.\n\n## `CanvasGraph`\n\n*record* — `CanvasGraphViewModel.cs`\n\nWhat the canvas renders, including what it could not show.\n\n## `CanvasGraphViewModel`\n\n*class* — `CanvasGraphViewModel.cs`\n\nBuilds the canvas's view from the same read surface every other pane uses.\n\n**Remarks.** **In Core, with no WPF and no browser.** The canvas is a rendering of a projection, and\nwhat it shows is decidable — and testable — without a window. Putting this in the WPF layer would\nmake \"does the graph show the right nodes\" a question only answerable by looking at one.\n\n\n\n\n\n**Every empty case gets its own message.** \"No workspace\", \"nothing indexed yet\" and \"a\nnode with no neighbours\" are three different situations with three different next actions, and a\nblank canvas for all three tells the user nothing (**DC-011**).\n\n| Member | Summary |\n|---|---|\n| `int OverviewNodeCap = 1_500` | The graph around , or around whatever Find offers first.  How many nodes the canvas asks for when nothing is focused.  Nodes in the default overview, before it says what it left out. |\n| `Task<CanvasGraph> LoadAsync(` | **(gap)** |\n| `Task<CanvasGraph> OverviewAsync(int depth = 3, CancellationToken cancellationToken = default)` | The workspace as GROUPS rather than nodes — the source for a semantic-zoom render. |\n| `Task<CanvasGraph> GroupAsync(string groupId, CancellationToken cancellationToken = default)` | The member nodes of one overview group — the drill-down from a cluster (semantic zoom) to the real nodes it stands for. |\n| `Task<CanvasGraph> RouteAsync(` | The declared context a node belongs to, or null.  How one node reaches another, rendered as the same graph the canvas already draws. |\n| `Func<string, string?> ContextLookup { get; set; } = _` | **(gap)** |\n| `string? ContextFilter { get; set; }` | When set, only nodes in this context are drawn. |\n\n### `int OverviewNodeCap = 1_500`\n\nThe graph around , or around whatever Find offers first.\n\nHow many nodes the canvas asks for when nothing is focused.\n\nNodes in the default overview, before it says what it left out.\n\n**Remarks.** The projection's own ceiling, so the canvas asks for everything the read surface will give.\nA lower number here omitted 813 of TheTerrace's 2,813 nodes — a limit the SURFACE imposed on\nitself while the store and the projection were both willing. How much of it to draw at once\nis a rendering decision and belongs with the renderer; withholding it here would make that\ndecision on the renderer's behalf and hide the rest.\n\n**Derived from a measurement, and from the spec.** MEASURED on a real repository: the\nwhole graph serialises to **1,522,284 bytes** against a 1 MiB frame — so the previous\ndefault could not be delivered at all (INV-0003), and the user saw \"the daemon closed the\nconnection\". Declared-only nodes are ~294 bytes each including their edges, so a frame holds\nroughly 3,500 of them; this cap keeps real headroom under that.\n\n\n\n\n\n**But the size is the smaller reason.** `docs/specs/knowledge-exploration.md`\nUS-K2 says the whole graph is never rendered at once, and a 2,815-node hairball is unreadable\neven when it fits. The fix for \"one arbitrary alphabetical node\" was a bounded overview of\nMEANINGFUL nodes; loading everything over-corrected past it. What is dropped is counted and\nreported, which is the part that makes a bounded view honest rather than a smaller lie.\n\n### `Task<CanvasGraph> OverviewAsync(int depth = 3, CancellationToken cancellationToken = default)`\n\nThe workspace as GROUPS rather than nodes — the source for a semantic-zoom render.\n\n- **`depth`** — How many identifier segments to group by. Higher is finer.\n\n**Remarks.** **Why this exists beside the node graph.** The bounded default draws 1,500 of a\nworkspace's declared nodes and says what it dropped, which is honest and is still a hairball.\nA group view answers the question the first look actually asks — *what is in here* — and\nthe node view answers the second.\n\n\n\n\n\n**Each group is a node carrying its size.** The canvas already knows how to draw\nnodes and edges, so an overview arrives as the same shape with `Count`\nset — rather than as a second payload with a second renderer that would then disagree with\nthis one about what a node is.\n\n\n\n\n\n**Grouping is the projection's, not this method's.** `GraphOverview.GroupFor` is\npublic precisely so a caller that drills into a group computes the same membership the\noverview did; two definitions of \"which group is this node in\" is the defect signature this\ncodebase has paid for repeatedly (DC-022).\n\n### `Task<CanvasGraph> GroupAsync(string groupId, CancellationToken cancellationToken = default)`\n\nThe member nodes of one overview group — the drill-down from a cluster (semantic zoom) to the\nreal nodes it stands for.\n\n**Remarks.** **Membership is the projection's, via `GraphQuery.GroupId`.** The group whose\nsuper-node the canvas drew carried its id; asked to open it, this hands that id straight back to\n`GraphAsync`, which keeps only the nodes `GraphOverview.GroupFor`\nassigns to it. So \"which nodes are in this group\" has one definition, shared by the overview that\ndrew the group and the drill-down that opens it (the DC-022 trap this avoids).\n\n\n\n\n\n**RootId is the group id.** The result is a rooted view, so the canvas keeps Back and\nOverview live — a group opened with no way back is the keyboard trap the canvas exists to avoid.\n\n### `Task<CanvasGraph> RouteAsync(`\n\nThe declared context a node belongs to, or null.\n\nHow one node reaches another, rendered as the same graph the canvas already draws.\n\n**Remarks.** Null is a real answer and is drawn as such: a node in no context is uncovered, not\nunimportant, and colouring it as though it belonged somewhere would be the inference\nADR-0016 refuses.\n\n**Deliberately returns `CanvasGraph` rather than a route type.** A route\nIS a subgraph, and giving it its own shape would mean a second renderer, a second set of\nbindings and a second place for the two sessions to disagree about what a node looks like.\nThe design session binds what it already binds; only the caption changes.\n\n\n\n\n\n**The caption carries the weakest link.** A route drawn without it looks like a fact\nabout the code, when one inferred edge anywhere along it makes the whole claim inferred.\n\n\n\n\n\n**Every empty case says which one it is.** \"No workspace\", \"that node is not in the\ngraph\" and \"there is no route within eight edges\" are three different situations with three\ndifferent next actions (DC-011).\n\n### `string? ContextFilter { get; set; }`\n\nWhen set, only nodes in this context are drawn.\n\n**Remarks.** The ROOT is kept even when it is outside the filter, and labelled as such. Dropping it would\nleave a graph with no anchor and no way back — a filter that can strip the thing you were\nlooking at is one nobody trusts twice.\n\n## `PaneState`\n\n*enum* — `EvidencePaneViewModel.cs`\n\nThe complete state set for the evidence surface. Loading, Empty and Error are first-class here\nbecause they are the states the urge to complete skips — and an unavailable result rendered as a\nclean empty one is the specific dishonesty this product exists to avoid.\n\n## `ConfidenceBadge`\n\n*record* — `EvidencePaneViewModel.cs`\n\nA confidence badge that never relies on colour. Glyph and text carry the meaning; colour is the\nthird signal, so the badge still reads correctly in high-contrast mode and for a colour-blind\noperator (WCAG 2.2 AA, \"not colour alone\").\n\n| Member | Summary |\n|---|---|\n| `ConfidenceBadge For(VerificationStatus status)` | **(gap)** |\n| `string AccessibleName` | What a screen reader announces. Never just the colour name. |\n\n## `EvidenceRow`\n\n*record* — `EvidencePaneViewModel.cs`\n\nOne row of the accessible evidence list — the permanent keyboard/screen-reader surface.\n\n**Remarks.** The pane lists search results, and a search now matches attribute VALUES as well as identity. A\nrow that came back because one of its members matched is **correct** and reads as a wrong\nresult until it says so — the same defect fixed on the search surface, found here by enumerating\nclient records rather than by anybody noticing the pane.\n\n| Member | Summary |\n|---|---|\n| `string ListLine` | The one line a list shows: the label, its kind, and why it matched. |\n| `string AccessibleName` | **(gap)** |\n\n### `string ListLine`\n\nThe one line a list shows: the label, its kind, and why it matched.\n\n**Remarks.** Composed HERE rather than in the pane, so the visible text and the accessible name are built\nfrom the same fields and cannot drift apart — the chip's two rendering paths drifting is what\nmade the same false claim twice in one surface.\n\n## `ProvenanceSection`\n\n*record* — `EvidencePaneViewModel.cs`\n\nOne section of the provenance pane, in the spec's fixed evidence order.\n\n## `EvidencePaneViewModel`\n\n*class* — `EvidencePaneViewModel.cs`\n\nThe Phase-1 evidence surface: a filterable list plus a provenance pane.\n\n**Remarks.** This is not a fallback for a graph canvas — it is the accessibility equivalent the spec requires\nto exist permanently, exposing the same selected-node identity, provenance, navigation actions and\nresult-limit state as the Phase-2 canvas will.\n\n| Member | Summary |\n|---|---|\n| `PaneState State { get; private set; } = PaneState.Loading` | **(gap)** |\n| `IReadOnlyList<EvidenceRow> Rows { get; private set; } = []` | **(gap)** |\n| `string? SelectedNodeId { get; private set; }` | **(gap)** |\n| `IReadOnlyList<ProvenanceSection> Provenance { get; private set; } = []` | **(gap)** |\n| `string StatusMessage { get; private set; } = \"Loading evidence…\"` | The one string the operator reads when something is off. Always states evidence, never reassurance. |\n| `string? SourceRevision { get; private set; }` | **(gap)** |\n| `string LiveAnnouncement { get; private set; } = string.Empty` | Announced through a live region, so state changes reach a screen reader without motion. |\n| `Task LoadAsync(string searchTerm = \"\", CancellationToken cancellationToken = default)` | **(gap)** |\n| `void MarkStale(string reason)` | Marks the view stale without discarding it — the last successful revision still renders. |\n| `void Filter(string term)` | **(gap)** |\n| `Task SelectAsync(string nodeId, CancellationToken cancellationToken = default)` | Selects a node and builds its provenance in the spec's fixed order: what it is → confidence/provenance → related nodes → source location → actions. |\n| `string EmptySelectionMessage` | Empty-pane copy, shown before anything is selected. |\n\n## `WatcherBoardRow`\n\n*record* — `WatcherBoardPaneViewModel.cs`\n\nOne row of the Message Board surface (US-4): a per-repository post rendered as a dense, scannable,\nscreen-reader-complete line. `Content` is **quarantined untrusted data** -\nit is shown to the operator but never treated as instruction; an injection-shaped post is marked\nwith a visible flag (US-4 #5), a redacted post shows a tombstone, and neither is silently blank.\n\n| Member | Summary |\n|---|---|\n| `string RedactedText = \"[redacted]\"` | The literal shown for a post whose content was redacted (spec line 210). |\n| `string FlagPrefix = \"⚠ flagged · \"` | The prefix a flagged post carries so it reads as untrusted, not as a directive (US-4 #5). |\n| `string DisplayLabel` | The dense one-line label (G6 density). Untrusted content is prefixed, never blank. |\n| `string AccessibleName` | The full row a screen reader announces (WCAG 2.2 AA). |\n| `WatcherBoardRow From(BoardMessage message)` | Builds an honest row: a tombstone shows [redacted], never the (now null) content. |\n\n## `IWatcherBoardQuery`\n\n*interface* — `WatcherBoardPaneViewModel.cs`\n\nThe read seam the Board pane consumes. A null query means no watcher store is wired.\n\n## `WatcherBoardQuery`\n\n*class* — `WatcherBoardPaneViewModel.cs`\n\nFolds the observation store's cross-repo board into the pane's read (US-4). Order preserved.\n\n| Member | Summary |\n|---|---|\n| `IReadOnlyList<BoardMessage> GetMessages()` | **(gap)** |\n\n## `WatcherBoardPaneViewModel`\n\n*class* — `WatcherBoardPaneViewModel.cs`\n\nThe Loomkeeper Message Board surface view model - the compute reader for shared agent communication\n(US-4). Renders posts across repositories with quarantined untrusted content shown but never as\ninstruction, injection flags visible, and redactions as tombstones. Synchronous load (a local store\nfold), so it degrades to an explicit state and never strands on \"Loading…\" (DC-011).\n\n| Member | Summary |\n|---|---|\n| `PaneState State { get; private set; } = PaneState.Loading` | **(gap)** |\n| `IReadOnlyList<WatcherBoardRow> Rows { get; private set; } = []` | **(gap)** |\n| `string StatusMessage { get; private set; } = \"Loading board…\"` | **(gap)** |\n| `string LiveAnnouncement { get; private set; } = string.Empty` | **(gap)** |\n| `void Load()` | **(gap)** |\n\n## `WatcherDaydreamRow`\n\n*record* — `WatcherDaydreamPaneViewModel.cs`\n\nOne row of the Daydreams surface (US-9): a pattern, where it stands, and what is stopping it.\n\n**Remarks.** **The block reason is part of the row, not a tooltip.** A candidate that cannot be\npromoted has to say *which* prerequisite is missing where it is read. \"Promotion disabled\"\nwith the reason a click away is the empty state DC-087 registered — a surface stating a\ncondition it never explains.\n\n\n\n\n\n**No content from an agent appears here.** A signature is built from typed values only,\nso unlike the Message Board there is no quarantined prose to render and no injection flag to\nshow. The rows are describable entirely from the store's own vocabulary §4a.)\n\n| Member | Summary |\n|---|---|\n| `string? Unavailable` | **(gap)** |\n| `int UnreadableLines` | **(gap)** |\n| `string? ReachFinding` | The probe's finding, or `null` when no probe is wired. |\n| `IReadOnlyList<DaydreamCandidate> GetCandidates()` | **(gap)** |\n\n### `string? ReachFinding`\n\nThe probe's finding, or `null` when no probe is wired.\n\n**Remarks.** Optional so a host with no scored episodes to compare against gets no finding rather than a\nfabricated one — an absent probe must never render as \"nothing to report\", which is the\ndistinction the probe exists to make in the first place.\n\n## `WatcherDaydreamPaneViewModel`\n\n*class* — `WatcherDaydreamPaneViewModel.cs`\n\nThe Loomkeeper Daydreams surface view model (US-9) — three stages, each with an honest empty\nstate, and promotion visible only where it is actually possible.\n\n**Remarks.** Synchronous load (a local store fold), so it degrades to an explicit state and never strands on\n\"Loading…\" (DC-011).\n\n| Member | Summary |\n|---|---|\n| `IReadOnlyList<string> Stages { get; } = [\"Observations\", \"Candidates\", \"Promoted\"]` | The stages in reading order, so an empty one is still shown and named. |\n| `PaneState State { get; private set; } = PaneState.Loading` | **(gap)** |\n| `IReadOnlyList<WatcherDaydreamRow> Rows { get; private set; } = []` | **(gap)** |\n| `string StatusMessage { get; private set; } = \"Loading daydreams…\"` | **(gap)** |\n| `string LiveAnnouncement { get; private set; } = string.Empty` | **(gap)** |\n| `IReadOnlyList<WatcherDaydreamRow> RowsFor(string stage)` | Rows for one stage, in reading order. An empty stage returns an empty list. |\n| `string EmptyStateFor(string stage)` | What to show under a stage with nothing in it. |\n| `void Load()` | **(gap)** |\n\n### `string EmptyStateFor(string stage)`\n\nWhat to show under a stage with nothing in it.\n\n**Remarks.** Each names only what it has looked at. \"Nothing to show\" is complete; \"nothing to show\nbecause X\" is a claim, and a surface that has not checked X is not entitled to make it\n(DC-087). None of these mentions the extractor, the scorer, or any subsystem this pane does\nnot read.\n\n## `WatcherLeaderboardRow`\n\n*record* — `WatcherLeaderboardPaneViewModel.cs`\n\nOne row of the Leaderboard surface (US-14): a facet cell within one (task class, score schema)\nsegment. A cell below the cohort minimum or one that resolves to a single operator renders\n**Not Comparable** with its reason, never a rank (US-14/US-10 - a single operator is not\nde-anonymised off a public board). Comparable cells carry rank, cohort and median Weave. There is\ndeliberately no single optimisable scalar the operator can chase (US-16).\n\n| Member | Summary |\n|---|---|\n| `string NotComparableText = \"Not Comparable\"` | The literal a non-comparable cell shows in place of a rank (US-10/US-14). |\n| `string RankText` | **(gap)** |\n| `string MedianText` | **(gap)** |\n| `string DisplayLabel` | The dense one-line label (G6 density). |\n| `string AccessibleName` | The full row a screen reader announces (WCAG 2.2 AA). |\n| `WatcherLeaderboardRow From(Leaderboard board, LeaderboardCell cell)` | **(gap)** |\n\n## `IWatcherLeaderboardQuery`\n\n*interface* — `WatcherLeaderboardPaneViewModel.cs`\n\nThe read seam the Leaderboard pane consumes. A null query means no watcher store is wired.\n\n## `WatcherLeaderboardQuery`\n\n*class* — `WatcherLeaderboardPaneViewModel.cs`\n\nFolds the store's materialised scored episodes into the leaderboard's read (US-14).\n\n| Member | Summary |\n|---|---|\n| `IReadOnlyList<ScoredEpisode> GetScoredEpisodes()` | **(gap)** |\n\n## `IWatcherDisputeQuery`\n\n*interface* — `WatcherLeaderboardPaneViewModel.cs`\n\nThe read seam for the derived Disputed state (US-16). A null query means disputes are not shown.\n\n## `WatcherDisputeQuery`\n\n*class* — `WatcherLeaderboardPaneViewModel.cs`\n\nFolds the store's append-only disputes into the disputed-episode set (US-16 / rule 12).\n\n| Member | Summary |\n|---|---|\n| `IReadOnlySet<string> DisputedEpisodeIds()` | **(gap)** |\n\n## `WatcherLeaderboardPaneViewModel`\n\n*class* — `WatcherLeaderboardPaneViewModel.cs`\n\nThe Loomkeeper Leaderboard surface view model - the comparative view of agent effectiveness\n(US-14). It discovers the distinct (task class, score schema) segments present in the scored\nepisodes and composes one leaderboard per segment through `LeaderboardComposer` (never\ncomparing across segments - rule 11), flattening the cells into honest rows: a rank where\ncomparable, \"Not Comparable\" with a reason where the cohort is too small or single-operator\n(US-10). Synchronous load; degrades to an explicit state (DC-011).\n\n| Member | Summary |\n|---|---|\n| `PaneState State { get; private set; } = PaneState.Loading` | **(gap)** |\n| `IReadOnlyList<WatcherLeaderboardRow> Rows { get; private set; } = []` | **(gap)** |\n| `string StatusMessage { get; private set; } = \"Loading leaderboard…\"` | **(gap)** |\n| `string LiveAnnouncement { get; private set; } = string.Empty` | **(gap)** |\n| `void Load()` | **(gap)** |\n\n## `LivenessBadge`\n\n*record* — `WatcherSessionsPaneViewModel.cs`\n\nA liveness badge that never relies on colour. Glyph and text carry the meaning; colour is the third\nsignal (token), so the badge reads correctly in high-contrast and for a colour-blind operator\n(WCAG 2.2 AA, \"not colour alone\" - mirrors `ConfidenceBadge`).\n\n| Member | Summary |\n|---|---|\n| `LivenessBadge For(LivenessState state)` | **(gap)** |\n| `string AccessibleName` | What a screen reader announces. Never just the colour name. |\n\n## `WatcherSessionText`\n\n*class* — `WatcherSessionsPaneViewModel.cs`\n\nThe literal shown when a dimension was never observed - honest, never blank (spec US-13).\n\n| Member | Summary |\n|---|---|\n| `string NotRecorded = \"Not Recorded\"` | **(gap)** |\n\n## `WatcherSessionRow`\n\n*record* — `WatcherSessionsPaneViewModel.cs`\n\nOne session row of the Sessions surface - a dense, scannable, screen-reader-complete line. An\nabsent harness or model renders `NotRecorded`, never blank and never\na guess.\n\n| Member | Summary |\n|---|---|\n| `string ShortId` | A short, stable handle for one session — the thing that tells two otherwise identical rows apart. |\n| `string Location` | Repository and branch, separated so a branch name cannot be mistaken for a path. |\n| `string DisputedText = \"⚠ Disputed\"` | The prefix a session with a disputed episode carries (US-16 discoverability, no colour-alone). |\n| `string DisplayLabel` | The dense one-line label (G6 Multi-Panel Data Terminal density). |\n| `string AccessibleName` | The full row a screen reader announces (WCAG 2.2 AA). |\n| `WatcherSessionRow From(WatcherSessionSnapshot snapshot)` | Builds an honest row from a snapshot: null harness/model become Not Recorded. |\n\n### `string ShortId`\n\nA short, stable handle for one session — the thing that tells two otherwise identical rows\napart.\n\n**Remarks.** Reported from the running product: three live sessions rendered as three IDENTICAL\nstrings, because every visible field (agent, repository, branch) was the same for all of\nthem. Nothing on the surface said WHICH session a row was, and the session id was on the\nrecord the whole time without being shown.\n\n\n\n\n\nEight characters, not the whole id. A full `Guid.ToString(\"n\")` is 32 characters of\nnoise that pushes the readable part off the line — and the job here is discrimination between\nthe handful of sessions on screen, not global uniqueness, which the id itself still carries.\n\n### `string Location`\n\nRepository and branch, separated so a branch name cannot be mistaken for a path.\n\n**Remarks.** This used to be `{Repository}/{Worktree}`, which rendered\n`TheTerrace/docs/fix-broken-design-links` — read, reasonably, as a directory path, and\nthe reporter asked why sessions were not at the repository root. They were: that is the repo\n`TheTerrace` on branch `docs/fix-broken-design-links`.\n\n\n\n\n\nA `/` separator collides with the dominant branch-naming convention — `docs/`,\n`feature/`, `fix/` — so the ambiguity was not an edge case but the common case.\n`@` cannot appear alone in a git ref, so it can never be confused for part of either\nside.\n\n### `string AccessibleName`\n\nThe full row a screen reader announces (WCAG 2.2 AA).\n\n**Remarks.** Spoken as \"on branch\" rather than read as `@`: the symbol removes a VISUAL ambiguity and\nwould introduce an audible one, since a screen reader says \"at\" and a listener has no way to\nknow it separates two fields.\n\n## `WatcherSessionSnapshot`\n\n*record* — `WatcherSessionsPaneViewModel.cs`\n\nA point-in-time read of one session: its binding, computed liveness, span count, and Disputed state.\n\n## `IWatcherSessionsQuery`\n\n*interface* — `WatcherSessionsPaneViewModel.cs`\n\nThe read seam the Sessions pane consumes. A null pane query means no watcher store is wired.\n\n## `WatcherSessionsQuery`\n\n*class* — `WatcherSessionsPaneViewModel.cs`\n\nFolds the observation store + liveness into session snapshots - the deterministic compute reader\n(DM7: liveness is computed here, never stored). Ordered by the store's own enumeration\n(repo, worktree, session), which the pane preserves.\n\n| Member | Summary |\n|---|---|\n| `IReadOnlyList<WatcherSessionSnapshot> GetSessions()` | **(gap)** |\n\n## `WatcherSessionsPaneViewModel`\n\n*class* — `WatcherSessionsPaneViewModel.cs`\n\nThe Loomkeeper Sessions surface view model - the compute reader that closes the Phase-1\nchange-surface. It renders observed sessions honestly: Not Recorded for an unproven harness/model,\na no-colour-alone liveness badge, and the full state set. Mirrors `EvidencePaneViewModel`,\nbut its load is **synchronous** (a local store fold, no I/O) - so it can never strand on a\n\"Loading…\" message the way an async construction-time binding did (DC-011).\n\n| Member | Summary |\n|---|---|\n| `PaneState State { get; private set; } = PaneState.Loading` | **(gap)** |\n| `IReadOnlyList<WatcherSessionRow> Rows { get; private set; } = []` | **(gap)** |\n| `string StatusMessage { get; private set; } = \"Loading sessions…\"` | The one string the operator reads - always evidence, never reassurance. |\n| `string LiveAnnouncement { get; private set; } = string.Empty` | Announced through a live region so a state change reaches a screen reader without motion. |\n| `void Load()` | Loads the sessions synchronously. Degrades to an explicit state, never a blank success. |\n\n## `WorkspaceDiagnostics`\n\n*record* — `WorkspaceDiagnosticsViewModel.cs`\n\nWhat the operator can see about the daemon behind the shell.\n\n| Member | Summary |\n|---|---|\n| `string Describe()` | One paragraph for the announcement channel and the diagnostics pane. |\n\n## `WorkspaceDiagnosticsViewModel`\n\n*class* — `WorkspaceDiagnosticsViewModel.cs`\n\nReads the daemon's operational state so the shell can show it.\n\n**Remarks.** **Read-only, deliberately.** Upgrade and rollback are choreographed against a store that\na running binary may not be able to read halfway through — the ordering (snapshot, journal,\nmigrate, gate, commit) exists precisely because a half-finished upgrade is worse than one that\nnever started. A button that starts that from inside the app being upgraded is not a convenience;\nthis surfaces the state and names what a rollback would do, and the act itself stays with the\nBootstrap.\n\n\n\n\n\n**The MCP tool list is the registered set, not a guess.** It is read from the gateway so\na tool added without appearing here would be a discrepancy rather than a documentation lag.\n\n| Member | Summary |\n|---|---|\n| `WorkspaceDiagnostics Read()` | **(gap)** |\n| `IReadOnlyList<string> McpToolGatewayNames { get; } =` | The tools the MCP gateway exposes. Local-only and read-only by ADR-0004. |\n\n### `IReadOnlyList<string> McpToolGatewayNames { get; } =`\n\nThe tools the MCP gateway exposes. Local-only and read-only by ADR-0004.\n\n**Remarks.** **Derived from the gateway, not restated.** This was a hand-written\n`[\"describe\", \"impact\", \"find\", \"knowledge\"]` and it was wrong in both directions:\n`impact` and `knowledge` are daemon IPC operations and have never been gateway\ntools, while `standing` — added for US-16 — was missing. An operator reading the\ndiagnostics was told about two tools that do not exist and not told about one that\ndoes.\n\n\n\n\n\nA second authority on what a component exposes disagrees with it eventually; this one\ndisagreed on three of five entries. Reflected over the methods that actually return an\n`McpToolResult`, so a tool added tomorrow appears here without\nanyone remembering this list exists (DC-021).\n"}, {"id": "api-aide-core-projections", "title": "AiDe.Core.Projections", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Projections`\n\n**47 public types · 66 public members · 65% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `ContentMatch`\n\n*record* — `ContentSearch.cs`\n\nOne line of a workspace file that contains the term.\n\n## `ContentSearchResult`\n\n*record* — `ContentSearch.cs`\n\nWhat a corpus content search found, and what it did not look at.\n\n## `ContextView`\n\n*record* — `ContextProjection.cs`\n\nOne context as the domain view draws it.\n\n## `CrossingMember`\n\n*record* — `ContextProjection.cs`\n\nOne symbol-level edge that crosses a context boundary.\n\n## `ContextEdge`\n\n*record* — `ContextProjection.cs`\n\nOne relationship between contexts, and how much traffic it carries.\n\n**Remarks.** **A count is not evidence.** \"Editorial → Football, 47 edges\" is a number the user cannot\ncheck, act on, or disagree with; the 47 edges are the thing they came for, and until the count\ncan be opened it is an assertion about their code that they have to take on trust. Capped\nbecause a crossing can run to thousands and a pane that renders all of them is a pane that\nstops responding — `Weight` stays the true total, so the cap never becomes a\nquieter wrong number.\n\n| Member | Summary |\n|---|---|\n| `int MemberCap = 200` | **(gap)** |\n| `double DominanceShare = 0.5` | The share of listed members one object must reach before the crossing is called dominated. |\n| `int Undisclosed` | How many edges exist beyond the ones listed. |\n| `CrossingMember? DominantTarget` | The single object most of this crossing points at, or null when no one object dominates. |\n| `int DominantCount` | How many listed members point at `DominantTarget`. |\n\n### `double DominanceShare = 0.5`\n\nThe share of listed members one object must reach before the crossing is called dominated.\n\n**Remarks.** Half. Not tuned — chosen because \"most of this crossing is one thing\" is the claim being\nmade, and a majority is what that sentence means. A lower bar would flag ordinary coupling\nto a widely-used type; a higher one would have missed nothing real yet and is not worth the\nextra digit of false precision.\n\n### `CrossingMember? DominantTarget`\n\nThe single object most of this crossing points at, or null when no one object dominates.\n\n**Remarks.** **Found by eye once, so now it is computed.** On a real repository 57 of the 72\nFootball-to-Operations edges were one class — `AppDbContext` — which made a boundary\nthat mostly holds look like one that never did. Nothing in the tool said so; a human read a\nlist. A signal a person has to notice is a signal that gets noticed once.\n\n\n\n\n\nComputed over the LISTED members, so a capped crossing reports the share of what it\nactually examined rather than extrapolating to the full weight. `Undisclosed`\nstays beside it, because a majority of 200 out of 4,000 is a different statement.\n\n## `UncoveredGroup`\n\n*record* — `ContextProjection.cs`\n\nSymbols outside every context, gathered by the namespace they live in.\n\n**Remarks.** **A percentage is not a task.** \"68% covered\" tells the user a number and gives them nowhere\nto start; six namespaces ranked by size tells them which declaration to write next. The grouping\nis presentation only — nothing here assigns a symbol to a context, because a symbol placed in\n\"the nearest\" context is inference dressed as a declaration, which is exactly what ADR-0016\nrejected folder convention for.\n\n## `ContextMapView`\n\n*record* — `ContextProjection.cs`\n\nThe domain view: contexts, what connects them, and what belongs to none.\n\n**Remarks.** **Absence is not coverage.** Measured on a second repository, which has no\n`bounded-contexts.yaml`: the pane reported zero uncovered symbols and said \"every declared\nsymbol belongs to a context\", which is the sentence a fully-mapped codebase produces. Nothing was\nwrong with the arithmetic — no map means no uncovered list — and that is exactly why it needed a\nseparate field rather than a cleverer count.\n\n| Member | Summary |\n|---|---|\n| `bool IsValid` | **(gap)** |\n\n## `ContextProjection`\n\n*class* — `ContextProjection.cs`\n\nGroups the graph by declared bounded context (ADR-0016).\n\n**Remarks.** **This is what makes the joins legible.** A `maps_to` edge inside one context is\nunremarkable; the same edge crossing two contexts is a coupling someone chose, and until the\ncontexts are drawn there is no way to tell those apart.\n\n\n\n\n\n**Uncovered symbols are counted, never assigned.** Placing a symbol in \"the nearest\"\ncontext would be inference dressed as a declaration — the exact thing ADR-0016 rejected folder\nconvention for.\n\n| Member | Summary |\n|---|---|\n| `ContextMapView Compute()` | **(gap)** |\n\n## `EvidenceRead`\n\n*record* — `EvidenceRead.cs`\n\nA read of the evidence, and how much of it the read actually saw.\n\n**Remarks.** **Every number the panes show is computed from a bounded read.** The shell searches with\na result cap, describes a bounded number of those matches, and takes a bounded number of\nneighbours from each. On a repository the size of the ones measured so far all three caps are\nslack, and nothing about the output would change if they were not — the crossing counts, the join\ncounts and the coverage percentage would simply be smaller, and still be presented as facts.\n\n\n\n\n\n**This is the same defect this project keeps finding, one layer up.** A cap that\nsilently truncates turns a correct count into a confident wrong one: the member cap on a crossing\nkeeps its true weight beside the listed members for exactly this reason, and the coverage\ndenominator was fixed twice for counting the wrong population. A bound the user cannot see is a\nbound they cannot allow for.\n\n\n\n\n\n**It degrades to \"not known\", never to a plausible wrong number.** When the read is\ncomplete `Shortfall` is null and nothing is said; when it is not, it names which cap\nbit and by how much.\n\n| Member | Summary |\n|---|---|\n| `EvidenceRead Empty { get; } = new([], 0, 0, 0, 0)` | **(gap)** |\n| `bool IsComplete` | True when every matched node was read and none hit the neighbour limit. |\n| `string? Shortfall` | What the read did not see, in words, or null when it saw everything. |\n\n### `string? Shortfall`\n\nWhat the read did not see, in words, or null when it saw everything.\n\n**Remarks.** Both causes are reported, not just the first. They are different problems with different\nfixes — one is \"this workspace is bigger than the search cap\", the other is \"these particular\nnodes are unusually connected\" — and collapsing them into one sentence would leave the reader\nguessing which they have.\n\n## `GraphCluster`\n\n*record* — `GraphOverview.cs`\n\nOne group of nodes, drawn as a single thing.\n\n## `ClusterEdge`\n\n*record* — `GraphOverview.cs`\n\nA relationship between two groups, and how much of it there is.\n\n## `WorkspaceOverview`\n\n*record* — `GraphOverview.cs`\n\nThe workspace at a distance, and what it stands for.\n\n## `OverviewQuery`\n\n*record* — `GraphOverview.cs`\n\nHow to summarise the workspace.\n\n## `GraphOverview`\n\n*class* — `GraphOverview.cs`\n\nThe workspace summarised into groups, for a graph too large to show node by node.\n\n**Remarks.** **The half of DC-035 that was still open.** The bounded default fixed the transport\nfailure by drawing 1,500 of 2,118 declared nodes and saying so — which is honest, and is still a\ntruncation rather than an overview. A user looking at a repository wants to see its SHAPE first;\n1,500 dots is not a shape, and the 618 that were dropped are not the difference between\nunderstanding it and not.\n\n\n\n\n\n**Grouping by identifier prefix, and why that is not a hack.** Every id in this graph is\nalready hierarchical because the languages are: a C# symbol is\n`TheTerrace.Features.Competitions.Season`, a module is `src/app/models`. The first\n`Depth` segments name the thing a developer would call \"where that lives\", and increasing\nDepth is exactly the zoom control a level-of-detail view needs. No clustering algorithm is used,\ndeliberately: a community-detection result is unstable under small changes to the graph, so the\nsame repository would regroup between two indexes and the picture would move for reasons the user\ncannot see.\n\n\n\n\n\n**What it must never do is hide the count.** A group drawn as one dot standing for 240\ntypes is only honest while the 240 is on it — that is the whole difference between an overview and\na smaller lie.\n\n| Member | Summary |\n|---|---|\n| `int MaxDepth = 6` | Deepest grouping worth offering; past this a group is usually one node. |\n| `WorkspaceOverview Summarise(WorkspaceGraph graph, OverviewQuery query)` | Summarise a graph that has already been projected and filtered. |\n| `string GroupFor(string id, int depth)` | The group an id belongs to at a given depth. |\n\n### `string GroupFor(string id, int depth)`\n\nThe group an id belongs to at a given depth.\n\n**Remarks.** **Public because a renderer needs the SAME answer.** A canvas colouring detail nodes\nby group, or drawing a node inside its cluster, has to agree with the overview about which\ngroup a node is in. Two definitions of one grouping is the shape of DC-022 — a predicate with\ntwo producers — and the divergence would show as a node drawn in the wrong cluster, which\nlooks like a layout bug and is not one.\n\n\n\n\n\nBoth separators are handled because both are real: C# symbols are dotted, modules are paths,\nand a scope-prefixed id like `bicep:main#siteName` has neither. An id with fewer segments\nthan the depth IS its own group — grouping it under a shorter prefix that no other node shares\nwould invent a container the repository does not have.\n\n## `PathQuery`\n\n*record* — `GraphPaths.cs`\n\nWhich route through the graph to look for.\n\n## `GraphPath`\n\n*record* — `GraphPaths.cs`\n\nOne route, as the edges that make it up.\n\n| Member | Summary |\n|---|---|\n| `VerificationStatus Status` | The weakest evidence anywhere on the route. |\n\n### `VerificationStatus Status`\n\nThe weakest evidence anywhere on the route.\n\n**Remarks.** A chain is only as good as its worst link: one Inferred edge in a run of Verified ones makes\nthe whole claim inferred, and presenting the route without saying so would launder a guess\ninto a fact. `VerificationStatus` is ordered strongest-first, so the weakest is\nthe maximum.\n\n## `PathResult`\n\n*record* — `GraphPaths.cs`\n\nThe routes found, and what the search could not tell you.\n\n## `GraphPaths`\n\n*class* — `GraphPaths.cs`\n\nHow one node reaches another.\n\n**Remarks.** **The question impact analysis is actually asking.** \"What does this touch\" is answered\nby a neighbourhood; \"how does the scheduler end up writing to the fixtures table\" is a route, and\nuntil now nothing could answer it. A user who can see two nodes and an edge count still cannot\ntell whether a change here reaches there, or through what.\n\n\n\n\n\n**Shortest routes only, and it says so.** Enumerating every path between two nodes in a\ngraph of 8,602 edges is exponential and would not be read if it succeeded. This returns the\nSHORTEST routes — all of them at that length, up to the cap — because the shortest route is the\none a reader can hold, and a longer one that avoids it is a different question (\"is there another\nway\") that should be asked deliberately rather than answered by accident.\n\n\n\n\n\n**Directed, because dependency is directed.** `A depends_on B` does not mean B\ndepends on A, and a route that walks an edge backwards would answer \"these are related\" while\nlooking like \"a change here reaches there\".\n\n| Member | Summary |\n|---|---|\n| `PathResult Find(WorkspaceGraph graph, PathQuery query)` | The shortest routes from one node to another, within the graph the query names. |\n\n## `GraphNode`\n\n*record* — `GraphProjection.cs`\n\nOne node of the whole graph, with how connected it is.\n\n**Remarks.** **Without this the graph is mostly not the user's code.** Measured on a real repository: the\nsix most-connected nodes were `string`, `int`, `Task<TResult>`,\n`DateTimeOffset`, `IReadOnlyList<T>` and `Guid` — 773 edges to\n`string` alone. Ranking by raw degree therefore puts the BCL at the centre of a picture of\nsomebody's domain, and capping by raw degree drops their code to keep it.\n\n**Reported by the user: the Knowledge chip read 0 on a repository holding 2,343 knowledge\nnodes.** The graph carried each node's fine `Kind` — and on that repository the knowledge\nkinds are `spec` and `knowledge-epl-fan-platform`, which is a name that repository\ninvented. A chip matching a fixed list of type names cannot work across repositories, and\nwidening the list only moves the problem to the next repository (DC-033).\n\nThe coarse class is a DECLARED dimension — the producer says it (`node_class`) — so a filter\ncan ask the question directly instead of recognising spellings.\n\n## `GraphEdge`\n\n*record* — `GraphProjection.cs`\n\nOne relationship, with the status of the evidence behind it.\n\n## `GraphQuery`\n\n*record* — `GraphProjection.cs`\n\nWhich part of the graph to build.\n\n**Remarks.** **Why filtering belongs HERE and not at the caller.** A tool that wants the domain model\nwould otherwise fetch 2,813 nodes across a pipe and discard nine tenths of them, and — worse —\nthe CAP would have already chosen which nodes to send, by a ranking computed over a graph the\ncaller did not want. Filtering after a cap gives you the wrong 5,000 nodes trimmed to the right\nkind, and nothing in the result says so.\n\n\n\n\n\nSo the filter runs BEFORE the cap, degree is computed over what survives it, and \"most\nconnected\" means most connected *in the graph that was asked for*.\n\n\n\n\n\n**The group filter takes no depth, on purpose.** A group id already states its own depth\n— `TheTerrace.Features` is two segments and `src/app` is two — so the depth is read back\nout of the id rather than passed alongside it. A separate parameter would let a caller ask for\n`TheTerrace.Features` at depth 3 and receive nothing, with no error and no way to tell that\nfrom an empty group.\n\n**Why excluding rather than selecting.** MEASURED on TheTerrace: the canvas's own default\nspends **702,425 of 852,680 bytes on edges** — 82% — and two predicates are 74% of them\n(`depends_on` 2,155, `calls` 1,272). Edges, not nodes, are what fills the frame, so the\nonly lever that buys a bigger picture is dropping a kind.\n\n\n\n\n\nAn *include* list would be a caller restating the extractors' vocabulary, and would go\nstale silently the first time a reader emitted a predicate nobody had added to it — the shape this\ncodebase has paid for repeatedly (DC-042, DC-022). Excluding means a new predicate appears in\nevery view by default, which is the safe direction: a caller sees something unexpected rather than\nsilently missing something.\n\n\n\n\n\nApplied BEFORE the cap, like every other filter here. An excluded edge frees its bytes for\nnodes rather than being trimmed after the ranking has already been paid for (DC-035).\n\n## `WorkspaceGraph`\n\n*record* — `GraphProjection.cs`\n\nThe whole graph, and what it left out.\n\n**Remarks.** **Why totals need their own field when the node total does not.** The overall total is\nrecoverable as `Nodes.Count + Omitted`, so a surface can already say \"1,500 of 2,992\". A\nper-category total cannot be recovered that way: the omitted nodes are gone, and with them any\nway to know what they were.\n\n\n\n\n\n**And it is not a detail.** MEASURED on a real workspace: 878 knowledge nodes, median\nrelation degree **0**, against a median of 4 for everything else — so under a\nmost-connected-first cap roughly 620 of them are never candidates for a slot. The surface\nreported \"Knowledge 257\" with no denominator, which is true about what was drawn and reads as a\nstatement about what exists.\n\n\n\n\n\n**By KIND, not by the surface's categories.** Code / Data / Infra / Specs / Knowledge is\nthe canvas's taxonomy, and Core teaching itself that taxonomy would put a UI decision in the\nprojection — where it would then be wrong for every other consumer. Kinds are what Core knows;\nthe surface already has a `categoryOf` and can run it over these totals to get its own\ndenominators. MEASURED: 29 kinds, ~636 bytes.\n\n\n\n\n\n**The knowledge flag travels with each kind, rather than kind alone.** Measured on a\nreal workspace, no kind appears both as knowledge and as source — so kind alone WOULD work\ntoday. That is a property of one corpus, not a guarantee, and a total that is silently wrong in\na repository where a kind is used both ways would be indistinguishable from a correct one.\n\n## `GraphKindTotal`\n\n*record* — `GraphProjection.cs`\n\nHow many nodes of one kind the workspace declares, drawn or not.\n\n## `GraphProjection`\n\n*class* — `GraphProjection.cs`\n\nThe whole workspace as a graph, rather than one node and its neighbours.\n\n**Remarks.** **The graph surface had never shown the graph.** It asked for one node\n(`FindAsync(\"\", 1)`) and then that node's neighbours, so a workspace of 12,100 assertions and\n2,164 nodes rendered as **two** — the alphabetically first symbol and its single neighbour.\nReported by the user, comparing it against the same repository in Obsidian.\n\n\n\n\n\n**Attributes are not edges.** `has_type`, `declared_in`, `api_version` and\nthe rest describe a node; drawing them puts the string \"class\" in the graph as a thing that other\nthings point at. The same rule the search already applies, applied here — one definition, in\n`Attributes`, used by both.\n\n\n\n\n\n**Bounded by DEGREE, not by name.** When a cap applies, the nodes kept are the ones the\ngraph is actually about: an alphabetical cut of a two-thousand-node graph is arbitrary, and looks\nexactly like a complete small graph. What was dropped is counted, so a partial view can say so.\n\n| Member | Summary |\n|---|---|\n| `int DefaultMaxNodes = 5_000` | Nodes returned before the cap applies. |\n| `WorkspaceGraph Compute(int maxNodes = DefaultMaxNodes)` | **(gap)** |\n| `WorkspaceGraph Compute(GraphQuery query)` | **(gap)** |\n\n### `int DefaultMaxNodes = 5_000`\n\nNodes returned before the cap applies.\n\n**Remarks.** Large enough that no repository measured so far reaches it, so the common case is the WHOLE\ngraph. A cap exists because a surface that receives ten million nodes stops responding, and a\npane that stops responding tells the user nothing at all.\n\n## `IWorkspaceQueries`\n\n*interface* — `IWorkspaceQueries.cs`\n\nThe workspace's read surface, however it is reached.\n\n**Remarks.** **This seam exists so the shell does not know whether the core is in this process.**\nADR-0009 keeps both hosting modes supported — in-process first, then a separate daemon — and a\nUI written against one of them is a UI that has to be rewritten to get the other. The whole\ndifference between the two is which implementation is handed in.\n\n\n\n\n\n**Asynchronous because the remote case is the real one.** A synchronous seam would force\nevery remote call to block a thread, and on a UI thread that is a frozen window for the length of\na pipe round trip. The in-process adapter completes immediately, which costs it nothing.\n\n\n\n\n\n**The result types are the core's own.** A parallel set of \"view\" types would be a second\ndefinition of every result to keep in step, and the first divergence would show up as a field\npresent one way and missing the other.\n\n## `LocalWorkspaceQueries`\n\n*class* — `IWorkspaceQueries.cs`\n\nThe read surface answered by a `ProjectionService` in this process.\n\n**Remarks.** Completed tasks rather than `Task.Run`: the projections are synchronous and fast, and moving\nthem to a thread pool thread would add a context switch and a scheduling hop to hide latency that\nis not there.\n\n| Member | Summary |\n|---|---|\n| `Task<DescribeResult> DescribeAsync(` | **(gap)** |\n| `Task<ImpactResult> ImpactAsync(` | **(gap)** |\n| `Task<FindResult> FindAsync(` | **(gap)** |\n| `Task<ContentSearchResult> SearchContentAsync(` | **(gap)** |\n| `Task<InteractionResult> InteractionAsync(` | **(gap)** |\n| `Task<KnowledgeResult> KnowledgeAsync(` | **(gap)** |\n| `Task<NodeContent> NodeContentAsync(string nodeId, CancellationToken cancellationToken)` | **(gap)** |\n| `Task<EvidencePage> EvidenceAsync(` | **(gap)** |\n| `Task<WorkspaceGraph> GraphAsync(GraphQuery query, CancellationToken cancellationToken)` | **(gap)** |\n| `Task<PathResult> PathsAsync(PathQuery query, CancellationToken cancellationToken)` | **(gap)** |\n| `Task<WorkspaceOverview> OverviewAsync(OverviewQuery query, CancellationToken cancellationToken)` | **(gap)** |\n\n## `InteractionMessage`\n\n*record* — `Interaction.cs`\n\nOne message in an interaction: who called whom, and what they called.\n\n## `InteractionResult`\n\n*record* — `Interaction.cs`\n\nOne caller's outgoing calls in order — the data a UML sequence diagram draws.\n\n## `JoinEdge`\n\n*record* — `JoinProjection.cs`\n\nOne join between artifact types, with how it was established.\n\n## `JoinResult`\n\n*record* — `JoinProjection.cs`\n\nThe joins found, and what stopped more from being found.\n\n## `JoinProjection`\n\n*class* — `JoinProjection.cs`\n\nJoins code, schema and infrastructure evidence.\n\n**Remarks.** **Confidence is the deliverable, not the edge.** An inferred join across three artifacts\nlooks more impressive than a verified one inside a single file, and it is exactly the kind of\nclaim a user acts on without checking. So every edge carries how it was established, and a\nconvention-derived join is `Inferred` however obvious it looks.\n\n\n\n\n\n**Joins are computed, never stored.** Two definitions of one quantity is a defect\nsignature: if a join were written back as a fact, the store would hold both the evidence and a\nderived claim about it, and they would drift the first time an extractor changed. This reads the\nsame assertions every other projection reads.\n\n| Member | Summary |\n|---|---|\n| `JoinResult Compute()` | **(gap)** |\n\n## `NodeContentKind`\n\n*enum* — `NodeContent.cs`\n\nHow a node's content should be rendered — the authority's call, not the reader's guess.\n\n**Remarks.** ADR-0018 node-content-reader-contract. The reader branches on this rather than inspecting the content or the node id, so a\ndiagram, a proof or a binary comes back as `None` and gets the metadata-and-edges\nfallback instead of being mis-rendered as text that happens not to be text.\n\n## `NodeContent`\n\n*record* — `NodeContent.cs`\n\nOne node's content, for a reader that has the node and wants what is behind it.\n\n**Remarks.** **Bounded like every other response.** A large file returns the first N bytes and says so,\nnever an oversized frame — the same rule that INV-0003 established for the graph, applied to the\none artifact a reader asked for rather than to 1,500 it did not.\n\n\n\n\n\n**Why the authority reads the file and the client does not.** The App reading files itself\nwould make two authorities on what a node's content is, and they would disagree the moment one\nresolved a path differently (DC-022). It would also put file access on the wrong side of the trust\nboundary: the daemon confines every read to the workspace root, and a client doing its own reading\nanswers to nothing.\n\n## `ProjectionErrorCodes`\n\n*class* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n| Member | Summary |\n|---|---|\n| `string LimitExceeded = \"AIDE-MCP-LIMIT-EXCEEDED\"` | **(gap)** |\n| `string NodeUnknown = \"AIDE-PROJECTION-NODE-UNKNOWN\"` | **(gap)** |\n\n## `ResultBounds`\n\n*record* — `ProjectionService.cs`\n\nWhat a bounded result actually returned, and what it left out. Every projection carries this:\na truncated result that does not publish its omission is indistinguishable from a complete one,\nwhich is how a \"bounded\" tool silently becomes an unbounded context assembler.\n\n## `EdgeView`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `NodeView`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `DescribeResult`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n**Remarks.** **INV-0004.** The canvas hardcoded `\"source\"` as every neighbour's kind because the\ndescribe result did not carry one — so a drill-down showed a table, a bicep resource and a class\nas the same thing, and the filter could not tell them apart. The kind is a property of the\nNEIGHBOUR, and only the projection can read it; a renderer inventing a default is a renderer\nstating a fact it does not have.\n\n\n\n\n\n**`KnowledgeIds` closes the same shape one field over.** The view model carried a\nwritten-down gap — `IsKnowledge` defaulted to `false` on every drill-down neighbour\nbecause a kind is not a node class, so the view \"genuinely cannot tell knowledge from source\".\n`false` under-counted rather than mislabelled, which is the safer direction and still a\nrenderer answering a question it had no data for. It matters more now that the graph reports\n`NotInView`: the default view is a map of the code, and a knowledge node the budget could\nnever draw is reached by drill-down instead — so the drill-down has to know what it is\nholding.\n\n## `ImpactResult`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `FindMatch`\n\n*record* — `ProjectionService.cs`\n\nOne search hit, and why it is one.\n\n**Remarks.** The two fields are ADDED rather than replacing anything, and both are optional to read. A client\nthat ignores them behaves exactly as before — which is what makes this a widening of the contract\nand not a break of it.\n\n## `FindResult`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `EvidencePage`\n\n*record* — `ProjectionService.cs`\n\nOne page of current evidence, and where to continue.\n\n## `AuthorshipOrigin`\n\n*enum* — `ProjectionService.cs`\n\nWho authored a record. Carried on every read result so a consuming agent can tell a repository\nfact from something another agent wrote — without it, an agent-authored note is laundered back\nout as workspace knowledge.\n\n## `KnowledgeQuery`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `KnowledgeNodeView`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `KnowledgeResult`\n\n*record* — `ProjectionService.cs`\n\n*No doc comment on this type.* **(gap)**\n\n## `ProjectionService`\n\n*class* — `ProjectionService.cs`\n\nBounded, self-describing projections over the current fact set.\n\n**Remarks.** Pattern: CQRS / Materialized Read Model. Every result is rebuildable from facts and every one is\ncapped on nodes, edges AND bytes — the byte cap matters because node labels come from repository\ncontent, so a count-only cap still admits an unbounded payload.\n\n| Member | Summary |\n|---|---|\n| `int MaxNeighborsCeiling = 50` | **(gap)** |\n| `int MaxMembersRead = 80` | **(gap)** |\n| `int MaxEdgesCeiling = 500` | **(gap)** |\n| `int MaxNodesCeiling = 200` | **(gap)** |\n| `int MaxResultBytes = 64 * 1024` | **(gap)** |\n| `int MaxResponseBytes = 896 * 1024` | The most a single response may serialise to. |\n| `int FrameBytes = Ipc.IpcFraming.MaxFrameBytes` | The transport's own limit, restated here only so the budget can be checked against it. |\n| `int MaxFramedGraphBytes = FrameBytes - (64 * 1024)` | What a shrunk graph must fit inside — the frame, less real headroom. |\n| `int AssertionOverheadBytes = 448` | What one assertion costs in JSON beyond its own text. |\n| `int MaxShrinkAttempts = 12` | How many times a graph may be shrunk before it must already fit. |\n| `int MaxRecoveryProbes = 4` | How many times a shrunk graph may probe upward for the size it overshot. |\n| `int MinRecoveryGap = 50` | Below this, the nodes still recoverable are not worth a recompute to find. |\n| `int MaxSearchResultsCeiling = 20_000` | The ceiling on a SEARCH, which is a different question from a neighbour list. |\n| `int MaxClustersCeiling = 500` | Routes returned before the answer is truncated.  Groups returned before the rest are counted and dropped. |\n| `int MaxPathsCeiling = 100` | **(gap)** |\n| `int MaxPathLengthCeiling = 12` | The longest route worth returning, in edges. |\n| `int MaxEvidencePageCeiling = 2_000` | Assertions per evidence page. |\n| `DescribeResult Describe(string nodeId, int maxNeighbors)` | **(gap)** |\n| `ImpactResult Impact(string nodeId, int maxNodes, int maxEdges)` | Bounded dependent-neighbourhood walk. Breadth-first with an explicit frontier cap, so the traversal cannot fan out into the whole graph — the caller always learns what was omitted. |\n| `EvidencePage Evidence(string? cursor, int maxAssertions)` | One page of every current assertion, for a caller that wants the whole set. |\n| `WorkspaceGraph Graph(int maxNodes)` | The whole workspace as a graph. |\n| `WorkspaceGraph Graph(GraphQuery query)` | The graph the query asks for — filtered before the cap applies. |\n| `WorkspaceOverview Overview(OverviewQuery query)` | The workspace at a distance: groups rather than nodes, for a graph too large to draw. |\n| `PathResult Paths(PathQuery query)` | How one node reaches another, within the graph the query names. |\n| `FindResult Find(string term, int maxResults)` | **(gap)** |\n| `KnowledgeResult Knowledge(KnowledgeQuery query)` | US-4: knowledge navigation. Same facts, filtered to knowledge-kind subjects, with backlinks and the health findings the spec requires when source/owner/links are missing. |\n| `InteractionResult Interaction(string nodeId, int maxMessages)` | The content behind one node, for a reader that already has the node.  Lines in the workspace's own files that contain a term.  One caller's outgoing calls, in call order — the feed for a UML sequence diagram. |\n| `int MaxInteractionMessages = 200` | The most messages one interaction will return. |\n| `ContentSearchResult SearchContent(string term, int maxMatches)` | **(gap)** |\n| `int MaxContentFiles = 600` | The most files one content search will open. |\n| `int MaxContentMatches = 200` | The most matches one content search will return. |\n| `NodeContent NodeContent(string nodeId)` | **(gap)** |\n| `int MaxContentBytes = 256 * 1024` | How much of one artifact travels. Well inside the frame, with the rest named. |\n| `IReadOnlyList<(string Subject, string Predicate, string Object, string Status, int Count, string Revision)>` | Rebuilds the labelled claim cache from facts. Public because the equality test needs to prove the stored cache equals this derivation — a cache with no such test is a second source of truth. |\n\n### `int MaxResponseBytes = 896 * 1024`\n\nThe most a single response may serialise to.\n\n**Remarks.** **Derived from the transport, with headroom.** One IPC frame carries 1,048,576 bytes\n(`IpcFraming.MaxFrameBytes`); this leaves a quarter of it spare for the response envelope\nand for the difference between an estimate and the truth. A projection that fills the frame\nexactly is one repository away from INV-0003.\n\n\n\n\n\n**Why a byte budget and not a bigger count ceiling.** Every ceiling in this class\ncounts ITEMS and the transport limit is in BYTES, and node labels, subjects and paths all come\nfrom repository content — so a count-only cap admits an unbounded payload. That is not a\nhypothetical: MEASURED on a real repository, an evidence page of 2,000 assertions serialises\nto **1,004,397 bytes**, which is 95.8% of the frame and fifteen times the\n`MaxResultBytes` its own documentation claimed it stayed \"comfortably inside\".\n\n\n\n\n\n**Why the headroom is the size it is.** A response is its payload plus an envelope,\nand from IPC version 3 that is all it is: the payload is carried as JSON rather than as a\nstring holding JSON text, so nothing is escaped twice. Through version 2 it was, at a measured\n**1.56–1.57x** — which is how a 727,244-byte graph inside a 768 KiB budget reached\n1,137,104 bytes on the wire and was refused (DC-047). The budget had been checked on the inner\nbytes and enforced on the outer ones, and its tests counted the inner bytes too, so the guard\nand its proof were wrong together.\n\n\n\n\n\n128 KiB below the frame, which is the envelope with room to spare.\n`ThePayloadIsNotEncodedTwice` holds up the premise this rests on — that payload and frame\nare within a few percent — and `TheBudgetCannotDriftPastWhatAFrameHolds` holds up the\narithmetic. Neither is optional: this number is only safe while both pass.\n\n### `int MaxFramedGraphBytes = FrameBytes - (64 * 1024)`\n\nWhat a shrunk graph must fit inside — the frame, less real headroom.\n\n**Remarks.** Shrinking stops at the FIRST size that fits, so a target equal to the frame leaves whatever\nmargin the last step happened to produce. MEASURED with no headroom: 1,044,916 bytes against\na 1,048,576 frame — 3,660 bytes, which is one longer type name away from failing. A limit met\nexactly is not a limit respected.\n\n### `int AssertionOverheadBytes = 448`\n\nWhat one assertion costs in JSON beyond its own text.\n\n**Remarks.** MEASURED, not estimated: a 2,000-assertion page whose subjects, predicates, objects and paths\ntotal 238,002 bytes serialises to 1,004,397 — **383 bytes per row** of field names,\ntimestamps, enum spellings and punctuation. Rounded up for headroom, because a guard that\nunder-counts is a guard that lets the frame overflow.\n\n### `int MaxShrinkAttempts = 12`\n\nHow many times a graph may be shrunk before it must already fit.\n\n**Remarks.** Each round takes at least a third off, so twelve rounds reduce five thousand nodes to fewer\nthan five — far past any real graph. It is a cost bound, not the thing that makes the loop\nterminate; the guaranteed reduction does that.\n\n### `int MaxRecoveryProbes = 4`\n\nHow many times a shrunk graph may probe upward for the size it overshot.\n\n**Remarks.** Each probe halves the remaining gap. MEASURED on the calibrated fixture: none returns 868\nnodes where 1,281 fit, two returns 1,193, four returns 1,274, and six returns 1,274 again —\nby then `MinRecoveryGap` stops it. Four is where the curve flattens, and every\nprobe is a full recompute of the graph, which is the expensive half.\n\n### `int MinRecoveryGap = 50`\n\nBelow this, the nodes still recoverable are not worth a recompute to find.\n\n**Remarks.** It is also the precision of the monotonicity this class offers: a larger request can return\nup to this many fewer nodes than a smaller one, because recovery approximates the largest\nfitting size rather than finding it. Exact monotonicity needs the node ORDERING computed once\nand candidate sizes evaluated against it — the ordering is identical for every size, so today\neach probe redoes work that does not change. That is the upgrade, and it is not free.\n\n### `int MaxSearchResultsCeiling = 20_000`\n\nThe ceiling on a SEARCH, which is a different question from a neighbour list.\n\n**Remarks.** **Find used to borrow `MaxNeighborsCeiling`, and 50 is the wrong number\nfor it by two orders of magnitude.** The workbench asks for 20,000 matches to build the\ncontext and join panes; it received 50. Those panes were computing crossing counts, join\ncounts and coverage from roughly three percent of a real workspace, and presenting the result\nas the answer — while a spike reading the store directly showed the whole picture and\ndisagreed with the product for days.\n\n\n\n\n\nA search returns identity columns only — id, kind, label — so the payload per row is\nsmall and bounded, which is why this ceiling can be large where the neighbour one cannot.\n`MaxResultBytes` still applies underneath.\n\n### `int MaxClustersCeiling = 500`\n\nRoutes returned before the answer is truncated.\n\nGroups returned before the rest are counted and dropped.\n\n**Remarks.** A reader comparing routes is choosing between them, and nobody chooses between two hundred.\nThe cap is small on purpose and the truncation is reported.\n\nAn overview a person can read has tens of groups, not thousands; past a few hundred it is a\nhairball again at a coarser grain, which is the failure it exists to prevent.\n\n### `int MaxPathLengthCeiling = 12`\n\nThe longest route worth returning, in edges.\n\n**Remarks.** Beyond about a dozen hops \"A reaches B\" stops being a fact about the design and becomes a\nfact about the graph being connected — in a codebase almost everything reaches almost\neverything if you allow enough steps.\n\n### `int MaxEvidencePageCeiling = 2_000`\n\nAssertions per evidence page.\n\n**Remarks.** **A COUNT ceiling, and it do
