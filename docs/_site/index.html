es not bound the payload.** This used to say the page was\n\"sized so it stays comfortably inside `MaxResultBytes` once serialised\". MEASURED:\n2,000 assertions serialise to 1,004,397 bytes, which is fifteen times that constant and 95.8%\nof an IPC frame. The sentence was written, believed, and never checked.\n\n\n\n\n\nWhat actually bounds the page is `MaxResponseBytes`, applied row by row in\n`Evidence`; this count is the coarser of the two limits and usually is not the one\nthat fires. An assertion carries its provenance, so it is far heavier per row than a search\nmatch — which is the reason a count could never have been the bound.\n\n### `EvidencePage Evidence(string? cursor, int maxAssertions)`\n\nOne page of every current assertion, for a caller that wants the whole set.\n\n**Remarks.** The panes want all of it and were rebuilding it node by node through\n`Describe`, which bounds neighbours at 50 and dropped two join edges of 124 doing\nso. This asks the question they were actually asking.\n\n\n\n\n\n**Bounded by BYTES as well as by count, and the byte bound is the one that matters.**\nThis method's documentation used to claim a page \"can cross a pipe without breaching the\nresult-byte cap\". It could not: MEASURED on a real repository, a 2,000-assertion page is\n**1,004,397 bytes** against a 1,048,576-byte frame — 95.8% full, and over the frame\nentirely on a repository with slightly longer type names. The claim was written, believed and\nnever checked, which is the same shape as INV-0003 one method along.\n\n\n\n\n\nTruncating a page early is LOSSLESS here, and that is why the fix belongs at this level:\nthe cursor continues from the last row actually returned, so a byte-bounded page costs one\nextra round trip and never drops a row.\n\n### `WorkspaceGraph Graph(int maxNodes)`\n\nThe whole workspace as a graph.\n\n**Remarks.** The question the graph surface was never asking. It requested one node and that node's\nneighbours, so a workspace of 12,100 assertions rendered as two nodes — reported against the\nsame repository viewed in Obsidian.\n\n### `WorkspaceOverview Overview(OverviewQuery query)`\n\nThe workspace at a distance: groups rather than nodes, for a graph too large to draw.\n\n**Remarks.** Built over the same `Graph` projection the canvas uses, so an overview can never\nsummarise a node the detailed view would not show. Two answers to one question is the defect\nsignature this codebase has already paid for.\n\n### `PathResult Paths(PathQuery query)`\n\nHow one node reaches another, within the graph the query names.\n\n**Remarks.** Built over the same projection the graph surface uses, so a route can never contain an edge\nthe picture does not show — two answers to one question is the defect signature this\ncodebase has already paid for once.\n\n### `InteractionResult Interaction(string nodeId, int maxMessages)`\n\nThe content behind one node, for a reader that already has the node.\n\nLines in the workspace's own files that contain a term.\n\nOne caller's outgoing calls, in call order — the feed for a UML sequence diagram.\n\n**Remarks.** **On demand, for the one node asked for.** The graph carries no content by design —\nfattening 1,500 nodes to serve the one a user selected is what overflowed the frame in the\nfirst place (INV-0003, ADR-0018 node-content-reader-contract).\n\n\n\n\n\n**Confined to the workspace.** The path is rebuilt from the scope's recorded location\nplus the assertion's own provenance, then checked to be under the root before anything is\nopened. A node id arrives from a client, and a client asking is not a reason to read a file.\n\n\n\n\n\n**Bounded, and honest when it truncates.** Oversized content returns its first bytes\nand a shortfall saying what was left — never an oversized frame, never a silent half-file.\n\n**Why this is Core's and not the client's.** The App must not read workspace files:\ntwo authorities on what a file contains disagree the first time one resolves a path\ndifferently (DC-022), and file access belongs on the side of the boundary that can confine it\nto the workspace. This is the same rule that put `NodeContent` here, applied to the\ncorpus instead of to one node.\n\n\n\n\n\n**It searches files the STORE knows about, not the directory tree.** Walking the\ntree would read `node_modules`, `bin`, and every generated bundle the extractors\nalready decided not to index — and would return hits in files the graph cannot navigate to,\nwhich is a result a person cannot act on. Every hit names the node that owns the file.\n\n\n\n\n\n**Every bound is enforced, not declared.** Files, matches, bytes and per-file size\nall cap, and the result says when a cap fired. A limit that cannot fire is the defect it was\nwritten to prevent (DC-016), and a budget that is reported but not applied is how a 1.18 MB\npayload crossed a 1 MiB frame (INV-0003).\n\n**Why this is not `calls`.** The `calls` edges are deduplicated to one row\nper `(caller, callee)` pair, which is correct for a graph and destroys an interaction:\n`A→B, A→C, A→B` collapses to two messages and the repeat is gone. `calls_at` keeps\nevery site. MEASURED on TheTerrace: 2,024 sites against 1,492 deduplicated edges, so keeping\nthem costs about a third more rows on one predicate and nothing at all on the graph payload —\n`calls_at` is an attribute and is never drawn.\n\n\n\n\n\n**Type-level, and it says so.** The caller and callee are types; the member is the\nmessage name. A sequence diagram of one METHOD's activation needs method-level callers, which\nthe C# reader does not emit — so this draws \"what this type calls, in order\", which is a real\ninteraction and not the one a lifeline-per-method diagram would show. Better to hand over a\ntrue smaller thing than a plausible larger one.\n\n### `int MaxInteractionMessages = 200`\n\nThe most messages one interaction will return.\n\n**Remarks.** A lifeline with 500 messages on it is not a diagram anybody reads. MEASURED on TheTerrace,\nthe busiest single caller has 46 outgoing call sites, so this bounds the pathological case\nwithout truncating any real one.\n\n### `int MaxContentFiles = 600`\n\nThe most files one content search will open.\n\n**Remarks.** A person is waiting on this. TheTerrace has 1,178 indexed artifacts; reading all of them on\nevery keystroke is not a search box, it is a build step.\n"}, {"id": "api-aide-core-store", "title": "AiDe.Core.Store", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Store`\n\n**10 public types · 52 public members · 69% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `NodeMatchKind`\n\n*enum* — `NodeSearchHit.cs`\n\nWhy a node came back from a search.\n\n**Remarks.** A result whose relevance is invisible reads as a wrong result. Searching `addEventListener`\nand being shown a class called `Element` is correct and looks like a bug until the row says\n`has_member = addEventListener`.\n\n## `NodeSearchHit`\n\n*record* — `NodeSearchHit.cs`\n\nOne search hit: the node, why it matched, and the text that matched.\n\n## `CompactionResult`\n\n*record* — `StoreCompactor.cs`\n\nWhat a compaction did, so the operator can see it happened and what it cost.\n\n## `StoreCompactor`\n\n*class* — `StoreCompactor.cs`\n\nPrunes superseded scope generations by rebuilding the store, never by deleting facts.\n\n**Remarks.** **Why this exists.** P1-PERF measured refresh p95 at 192 ms on a fresh store, 567 ms\nafter ten generations of the same scope, and 785 ms after twenty — against a 500 ms budget. The\ncause is the append-only design working as intended: every re-extraction leaves its predecessor\nbehind, and index maintenance grows with the table. A morning's editing puts a workspace outside\nits budget.\n\n\n\n\n\n**Why rebuild-and-swap.** Fact tables carry immutability triggers and the writer forbids\nREPLACE, so there is no legitimate DELETE path — and manufacturing one (dropping the triggers,\nor a \"privileged\" bypass) would hollow out the invariant everywhere in order to fix performance\nin one place. Instead a new database is built containing only the retained facts, verified\nagainst the original, and swapped in atomically. The invariant is never suspended; the old file\nsimply stops being the current one.\n\n\n\n\n\n**What is safe to drop.** Only the latest *complete* snapshot per scope contributes\nto current evidence — that is already the store's read rule. Older generations are diagnostics.\nRetaining more than one keeps a short history for investigation; retaining zero is not offered,\nbecause a scope with no committed snapshot would have no evidence at all.\n\n| Member | Summary |\n|---|---|\n| `int DefaultThreshold = 1` | Generations per scope beyond which compaction runs. |\n| `int DefaultRetain = 1` | Generations kept per scope after a compaction — the one that renders. |\n| `IReadOnlyList<(string ScopeId, int Generations)> ScopesNeedingCompaction(` | Scopes whose generation count has passed the threshold. |\n| `CompactionResult Compact(int retain = DefaultRetain, int threshold = DefaultThreshold)` | Rebuilds the store keeping only the most recent  generations per scope. The store must be closed: compaction replaces the file. |\n\n### `int DefaultThreshold = 1`\n\nGenerations per scope beyond which compaction runs.\n\n**Remarks.** **One, because the rebuild turned out to be cheap and the waste turned out not to be.**\nThe original eight came from the P1-PERF latency curve — refresh is inside budget at five\nprior generations and over it by ten — and it answered the question \"when does this start to\nhurt?\". It never answered \"how big does the store get?\", and that is the one a user sees.\n\n\n\n\n\nMEASURED on a real workspace: at just **two** generations per scope — far under the\nold threshold, so nothing ever fired — the store was **53.3 MB of which 27.9 MB was\nsuperseded**. Compacting took **1.09 seconds** and halved it. Deciding there was nothing\nto do takes **1–34 ms**. A threshold that never fires on real usage is not a threshold, it\nis an opinion.\n\n### `int DefaultRetain = 1`\n\nGenerations kept per scope after a compaction — the one that renders.\n\n**Remarks.** **Two was speculative and it was costing double.** The extra generation was kept \"for\ninvestigation\", and nothing could investigate it: every read in this codebase composes with\nthe latest-generation filter, and the one reader that takes a generation explicitly is handed\nthe latest. History no query can reach is not history, it is residue — and the audit log, the\nchange log and the incident sidecar are where this project actually records what happened.\n\n\n\n\n\nSafe at one because every committed snapshot is complete: a failed extraction returns\nbefore committing anything, so the newest snapshot is always the one that renders.\n\n## `StoreReader`\n\n*class* — `StoreReader.cs`\n\nA snapshot read. The connection is pinned `query_only=1`, so this path cannot write even by\naccident (spike S6).\n\n| Member | Summary |\n|---|---|\n| `(long Generation, string ArtifactRevision, int AssertionCount)? LatestCommittedSnapshot(string scopeId)` | The latest committed generation for a scope, or null if nothing complete exists yet. |\n| `IReadOnlyList<StoredAssertion> CurrentAssertions(string scopeId)` | Current evidence for a scope: assertions of the latest COMPLETE snapshot only. A partial or superseded snapshot never contributes, so the graph cannot silently mix generations. |\n| `IReadOnlyList<StoredAssertion> AssertionsTouching(string nodeId, int limit)` | Assertions where the node is the subject OR the object, bounded in SQL. |\n| `int CountAssertionsTouching(string nodeId)` | Total assertions touching a node, so a bounded read can report what it omitted. |\n| `IReadOnlyList<StoredAssertion> OutgoingAssertions(string nodeId, int limit)` | Outgoing edges only — one traversal step of a bounded impact walk. |\n| `StoredAssertion? DeclaringAssertion(string nodeId)` | Assertions with a given predicate — the knowledge projection's entry point.  The assertion that says where a node was DECLARED — its scope and its path within it. |\n| `IReadOnlyList<(string Callee, string Member, string Location)> OutgoingCallsInOrder(` | One caller's outgoing calls, in the order they are written. |\n| `IReadOnlyList<(string NodeId, string ScopeId, string ArtifactPath)> FilesToSearch(int limit)` | The distinct files the graph knows about, each with a node that is declared in it. |\n| `string? ScopeLocation(string scopeId)` | Where a scope's files live, relative to the workspace root, or null when it never said. |\n| `(IReadOnlyList<(string NodeId, string Type)> Rows, int TotalMatched) KnowledgeNodes(` | The ids currently classified as knowledge.  The knowledge nodes a query asks for, with their declared type, and how many matched in all. |\n| `IReadOnlySet<string> KnowledgeNodeIds(int limit)` | **(gap)** |\n| `IReadOnlyList<StoredAssertion> AssertionsWithPredicate(string predicate, int limit)` | **(gap)** |\n| `IReadOnlyList<string> ReadDeclaredSubjects()` | Node identities matching a substring, with the total matched so omissions are reportable.  Subjects this workspace's own artifacts DECLARE — the things it owns. |\n| `(IReadOnlyList<NodeSearchHit> Matches, int TotalMatched) SearchNodes(string term, int limit)` | Nodes whose identity contains the term, and nodes one of whose ATTRIBUTE VALUES does. |\n| `long HighestDesiredGeneration()` | The highest generation any scope has ever been asked for, or 0 for an empty store. |\n| `string CurrentSourceRevision()` | The source revision currently rendered, for a result's provenance header. |\n| `IReadOnlyList<StoredAssertion> CurrentAssertionPage(` | All current assertions across every scope that has a complete snapshot.  A page of the current assertions, ordered stably, starting after . |\n| `IReadOnlyList<StoredAssertion> AllCurrentAssertions()` | **(gap)** |\n| `DispatchReceipt? ReadDispatchReceipt(string dispatchKey)` | Folds a dispatch key's attempt + outcome events into one displayed receipt. |\n| `IReadOnlyList<string> PendingDispatchKeys()` | Dispatch keys with an attempt but no outcome — what recovery must resolve. |\n| `string? ReadCommandOutcome(string workspaceId, CallerPrincipal caller, string commandType, string commandId)` | **(gap)** |\n| `(long Generation, SessionProcessingClass ProcessingClass)? ReadSession(string sessionId)` | **(gap)** |\n| `string? ReadNodeKind(string nodeId)` | **(gap)** |\n| `string? ReadNodeLabel(string nodeId)` | **(gap)** |\n| `IReadOnlyCollection<string> ReadKnowledgeIds(IReadOnlyCollection<string> nodeIds)` | Which of  the workspace classifies as knowledge. |\n| `IReadOnlyList<(string Subject, string Predicate, string Object, string Status, int Count, string Revision)>` | Reads the labelled cache. Provably equal to its derivation — see the rebuild test. |\n| `void Dispose()` | **(gap)** |\n\n### `IReadOnlyList<StoredAssertion> AssertionsTouching(string nodeId, int limit)`\n\nAssertions where the node is the subject OR the object, bounded in SQL.\n\n**Remarks.** Deliberately a UNION ALL of two single-column lookups rather than one `OR` predicate:\nSQLite will not use two different indexes to satisfy one OR, so the OR form degrades into\nthe full scan this method exists to avoid (measured, P1-PERF 2026-08-26).\n\n### `StoredAssertion? DeclaringAssertion(string nodeId)`\n\nAssertions with a given predicate — the knowledge projection's entry point.\n\nThe assertion that says where a node was DECLARED — its scope and its path within it.\n\n**Remarks.** Asked of the store rather than picked out of a neighbour list, because a neighbour list\nis capped. The content reader first filtered `AssertionsTouching(id, 50)` for the fact\ncarrying a path, and on a node with 244 edges that fact was not among the first 50 — so the\nmost connected types in a real workspace reported \"no recorded source\" while the least\nconnected ones worked. DC-035, in code written the same day the class was recorded twice.\n\n\n\n\n\nOrdered so a declaration wins over a mention: `has_type` and `declared_in` are\nwhat a producer emits ABOUT a thing it declared, and their provenance is that thing's own\nfile. Any other assertion's path is where it was REFERRED to.\n\n### `IReadOnlyList<(string Callee, string Member, string Location)> OutgoingCallsInOrder(`\n\nOne caller's outgoing calls, in the order they are written.\n\n**Remarks.** The interaction, as opposed to the relationship. `calls` is deduplicated to one\nrow per `(caller, callee)` pair — right for a graph, where the same relationship written\nseven times is one arrow, and wrong for a sequence diagram, where `A→B, A→C, A→B` must\nstay three messages. A diagram that silently drops a repeat is confidently incomplete.\n\n\n\n\n\n**Ordered by source position, because that is the only order there is.** No ordinal\ncolumn was added: every assertion already carries `source_location` as `line:col`,\nand a call sequence has exactly one correct order — the order it is written in. Sorted\nnumerically rather than as text, or line 10 would come before line 9.\n\n### `IReadOnlyList<(string NodeId, string ScopeId, string ArtifactPath)> FilesToSearch(int limit)`\n\nThe distinct files the graph knows about, each with a node that is declared in it.\n\n**Remarks.** The corpus a content search may read. It is the set of files the EXTRACTORS chose to\nindex, not the directory tree: walking the tree would open `node_modules`, `bin`\nand every generated bundle the readers already decided to skip, and would return hits in\nfiles the graph cannot navigate to — a result nobody can act on.\n\n\n\n\n\nOne representative node per file, chosen the same way `DeclaringAssertion`\nchooses one: a declaration before a reference, then lowest id for determinism. A file holds\nmany nodes and the hit needs somewhere to go, not everywhere it could go.\n\n### `string? ScopeLocation(string scopeId)`\n\nWhere a scope's files live, relative to the workspace root, or null when it never said.\n\n**Remarks.** Written by the core when it indexes a scope, because the core is what chose the path. An\nempty string is a real answer — the scope IS the workspace root — and is distinct from null,\nwhich means nothing recorded it and no content can be resolved.\n\n### `(IReadOnlyList<(string NodeId, string Type)> Rows, int TotalMatched) KnowledgeNodes(`\n\nThe ids currently classified as knowledge.\n\nThe knowledge nodes a query asks for, with their declared type, and how many matched in all.\n\n**Remarks.** `node_kind` is the dimension that separates knowledge from source — the one thing that\nknows, now that `has_type` is emitted by six extractors and says nothing about which\nhalf of the graph a node belongs to (INV-0004).\n\n**The term and the type are applied HERE, not to the result.** The caller used to\ntake 200 knowledge ids in id order and then filter them by term in memory, so a search only\never saw the alphabetically first 200 of 1,255 — and a document whose id sorted later was\nreported as not existing. That is DC-035 for the third time in this file: a bounded read\nwhose filter is applied to the RESULT of the read rather than expressed in it.\n\n\n\n\n\nThe total is counted over the same filtered set, so a caller can say what it left out\ninstead of presenting a truncation as an answer.\n\n### `IReadOnlyList<string> ReadDeclaredSubjects()`\n\nNode identities matching a substring, with the total matched so omissions are reportable.\n\nSubjects this workspace's own artifacts DECLARE — the things it owns.\n\n**Remarks.** A leading-wildcard LIKE cannot use an index, so this selects only the identity columns: it\nscans a covering index rather than hydrating every row's provenance, which is what made the\nnaive version cost a full-corpus materialization.\n\nDistinct from every node in the graph, which also contains external package types a\nrepository merely depends on. Any denominator that counts those is measuring the wrong\npopulation — bounded-context coverage above all, because nobody can assign\n`Azure.Storage.Blobs.BlobClient` to a context in their own codebase.\n\n### `(IReadOnlyList<NodeSearchHit> Matches, int TotalMatched) SearchNodes(string term, int limit)`\n\nNodes whose identity contains the term, and nodes one of whose ATTRIBUTE VALUES does.\n\n**Remarks.** Identity-only search cannot answer the question a person actually asks. Searching\n`addEventListener` found ONE node by id and could not find the class that HAS that\nmember; searching a Bicep resource's deployed name found the name and not the resource.\nMEASURED across TheTerrace: matching attribute values adds 1–14 nodes per term that identity\nsearch cannot reach at all, and they are the ones a person meant.\n\n\n\n\n\n**An attribute match returns the node that OWNS the attribute, never the value.**\nThat is why the original query excluded attribute objects: a value is not a node, and putting\n`api_version = 2023-01-01` in a result list as though it were a thing you can navigate\nto is how dates ended up in the graph. The exclusion was right about the object and wrong\nabout the subject — the owner is a real node, and it is the answer.\n\n\n\n\n\nEach row carries WHY it matched and the matched text, because a result whose relevance\nis invisible reads as a wrong result. The evidence is truncated in SQL rather than after, so\na long value never crosses the boundary just to be trimmed on the far side.\n\n### `long HighestDesiredGeneration()`\n\nThe highest generation any scope has ever been asked for, or 0 for an empty store.\n\n**Remarks.** The in-memory counter starts at zero on every open, so without this a workspace's SECOND\nindex after a restart re-uses generation 1 and violates the desired-generation primary key.\nThe daemon opens the store fresh every time it starts, which made \"index, restart, index\"\na guaranteed failure — found by a test that indexed twice across a reopen, which nothing had\ndone before.\n\n### `IReadOnlyList<StoredAssertion> CurrentAssertionPage(`\n\nAll current assertions across every scope that has a complete snapshot.\n\nA page of the current assertions, ordered stably, starting after .\n\n**Remarks.** A deliberate full read, used only where the whole set IS the answer — the claim-cache rebuild.\nBounded reads must never call this: at 50,000 edges it costs roughly 350 ms of materialization\nno matter how small the caller's result is (measured, P1-PERF 2026-08-26).\n\n**Paged because the caller is across a pipe.** The panes want every current\nassertion — 12,085 of them on one real repository — and they were reconstructing that set one\nnode at a time through `Describe`, which is bounded at 50 neighbours per node and lost\ntwo join edges out of 124 doing it. A single unbounded response would blow the result-byte\ncap instead, so the answer is neither: pages, with a cursor.\n\n\n\n\n\nThe cursor is the last row's `(subject, predicate, object)` — the same tuple the\nORDER BY uses, so a page boundary cannot skip or repeat a row. An id-based cursor would order\nby something the query does not, which is how paging quietly loses records.\n\n### `IReadOnlyCollection<string> ReadKnowledgeIds(IReadOnlyCollection<string> nodeIds)`\n\nWhich of  the workspace classifies as knowledge.\n\n**Remarks.** Reads the same `node_class = knowledge` fact `GraphProjection` reads, rather\nthan deciding again from the kind. Two authorities on what counts as knowledge is the shape\nof INV-0004 — where a hardcoded default rendered a table, a bicep resource and a class all as\n\"source\" — and two definitions of one quantity is a defect signature in its own right.\n\n\n\n\n\nBounded by the caller's id list, so it costs what the result costs rather than what the\ngraph costs (P1-PERF-02); an empty input reads nothing at all.\n\n## `StoredAssertion`\n\n*record* — `StoreReader.cs`\n\nAn assertion as stored, carrying its computed identity back out.\n\n## `StoreWriter`\n\n*class* — `StoreWriter.cs`\n\nThe single writer's unit of work. Every append allocates the next ingress sequence, which is the\ntotal order for all facts — wall-clock never orders anything.\n\n**Remarks.** Pattern: Unit of Work. The writer deliberately exposes no general SQL surface and never uses\nINSERT OR REPLACE / UPSERT on a fact table: REPLACE is the documented bypass of the immutability\ntriggers (spike S4), so forbidding it in the writer API is the control, and the pragma is the net.\n\n| Member | Summary |\n|---|---|\n| `long NextIngressSequence()` | Allocates the next total-order position. Monotonic within the workspace. |\n| `void DesireScopeGeneration(string scopeId, long generation, string artifactRevision)` | **(gap)** |\n| `(long Generation, string ArtifactRevision)? ReadDesired(string scopeId)` | The latest desired (generation, revision) pair for a scope, or null if none. |\n| `void CommitSnapshot(` | Commits a complete snapshot and its assertions in ONE transaction, but only when the worker's (generation, revision) pair still equals the durable desired pair. A late or stale worker is rejected here rather than bein… |\n| `void RecordCommandReceipt(` | Records a completed command. Its uniqueness is what makes a retry return the original outcome. |\n| `void RecordDispatchAttempt(` | The write-ahead half of ADR-0010: durable BEFORE any byte leaves the process. |\n| `void RecordDispatchOutcome(string dispatchKey, DispatchState state, string? errorCode)` | Appends an outcome event. Never rewrites a prior row — a late acceptance appends. |\n| `void SavePromptRevision(string draftId, int revisionNo, string body)` | **(gap)** |\n| `void UpsertSession(string sessionId, long generation, SessionProcessingClass processingClass, string displayName)` | **(gap)** |\n| `void UpsertNode(string nodeId, string nodeKind, string displayLabel)` | Records a node's kind and label, closing the previous row when either changes. |\n| `void Commit()` | **(gap)** |\n| `void Dispose()` | **(gap)** |\n\n### `void UpsertNode(string nodeId, string nodeKind, string displayLabel)`\n\nRecords a node's kind and label, closing the previous row when either changes.\n\n**Remarks.** **Unchanged is a NO-OP, deliberately.** This is a Type-2 dimension: every call used\nto close the current row and open a new one, so re-indexing a workspace rewrote the history\nof every node that had not changed. History whose every row is an artefact of re-running the\nindexer cannot answer the question it exists for — \"when did this change?\" — because the\nanswer is always \"just now\".\n\n\n\n\n\nIt also removed a flip-flop: while a node's kind was computed per scope, a node\ndeclared by one scope and referenced by another alternated between rows on every index.\n\n## `StoreErrorCodes`\n\n*class* — `WorkspaceStore.cs`\n\nStable error codes this layer can raise. Never a bare exception message.\n\n| Member | Summary |\n|---|---|\n| `string ImmutableViolation = \"AIDE-STORE-IMMUTABLE-VIOLATION\"` | **(gap)** |\n| `string ScopeGenerationStale = \"AIDE-SCOPE-GENERATION-STALE\"` | **(gap)** |\n| `string EpochStale = \"AIDE-AUTH-EPOCH-STALE\"` | **(gap)** |\n\n## `WorkspaceStoreException`\n\n*class* — `WorkspaceStore.cs`\n\nA store-layer failure carrying a stable, greppable code.\n\n| Member | Summary |\n|---|---|\n| `string ErrorCode { get; } = errorCode` | **(gap)** |\n\n## `WorkspaceStore`\n\n*class* — `WorkspaceStore.cs`\n\nOne workspace, one SQLite file. Owns the single writer, the core epoch, and the total fact order.\n\n**Remarks.** Pattern: Repository + Unit of Work (narrow). SQLite has no nested transactions\n(spikes/sqlite-fact-store S8), so one write transaction per aggregate operation is the contract,\nenforced by the writer semaphore rather than an ambient transaction scope.\n\n| Member | Summary |\n|---|---|\n| `long CoreEpoch { get; }` | Monotonic, store-persisted, incremented inside the open transaction. Never random and never clock-derived, so \"stale\" is decidable and an old epoch value cannot recur (ABA). |\n| `WorkspaceStore Open(string databasePath)` | **(gap)** |\n| `StoreWriter BeginWrite()` | Acquire the single writer. Blocks until the previous writer completes — the control path waits rather than erroring, which is the right shape for one local operator. |\n| `StoreReader BeginRead()` | A read connection pinned to `query_only=1`, so a read path physically cannot write (spike S6) — reads never queue behind the writer. |\n| `void Dispose()` | **(gap)** |\n"}, {"id": "api-aide-core-terminal", "title": "AiDe.Core.Terminal", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Terminal`\n\n**22 public types · 92 public members · 74% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `AgentReadinessProfile`\n\n*record* — `AgentReadinessProfiles.cs`\n\nOne agent's readiness marker, and where it came from.\n\n| Member | Summary |\n|---|---|\n| `bool Launchable` | Whether this profile can offer its own \"New … session\" command. |\n| `string CommandId` | The command id for this harness's session, derived from the executable name. |\n| `string CommandIdFor(string agent)` | The one place the id is spelled, so the catalog, the menu and the controller agree. |\n\n## `AgentReadinessProfiles`\n\n*class* — `AgentReadinessProfiles.cs`\n\nPer-agent readiness markers, built in and user-supplied.\n\n**Remarks.** **Why this exists.** The built-in markers are a guess about what an agent's prompt looks\nlike, and a guess that does not match means the agent is refused forever — a correct refusal that\nis also a dead end. Nothing shipped could change that without a rebuild, so the honest fix is to\nlet the marker be configured where the agent actually runs.\n\n\n\n\n\n**A bad pattern fails loudly, never open.** A regex that does not compile is reported and\nthe agent keeps its built-in marker; it never degrades to \"assume ready\", because the one thing\nworse than refusing a ready agent is dispatching into an unready one — the failure\n`spikes/agent-dispatch` measured.\n\n\n\n\n\n**Tuning is measurement, not guesswork.** `LastJudged`\nexposes the tail the watcher actually tested, so a user fixing a pattern reads what the agent\nprinted rather than reasoning about what it probably prints.\n\n| Member | Summary |\n|---|---|\n| `string FileName = \"agent-readiness.json\"` | **(gap)** |\n| `IReadOnlyList<string> Problems { get; }` | Patterns that were rejected, and why. Surfaced rather than absorbed. |\n| `IReadOnlyCollection<AgentReadinessProfile> All` | **(gap)** |\n| `AgentReadinessProfiles BuiltIn { get; } = new(` | **(gap)** |\n| `AgentReadinessProfiles Load(string? stateDirectory)` | Loads the overrides beside the built-ins. A missing file is the ordinary case. |\n| `AgentReadinessProfile? For(string agent)` | The marker for an agent, or null when nothing reports readiness for it. |\n| `AgentReadinessWatcher? WatcherFor(string agent)` | A watcher for an agent, or null — the caller must treat null as \"cannot establish\". |\n| `string WriteTemplate(string stateDirectory)` | Writes the current markers as a starting point for the user to edit. |\n\n## `AgentReadinessWatcher`\n\n*class* — `AgentReadinessWatcher.cs`\n\nWatches an agent's SCREEN for the marker that says it is listening.\n\n**Remarks.** **Why this exists.** A shell reports readiness through OSC 133 signed with the session\nnonce. An agent CLI reports nothing, so before this it could only ever be REFUSED — a correct\nrefusal, and a dead end. Measured: a prompt dispatched into Claude Code's first-run trust gate\nwas consumed by that dialog (`spikes/agent-dispatch`).\n\n\n\n\n\n**It matches the rendered screen, not the byte stream.** The first version matched the\ntail of the output, which for a line-oriented shell is the same question and for an agent is not:\n`spikes/agent-readiness` measured a full-screen TUI drawn with absolute cursor addressing,\nwhere the last bytes are wherever the cursor went, not what the user is looking at.\n\n\n\n\n\n**Through the SAME screen the pane renders** — `TerminalScreen` driven by\n`VtParser`. A second screen model was written for this and then deleted: two models\nof one terminal disagree the first time either is fixed, and readiness disagreeing with what the\nuser is looking at is the whole defect this was built to close.\n\n\n\n\n\n**It is weaker evidence than the nonce and is labelled as such.** A pattern can match a\nline that merely mentions the prompt, and output is in principle forgeable. It establishes that\nthe agent is *listening* — never that it ACCEPTED anything, which ADR-0007 still gates behind\nan authenticated acknowledgement.\n\n\n\n\n\n**Attention is separate from readiness.** An agent showing a trust gate is not busy and\nnot ready; it is waiting for a person. Collapsing that into \"not ready\" leaves the user watching\na pane that refuses and never says why — and the measurement showed that gate is the NORMAL first\nscreen, not an edge case.\n\n| Member | Summary |\n|---|---|\n| `AgentReadinessWatcher(string readyPattern, string? attentionPattern = null,` | **(gap)** |\n| `bool IsReady { get; private set; }` | True when the marker is on the last drawn line of the screen. |\n| `bool NeedsAttention { get; private set; }` | True when the screen is waiting on a person rather than on the agent. |\n| `string AttentionLine { get; private set; } = string.Empty` | The line that matched `NeedsAttention`, for showing the user. |\n| `string LastJudged { get; private set; } = string.Empty` | The screen this watcher last judged. |\n| `string Pattern` | The pattern being tested, so a refusal can name the marker that did not match. |\n| `void Observe(ReadOnlySpan<char> text)` | Feeds output through the screen, then re-judges it. |\n| `IReadOnlyDictionary<string, string> KnownAgents { get; } =` | Well-known prompt markers, so a user does not have to invent one. |\n| `IReadOnlyDictionary<string, string> KnownAttention { get; } =` | Screens that are waiting on a person, per agent. |\n\n### `string LastJudged { get; private set; } = string.Empty`\n\nThe screen this watcher last judged.\n\n**Remarks.** Tuning a marker by reasoning about what an agent probably prints is how a pattern that never\nmatches survives. This is the rendered screen, so a user fixing a pattern reads what was\nactually on it.\n\n### `IReadOnlyDictionary<string, string> KnownAgents { get; } =`\n\nWell-known prompt markers, so a user does not have to invent one.\n\n**Remarks.** Conservative on purpose: a loose pattern that matches an agent's own prose about prompts\nwould report readiness mid-answer. **These remain unverified against a READY agent** —\nreaching one means answering the trust gate, which this tool will not do on the user's behalf\n— so they are the starting point for tuning, not a measured fact.\n\n### `IReadOnlyDictionary<string, string> KnownAttention { get; } =`\n\nScreens that are waiting on a person, per agent.\n\n**Remarks.** Measured, not imagined — `spikes/agent-readiness` captured this exact question, and it\nappears even in a directory whose sessions run every day. It is the normal first screen.\n\n## `TerminalSessionRequest`\n\n*record* — `ConPtyTerminalSession.cs`\n\nWhat a caller must supply to start a real terminal session.\n\n## `ShellIntegrationMode`\n\n*enum* — `ConPtyTerminalSession.cs`\n\nWhether the runtime installs its OSC shell integration into the session's shell.\n\n**Remarks.** Opt-in per session rather than always-on: `CommandLine` may be any executable, and\ndecorating an arbitrary command with PowerShell arguments would corrupt it.\n\n## `ConPtyTerminalSession`\n\n*class* — `ConPtyTerminalSession.cs`\n\nThe real terminal runtime: one ConPTY, one process, one owner loop (ADR-0005).\n\n**Remarks.** **Input and output loops are separate**, which is a correctness requirement rather than\ntidiness. ConPTY's pipes are finite: a process producing output faster than we read it blocks on\nits own write, and if the same loop were responsible for both reading and writing, a large write\nwould deadlock against a full output pipe with neither side able to proceed.\n\n\n\n\n\n**Output is bounded and drops the oldest.** The architecture budgets 1 MiB/s of sustained\noutput; a reader that falls behind must not be able to grow the queue without limit. Dropping is\ntherefore a designed state — reported through `Truncated` and\n`OutputOverload` — because for a terminal, the *newest* output is the\ninteresting output and stalling the process to preserve scrollback would be the wrong trade.\n\n\n\n\n\n**Terminal bytes never leave this object except through `Output`.** They are\nnot logged, traced, or attached to telemetry, per the spec's privacy rule. The telemetry below\ncounts bytes; it never carries them.\n\n| Member | Summary |\n|---|---|\n| `string SessionId { get; }` | **(gap)** |\n| `long Generation { get; private set; }` | **(gap)** |\n| `SessionProcessingClass ProcessingClass { get; }` | **(gap)** |\n| `string ShellIntegrationNonce { get; }` | The secret this session's injected shell integration must echo back in its OSC 133 sequences for them to be believed. |\n| `bool HasReadinessEvidence { get; private set; }` | Whether anything AUTHENTICATES this session's claim about its own state. |\n| `ChannelReader<TerminalChunk> Output` | **(gap)** |\n| `SessionActivity Activity` | **(gap)** |\n| `Task<ConPtyTerminalSession> StartAsync(` | Creates the pseudo console, starts the process inside a kill-on-close job, and pumps. |\n| `Task<PtyWriteResult> WriteAsync(` | **(gap)** |\n| `Task<SessionExit> WaitForExitAsync(CancellationToken cancellationToken)` | **(gap)** |\n| `ValueTask ResizeAsync(int columns, int rows, CancellationToken cancellationToken)` | **(gap)** |\n| `ValueTask DisposeAsync()` | **(gap)** |\n\n### `string ShellIntegrationNonce { get; }`\n\nThe secret this session's injected shell integration must echo back in its OSC 133 sequences\nfor them to be believed.\n\n**Remarks.** Public because the integration script has to be given it; per-session and in-memory because a\nnonce that outlived the session would authenticate a later child's claims. It is not a\ncredential for anything else — the worst a leak buys is the ability to lie about activity.\n\n### `bool HasReadinessEvidence { get; private set; }`\n\nWhether anything AUTHENTICATES this session's claim about its own state.\n\n**Remarks.** True only with shell integration: OSC 133 signed with the session nonce is what makes\n`Ready` a claim rather than an inference. Without it, activity is\nderived from output timing — and a quiet agent mid-thought looks exactly like an idle one,\nwhich is how a prompt ends up in a confirmation dialog.\n\n## `EnvironmentHealth`\n\n*class* — `EnvironmentHealth.cs`\n\nWhether the environment a terminal hands its children can actually be carried by them.\n\n**Remarks.** **Reported as \"the agent sessions do not have my profile or my environment variables\".**\nThe measurement found something the product did not cause and could not see: this machine's PATH\nis **22,297 characters**, and `cmd.exe` silently drops a variable that large. Any child\nthat runs through cmd — which is every `.cmd` shim, and therefore every npm-installed CLI —\nstarts with an **empty PATH** and cannot find node, git, or itself.\n\n\n\n\n\n**Proven necessary and sufficient, and proven not to be ours.** The same shim run from a\nplain PowerShell with no part of this product involved also received an empty PATH; trimming PATH\nto 1,799 characters made it arrive intact. AI-DE passes the environment correctly — PowerShell\nstarted from the same inherited block reads all 22,297 characters and resolves `claude`.\n\n\n\n\n\n**What was ours is that it was invisible.** The terminal opened, looked healthy, and the\nuser's tools were simply absent — a clean surface over a broken environment, which is DC-025\nwearing a different hat. This states it, with the number and the remedy, so the failure is\nattributable instead of mysterious.\n\n\n\n\n\nIt never edits the user's PATH. A tool that silently rewrites the environment to make\nitself work is a tool that has hidden the problem from the person who has to fix it, and PATH is\ntheirs — the entries causing this belong to another program's build.\n\n| Member | Summary |\n|---|---|\n| `int CmdVariableLimit = 8151` | The size past which `cmd.exe` stops carrying a variable. |\n| `int CmdPairLimit = 8190` | The measured cut-off, on `NAME=VALUE` as a whole — not on the value. |\n| `IReadOnlyList<string> Inspect(string? path = null)` | Findings about the whole environment, in words a user can act on. Empty when healthy. |\n| `int DeadEntryThreshold = 10` | PATH entries that point at directories which do not exist. |\n\n### `int CmdVariableLimit = 8151`\n\nThe size past which `cmd.exe` stops carrying a variable.\n\n**Remarks.** **Bisected, not quoted.** On the reporting machine `cmd.exe` carried a variable of\n8,151 characters and dropped one of 8,152 — printing \"The input line is too long\" and then\nlosing the value. The documented figure is 8,191; the ~40-character difference is the\nvariable's own name and the block overhead, so the exact cut-off shifts slightly with the\nname. The message still says \"may be dropped\" because of that, not because the number is\nunmeasured.\n\n### `int CmdPairLimit = 8190`\n\nThe measured cut-off, on `NAME=VALUE` as a whole — not on the value.\n\n**Remarks.** **Bisected 2026-09-01**, by handing a child a controlled environment and asking the\nCHILD what it received (the parent's copy is not evidence — DC-027's own rule). The boundary\nis exact and identical at four name lengths:\n\n\n\nname len   max value   name + 1 + value\n3       8,186              8,190\n13       8,176              8,190\n40       8,149              8,190\n120       8,069              8,190\n\n\n\n**So the limit is on the PAIR**, and comparing the value alone is wrong for any name\nlonger than 39 characters: an 8,150-char value under a 40-char name passes a value-only check\nand is dropped by cmd.exe. Latent here — the longest name on the measured machine is 34 — and\nit stops being latent the moment something adds longer names, which is exactly what §3 of the\nsession-registration spec proposes.\n\n\n\n\n`CmdVariableLimit` is kept for the PATH message, where it reads as the\nbudget a user has to get under.\n\n### `IReadOnlyList<string> Inspect(string? path = null)`\n\nFindings about the whole environment, in words a user can act on. Empty when healthy.\n\n**Remarks.** PATH is checked in detail because it is the one whose loss stops tools resolving, but ANY\noversized variable is dropped the same way and by the same mechanism — so every variable is\nmeasured and the others are named together. Checking only the variable that happened to bite\nis how the second instance of a class gets found by a user rather than by the tool.\n\n### `int DeadEntryThreshold = 10`\n\nPATH entries that point at directories which do not exist.\n\n**Remarks.** **Caught at twenty, not at a hundred and eighty-seven.** The oversize check only\nfires once PATH is past cmd's limit — which is to say, after the damage. This one fires on\nthe SHAPE: something appended 187 throwaway build directories to a persisted PATH and never\nremoved them, and every one of them was already gone from disk. Regrowth looks identical and\nstarts small.\n\n\n\n\n\nA handful of dead entries is normal — an uninstalled tool, a moved SDK — so this stays\nquiet below a threshold. It is looking for a pattern of accumulation, not for tidiness.\n\n## `OscKind`\n\n*enum* — `OscParser.cs`\n\nWhich OSC sequence arrived. Says nothing about whether it was believed.\n\n## `OscDisposition`\n\n*enum* — `OscParser.cs`\n\nWhat the parser did about it.\n\n## `struct`\n\n*record* — `OscParser.cs`\n\nOne sequence and its outcome. Deliberately carries no payload text.\n\n**Remarks.** The absent payload is the privacy control, not an omission. This type is what telemetry counts\nand what a diagnostic view would show, and terminal text may reach neither — so there is nowhere\non this record for a byte of the child's output to sit.\n\n| Member | Summary |\n|---|---|\n| `TerminalColor Default` | **(gap)** |\n| `TerminalColor FromIndex(int index)` | **(gap)** |\n| `TerminalColor FromRgb(byte r, byte g, byte b)` | **(gap)** |\n| `TerminalCell Blank` | **(gap)** |\n| `TerminalPen Default` | **(gap)** |\n\n## `OscParser`\n\n*class* — `OscParser.cs`\n\nReads OSC sequences out of a terminal byte stream and turns the authenticated ones into advisory\n`SessionActivity` claims.\n\n**Remarks.** **Everything here is a claim from an untrusted process.** The child in a terminal is\noften the thing being investigated, and it chooses every byte. So the parser's job is not to\ninterpret OSC faithfully — it is to decide what may be believed. Three rules follow.\n\n\n\n\n\n**1. State claims need the session nonce.** OSC 133 is public and widely copied; any\nprocess that can print can emit it. The nonce is injected into the shell integration we install,\nso a claim carrying it came from that integration and a claim without it came from something\nelse. Advisory state still drives what the user sees, and a session reporting `Ready`\nmid-command is a lie the UI renders faithfully.\n\n\n\n\n\n**2. Host actions are refused outright, nonce or not** (ADR-0005, threat model boundary\n\"terminal output → UI\"). OSC 52 writes the clipboard and OSC 8 carries a URI; both are actions\ntaken by *us* on the child's instruction. Sanitising them would presume we can separate a\nsafe payload from a hostile one when the child chose all of it. There is no clipboard code path\nhere to reach.\n\n\n\n\n\n**3. Nothing is retained.** The parser sees every byte the child writes, so anything it\nkeeps is terminal text living outside the bounded, ephemeral output channel the spec confines it\nto. The payload buffer is cleared at every terminator and never leaves this object.\n\n\n\n\n\nOSC state is **never agent acceptance** (ADR-0007). Nothing here may be read as a user\nor an agent having agreed to anything; it reports only that a process is or is not working.\n\n\n\n\n\nNot thread-safe: one parser belongs to one session's single reader loop.\n\n| Member | Summary |\n|---|---|\n| `int MaxPayloadBytes = 1024` | Bytes buffered for one sequence before it is abandoned. |\n| `OscParser(string sessionNonce)` | **(gap)** |\n| `int PendingPayloadBytes` | Bytes currently held for an in-flight sequence. Zero whenever none is in flight. |\n| `string NewNonce()` | A fresh session nonce: 128 random bits, hex encoded. |\n| `SessionActivity? Consume(ReadOnlySpan<byte> bytes, List<OscEvent> events)` | Feeds one chunk of session output through the scanner. |\n\n### `int MaxPayloadBytes = 1024`\n\nBytes buffered for one sequence before it is abandoned.\n\n**Remarks.** Without a cap, `ESC ]` followed by an endless stream costs us one byte per byte of\ntheirs and the ceiling is whatever the child chooses. Every sequence we honour is well under\n100 bytes; the headroom is for the ones we refuse.\nsimplify: a flat byte cap rather than a per-kind budget; ceiling 1 KiB; upgrade trigger = a\nsequence we need to honour does not fit.\n\n### `OscParser(string sessionNonce)`\n\n- **`sessionNonce`** — The secret shared with this session's injected shell integration. Must be non-empty: a parser with no nonce would have nothing to check claims against, and failing open there would make the control absent exactly when nonce generation had gone wrong.\n\n### `int PendingPayloadBytes`\n\nBytes currently held for an in-flight sequence. Zero whenever none is in flight.\n\n**Remarks.** Exists so the retention bound is observable rather than merely intended.\n\n### `SessionActivity? Consume(ReadOnlySpan<byte> bytes, List<OscEvent> events)`\n\nFeeds one chunk of session output through the scanner.\n\n- **`bytes`** — Output exactly as read; never modified and never copied out.\n- **`events`** — Appended to, one entry per complete or abandoned sequence.\n\n**Returns.** The last authenticated activity claim in this chunk, or `null` if there was none. Last rather than first because a chunk may hold a whole command's worth of sequences, and the state the session should end up in is the one the shell said most recently.\n\n## `ShellIntegration`\n\n*class* — `ShellIntegration.cs`\n\nBuilds the shell-side half of the OSC contract: the script that reports session state, signed\nwith the session nonce.\n\n**Remarks.** **Why the product ships this rather than asking users to install it.** The nonce is\ngenerated per session and lives only in memory, so no script a user commits to their profile can\never carry it. The integration has to be composed at session start, by us, from that session's\nown secret — which is also what makes the control meaningful: the script is the one thing in the\nworld that knows the nonce, so a claim carrying it came from the shell we started.\n\n\n\n\n\n**All of the loop, or none of it.** The parser makes OSC authoritative on the first\nauthenticated claim, retiring the output heuristic. An integration that marked the prompt\n(`D`, `A`, `B`) but not command start (`C`) would therefore pin the session at\n`Ready` for the whole duration of every command — a confident wrong answer, and strictly\nworse than the coarse signal it replaced. So the script checks it can hook line-accept\n**before** it overrides anything, and returns without installing if it cannot. A session with\nno integration is a supported outcome; a session with half of one is not.\n\n\n\n\n\n**Scope.** PowerShell only. It is the shell the product launches by default and the one\nwith a supported line-accept hook. `cmd.exe` has no equivalent — its prompt is a string, not\na function, and there is nowhere to run code when a command starts — so a cmd session keeps the\nheuristic rather than getting a half-loop.\n\n| Member | Summary |\n|---|---|\n| `string PowerShellScript(string nonce)` | The integration script for one session. |\n| `string PowerShellCommandLine(string executablePath, string nonce)` | A command line that launches  with the integration installed and the shell left interactive. |\n| `string AgentCommandLine(string shellPath, string agent, string nonce)` | A command line that runs  INSIDE the user's login shell. |\n\n### `string PowerShellScript(string nonce)`\n\nThe integration script for one session.\n\n- **`nonce`** — This session's `OscParser` nonce. Must be plain lowercase hex.\n\n**Throws `ArgumentException`.** The nonce is not plain hex.\n\n### `string PowerShellCommandLine(string executablePath, string nonce)`\n\nA command line that launches  with the integration\ninstalled and the shell left interactive.\n\n**Remarks.** The script travels as `-EncodedCommand` (UTF-16LE base64) rather than as text. Passing\nit literally would put its quotes, semicolons and `$` through two parsers — the Win32\ncommand line and PowerShell's own — and the first apostrophe in a user's prompt would break\nit. Base64 has no metacharacters, so there is nothing to escape and nothing to get wrong.\n\n### `string AgentCommandLine(string shellPath, string agent, string nonce)`\n\nA command line that runs  INSIDE the user's login shell.\n\n**Remarks.** **An agent used to be launched directly, and that was the defect.** Reported as\n\"the agent sessions do not have my profile or my environment variables\", and the measurement\nfound something sharper than a missing profile: a child that is a `.cmd` or `.bat`\nshim — which is what every npm-installed CLI is — starts through `cmd.exe`, and\n**cmd drops any environment variable past its own limit**. This machine's PATH is 22,297\ncharacters, so a cmd-hosted agent starts with an **empty PATH** and cannot find node, git\nor anything else. Measured: a cmd child through this ConPTY reported\n`PATH=[]` while PowerShell started from the same inherited block reported all 22,297\ncharacters and resolved `claude`.\n\n\n\n\n\n**So the agent runs where the user's own commands run.** The login shell loads the\nprofile — the aliases, functions and variables the request was actually about — resolves\nPATHEXT so a `.cmd` or `.ps1` shim works, and handles a long PATH correctly\nbecause it is not cmd. The agent becomes exactly what typing its name in their terminal\ndoes, which is the only definition of \"works with my profile\" that holds up.\n\n\n\n\n\nThe agent's name is passed as a single-quoted PowerShell string with internal quotes\ndoubled, and invoked with `&`. A name is not a command line here: quoting it means a\npath with a space runs, and a name with an apostrophe cannot end the string early.\n\n## `TerminalActivityState`\n\n*class* — `TerminalActivityState.cs`\n\nDecides which of the session's competing signals owns `SessionActivity`.\n\n**Remarks.** There are three signals and they routinely disagree. **Output arriving** is a coarse\nheuristic — bytes appeared, so something is presumably working. **An authenticated OSC claim**\nis the shell itself reporting what it is doing. **Overload** is our own resource state.\n\n\n\n\n\nThe heuristic and OSC conflict directly: a shell that finishes a command prints its prompt,\nand that prompt is output, so the heuristic would immediately flip the session out of the\n`Ready` the shell just announced. Whichever signal is applied last wins, which would make the\ncoarser one authoritative by accident. So the **first authenticated claim makes OSC\nauthoritative** for the rest of the session, and the heuristic retires — it exists to serve\nsessions with no shell integration, and a session that has produced one nonced claim has it.\n\n\n\n\n\nOverload outranks both, because neither the shell nor a byte count can tell us we have\nstopped dropping output — only we know that. `Ended` outranks\neverything: a dead process is not `Ready`, whatever the last bytes in the pipe claimed, and\noutput outliving the process that wrote it is ordinary rather than exotic.\n\n\n\n\n\nNot thread-safe by design: the ConPTY session already serialises state under its own lock,\nand a second lock inside here would be a redundant one to reason about.\n\n| Member | Summary |\n|---|---|\n| `SessionActivity Current` | The state the session should report right now. |\n| `bool OscAuthoritative { get; private set; }` | Has an authenticated OSC claim arrived? Once true the output heuristic no longer applies. |\n| `void OnOutput()` | Output arrived. The fallback signal, for sessions with no shell integration. |\n| `void OnOscClaim(SessionActivity claimed)` | An OSC claim that carried the session nonce. Advisory, never agent acceptance. |\n| `void OnOverload()` | Output is being dropped to stay inside the buffer budget. |\n| `void OnEnded()` | The process ended. Final. |\n\n## `TerminalColorKind`\n\n*enum* — `TerminalScreen.cs`\n\nHow a cell's colour is specified.\n\n## `struct`\n\n*record* — `TerminalScreen.cs`\n\nA cell colour, as the wire expresses it.\n\n**Remarks.** Deliberately not a rendering type. Keeping the model in *terminal* terms — \"palette index 4\",\nnot \"this shade of blue\" — is what lets the theme decide what index 4 looks like, and what keeps\nthe whole screen model free of a UI framework. `Default` is a distinct case rather\nthan a magic index because \"whatever the theme's foreground is\" is not a colour.\n\n| Member | Summary |\n|---|---|\n| `TerminalColor Default` | **(gap)** |\n| `TerminalColor FromIndex(int index)` | **(gap)** |\n| `TerminalColor FromRgb(byte r, byte g, byte b)` | **(gap)** |\n| `TerminalCell Blank` | **(gap)** |\n| `TerminalPen Default` | **(gap)** |\n\n## `CellAttributes`\n\n*enum* — `TerminalScreen.cs`\n\nNon-colour styling carried by a cell.\n\n## `struct`\n\n*record* — `TerminalScreen.cs`\n\nOne character cell.\n\n| Member | Summary |\n|---|---|\n| `TerminalColor Default` | **(gap)** |\n| `TerminalColor FromIndex(int index)` | **(gap)** |\n| `TerminalColor FromRgb(byte r, byte g, byte b)` | **(gap)** |\n| `TerminalCell Blank` | **(gap)** |\n| `TerminalPen Default` | **(gap)** |\n\n## `struct`\n\n*record* — `TerminalScreen.cs`\n\nThe style subsequent writes are drawn in — the terminal's current pen.\n\n| Member | Summary |\n|---|---|\n| `TerminalColor Default` | **(gap)** |\n| `TerminalColor FromIndex(int index)` | **(gap)** |\n| `TerminalColor FromRgb(byte r, byte g, byte b)` | **(gap)** |\n| `TerminalCell Blank` | **(gap)** |\n| `TerminalPen Default` | **(gap)** |\n\n## `EraseExtent`\n\n*enum* — `TerminalScreen.cs`\n\nHow much of a line or screen an erase covers.\n\n## `MouseTracking`\n\n*enum* — `TerminalScreen.cs`\n\nHow the child wants pointer events reported.\n\n## `TerminalScreen`\n\n*class* — `TerminalScreen.cs`\n\nWhat a terminal is, once the bytes have been interpreted: a grid of styled cells and a cursor.\n\n**Remarks.** **No WPF, by design.** Every rule here — wrapping, scrolling, what an erase covers,\nwhere the cursor lands — is a data-structure question. Behind a rendering framework each one\nwould be testable only by drawing pixels and reading them back, and the rules would be verified\napproximately or not at all. The renderer draws this; deciding what it contains is this type's\njob.\n\n\n\n\n\n**Scrolling, not scrollback.** When the cursor passes the last row the grid shifts up\nand the top row is discarded. History is a separate feature with its own memory budget, and\ngrowing this buffer to provide it would put an unbounded allocation behind an innocuous property\n— with the child process choosing how much.\nsimplify: viewport only; ceiling is one screen; upgrade trigger = scrollback becomes a\nrequirement, at which point it arrives as a bounded ring beside this, not inside it.\n\n\n\n\n\n**Nothing here throws on bad input.** Every coordinate is clamped — including the\nindexer, not only the mutators — because the values arrive in escape sequences written by an\nuntrusted process and an exception reachable by printing is a denial of service. A read is as\nreachable from that output as a write (the renderer reads the cursor cell every frame), so it\nhonours the same clamp.\n\n\n\n\n\nOne screen belongs to one session's parser, which writes it on the pump thread while the\nrenderer reads it on the UI thread. They coordinate through `SyncRoot`: a mutation\nis made under the lock, and a frame is drawn under the lock, so neither observes the other\nhalf-applied. See `SyncRoot` for why the dirty flag alone is not enough.\n\n| Member | Summary |\n|---|---|\n| `TerminalScreen(int columns, int rows)` | **(gap)** |\n| `int Columns { get; private set; }` | **(gap)** |\n| `int Rows { get; private set; }` | **(gap)** |\n| `int CursorRow { get; private set; }` | **(gap)** |\n| `int CursorColumn { get; private set; }` | **(gap)** |\n| `TerminalPen Pen { get; set; } = TerminalPen.Default` | The style applied to subsequent writes and erases. |\n| `bool IsDirty { get; private set; } = true` | Has anything changed since `ClearDirty`? |\n| `TerminalCell this[int row, int column]` | **(gap)** |\n| `object SyncRoot { get; } = new()` | The monitor that coordinates mutation and reads across threads. |\n| `bool ApplicationCursorKeys { get; private set; }` | Whether the child has enabled **application cursor key mode** (DECCKM, `ESC [ ? 1 h`). |\n| `void SetApplicationCursorKeys(bool enabled)` | Sets or clears application cursor key mode (DECCKM). Display is unaffected, so no repaint. |\n| `bool BracketedPaste { get; private set; }` | Whether the child has enabled **bracketed paste** (`ESC [ ? 2004 h`). When on, pasted text is wrapped in `ESC [ 200~ … ESC [ 201~` so the program can tell a paste from typing and does not run each pasted line as it ar… |\n| `void SetBracketedPaste(bool enabled)` | Sets or clears bracketed paste mode. Display is unaffected, so no repaint. |\n| `bool AltScreen { get; private set; }` | Whether the alternate screen buffer is currently active (a full-screen TUI is drawing). |\n| `MouseTracking MouseMode { get; private set; }` | How the child wants mouse events reported (xterm `?1000`/`?1002`/`?1003`). |\n| `bool MouseSgr { get; private set; }` | Whether the child asked for SGR extended mouse encoding (`?1006`) — the modern form. |\n| `void SetMouseMode(MouseTracking mode)` | Sets the mouse tracking level (or turns it off). Display is unaffected. |\n| `void SetMouseSgr(bool enabled)` | Sets or clears SGR extended mouse encoding. |\n| `void EnterAltScreen(bool saveCursor, bool clear)` | Switches to the alternate screen buffer (xterm `?1049h`/`?47h`/`?1047h`). The main buffer is set aside untouched and restored on `LeaveAltScreen`, so a TUI never scribbles on the shell's scrollback.  (the `?1049` vari… |\n| `void LeaveAltScreen(bool restoreCursor)` | Switches back to the main screen buffer (xterm `?1049l`/`?47l`/`?1047l`), restoring the shell's scrollback exactly.  (the `?1049` variant) puts the cursor back where it was when the alt screen was entered. |\n| `TerminalCell? CellUnderCursor()` | The cell under the cursor, or `null` when the cursor is not on a real cell. The cursor legitimately sits off the grid at the **pending-wrap** column (`CursorColumn == Columns`, held after writing the last column until… |\n| `void ClearDirty()` | **(gap)** |\n| `void Write(string text)` | Writes text at the cursor, wrapping and scrolling as needed. |\n| `void Write(char character)` | Writes one character at the cursor. |\n| `void CarriageReturn()` | **(gap)** |\n| `void LineFeed()` | Moves down one row, scrolling when already at the bottom. The column is unchanged. |\n| `void Backspace()` | Moves left one cell without erasing. |\n| `void Tab()` | Moves to the next eight-column tab stop, stopping at the last column. |\n| `void MoveCursor(int row, int column)` | Places the cursor, clamped into the screen. |\n| `void EraseInLine(EraseExtent extent)` | **(gap)** |\n| `void EraseInDisplay(EraseExtent extent)` | **(gap)** |\n| `void EraseCharacters(int count)` | Erases  cells from the cursor **in place**, without shifting the rest of the line (ECH, `CSI n X`). |\n| `void InsertCharacters(int count)` | Inserts  blank cells at the cursor, shifting the rest of the line right and dropping what falls off the end (ICH, `CSI n @`). |\n| `void DeleteCharacters(int count)` | Deletes  cells at the cursor, shifting the rest of the line left and blanking the tail (DCH, `CSI n P`). |\n| `void Resize(int columns, int rows)` | Resizes the grid, keeping the content that still fits. |\n\n### `bool IsDirty { get; private set; } = true`\n\nHas anything changed since `ClearDirty`?\n\n**Remarks.** The renderer presents on a timer to coalesce a fast producer into frames. Without this flag\nit would redraw a motionless screen at frame rate forever — the cost the coalescing policy\nexists to avoid, paid continuously instead of never.\n\n### `object SyncRoot { get; } = new()`\n\nThe monitor that coordinates mutation and reads across threads.\n\n**Remarks.** The parser writes this screen on the session's pump thread while the renderer reads it on the\nUI thread (the two differ by three orders of magnitude in rate, so marshalling every write to\nthe UI thread is not affordable — see the surface). \"Joined only by the dirty flag\" is not a\nsynchronization primitive: a `Resize` swaps `_cells` and updates\n`Columns` as two separate writes, and a reader that observes the new column count\nagainst the old array indexes past its end. A writer holds this lock across a mutation; the\nrenderer holds it across a whole frame, so a frame never sees a half-applied change.\n\n### `bool ApplicationCursorKeys { get; private set; }`\n\nWhether the child has enabled **application cursor key mode** (DECCKM, `ESC [ ? 1 h`).\n\n**Remarks.** A full-screen TUI (Claude Code's menus, vim, less) turns this on and then expects the cursor\nkeys as **SS3** (`ESC O A`) rather than CSI (`ESC [ A`). A terminal that ignores\nthe mode and always sends CSI leaves the arrows dead in exactly those programs — the reported\n\"arrow keys don't work in the Claude Code session\" (smoke 9-2). Input encoding is the reader\nof this flag (`TerminalInput`); the parser is its writer.\n\n### `void LineFeed()`\n\nMoves down one row, scrolling when already at the bottom. The column is unchanged.\n\n**Remarks.** Column-preserving is correct even though it looks like an omission: a shell that wants column\nzero sends CR with the LF, and a terminal that moved the column itself would break every\nprogram that relies on the distinction.\n\n### `void Backspace()`\n\nMoves left one cell without erasing.\n\n**Remarks.** Erasing here would delete twice: a shell removing a character sends BS, space, BS, and a\ndestructive backspace would consume the character before the space arrived to do it.\n\n### `void EraseCharacters(int count)`\n\nErases  cells from the cursor **in place**, without shifting the\nrest of the line (ECH, `CSI n X`).\n\n**Remarks.** A TUI (Claude Code, less, a shell's line editor) clears a span this way when it repaints a\nline. Dropping it — as an unhandled final was — leaves the old glyphs in the grid, and the\nfull-repaint renderer then faithfully draws them: the \"characters painted without proper\nrefresh\" report (smoke 9-1 #16). Erases to the current background, like every other erase.\n\n### `void InsertCharacters(int count)`\n\nInserts  blank cells at the cursor, shifting the rest of the line right\nand dropping what falls off the end (ICH, `CSI n @`).\n\n**Remarks.** Typing into the middle of an existing line uses this; ignoring it overwrites instead of inserting.\n\n### `void DeleteCharacters(int count)`\n\nDeletes  cells at the cursor, shifting the rest of the line left and\nblanking the tail (DCH, `CSI n P`).\n\n**Remarks.** Deleting a character mid-line uses this; ignoring it leaves the deleted glyph on screen.\n\n### `void Resize(int columns, int rows)`\n\nResizes the grid, keeping the content that still fits.\n\n**Remarks.** Content is preserved by position rather than reflowed. Reflowing is what a user expects when\nnarrowing a window over wrapped prose, and it needs a record of which line breaks were\n*wrapped* versus *written* — which this model does not keep, and inventing it here would be\nguessing at where text belongs.\nsimplify: truncate rather than reflow; ceiling is a resize losing off-screen content;\nupgrade trigger = the model gains wrapped-line provenance.\n\n## `VtParser`\n\n*class* — `VtParser.cs`\n\nTurns a session's output bytes into screen state: the display half of reading a terminal stream.\n\n**Remarks.** **Separate from `OscParser`, and the two are not redundant.** That one reads\nthe stream for *authenticated state claims* and is a security control whose value depends on\nstaying small enough to reason about. This one reads the same bytes for *what to draw*. Two\npasses cost nothing worth counting — S3 measured a scanner at 2361× the architecture's 1 MiB/s\nbudget — and merging them would put display concerns inside the control. What this parser owes\nOSC is to **skip** it, so a window-title or clipboard sequence never lands on screen as text\nthe user reads as program output.\n\n\n\n\n\n**Every byte is hostile input** (D2). The child chooses all of it, so truncated,\nover-long and nonsensical sequences are the normal case. Nothing here throws and nothing here\ngrows without a bound: an exception or an allocation reachable by printing is a denial of service\nwritten in escape codes.\n\n\n\n\n\n**Decoding is incremental.** UTF-8 characters and escape sequences both get split by\nread boundaries, which are chosen by the pipe rather than the child. A parser that decoded each\nchunk independently passes every test written as one string and produces replacement characters\nagainst a real 4 KiB read.\n\n\n\n\n\nNot thread-safe: one parser belongs to one session's reader.\n\n| Member | Summary |\n|---|---|\n| `VtParser(TerminalScreen screen)` | **(gap)** |\n| `void Consume(ReadOnlySpan<byte> bytes)` | Feeds one chunk of session output through the parser. |\n"}, {"id": "api-aide-core-upgrade", "title": "AiDe.Core.Upgrade", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Upgrade`\n\n**13 public types · 18 public members · 90% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `InstalledVersion`\n\n*record* — `DaemonInstallation.cs`\n\nOne daemon build on disk.\n\n## `DaemonInstallation`\n\n*class* — `DaemonInstallation.cs`\n\nSide-by-side daemon builds, and the pointer that says which one runs.\n\n**Remarks.** **Side-by-side is what makes rollback possible at all.** An installer that overwrote the\nprevious build would leave nothing to go back to: the store could be restored from its snapshot\nand there would be no binary able to read it. Keeping the old directory is cheap; recreating it\nafter a failed upgrade means downloading a build during an incident.\n\n\n\n\n\n**Repointing is one small atomic write, and it is the commit point.** Everything before\nit — unpacking, migrating, gating — is reversible by doing nothing. A pointer file replaced by\nrename means a process reading it during an upgrade sees the old version or the new one, never a\npartial name, and never a directory that is still being written.\n\n\n\n\n\n**Pruning never removes the current build or the one before it.** The previous build is\nnot history — it is the rollback target, and reclaiming its disk is trading an incident's\nrecovery path for a few megabytes.\n\n| Member | Summary |\n|---|---|\n| `string VersionsDirectory { get; } = Path.Combine(root, \"versions\")` | Where builds live, one directory per version. |\n| `string? Current` | The version currently pointed at, or `null` before the first install. |\n| `IReadOnlyList<InstalledVersion> Installed` | Every build on disk, newest name last. |\n| `string DirectoryFor(string version)` | The directory a version lives in, whether or not it exists yet. |\n| `InstalledVersion Install(string version, string sourceDirectory)` | Places a build beside the others. Does **not** make it current. |\n| `void Repoint(string version)` | Makes  the one that runs. The commit point. |\n| `IReadOnlyList<string> Prune(int keep)` | Removes old builds, keeping the newest  plus whatever is current. |\n\n### `string? Current`\n\nThe version currently pointed at, or `null` before the first install.\n\n**Remarks.** Null rather than a guess. \"Nothing is installed yet\" and \"the pointer names something that is\ngone\" are both states a supervisor must handle, and inventing a plausible version here would\nsend it to launch a directory that may not exist.\n\n### `InstalledVersion Install(string version, string sourceDirectory)`\n\nPlaces a build beside the others. Does **not** make it current.\n\n**Remarks.** Installing and repointing are separate because everything between them is where an upgrade\ndecides whether to keep going. A combined step would make the commit happen before the gate\nhad a chance to refuse.\n\n### `IReadOnlyList<string> Prune(int keep)`\n\nRemoves old builds, keeping the newest  plus whatever is current.\n\n**Remarks.** The current build is protected explicitly rather than by relying on it being among the\nnewest: after a rollback the current version is an *older* one, which is precisely when\na naive \"keep the newest N\" would delete the build that is running.\n\n## `HealthCheck`\n\n*record* — `HealthGate.cs`\n\nOne named check and what it found.\n\n**Remarks.** The detail is not decoration. \"The upgrade failed\" is not actionable; \"expected schema v4, found\nv3\" is, and it is the difference between a rollback someone can explain and one they can only\nobserve.\n\n| Member | Summary |\n|---|---|\n| `HealthCheck Pass(string name, string detail)` | **(gap)** |\n| `HealthCheck Fail(string name, string detail)` | **(gap)** |\n\n## `HealthGateResult`\n\n*record* — `HealthGate.cs`\n\nA gate run: whether it passed, what it ran, and how long it took.\n\n## `GateStep`\n\n*record* — `HealthGate.cs`\n\nOne check the gate will run.\n\n## `HealthGate`\n\n*class* — `HealthGate.cs`\n\nThe fast subset that decides whether a freshly migrated store may be kept.\n\n**Remarks.** **Fast is the specification, not an aspiration.** Full restore/replay equality is\nasynchronous verification — P1-PERF measured a 50k-edge replay against a 15-minute RTO while this\ngate has a 60-second budget. Putting the slow check inside the fast gate is the contradiction the\ncouncil review caught in the v1 architecture, so the budget is **enforced**: a gate that\nmerely documented one would pass a fifteen-minute replay and the contradiction would be back.\n\n\n\n\n\n**It stops at the first failure.** Later checks assume earlier ones held — an integrity\nsample over a store whose schema check just failed reports nonsense — so continuing produces a\ncascade whose first entry is the only real one.\n\n\n\n\n\n**It reports what it ran.** A gate's green result is evidence that the gate passed, not\nthat its contents passed. Naming every check is what makes the difference inspectable rather than\na matter of trust.\n\n| Member | Summary |\n|---|---|\n| `HealthGateResult Run(IReadOnlyList<GateStep> steps)` | **(gap)** |\n\n## `MigrationState`\n\n*enum* — `MigrationJournal.cs`\n\nWhere a migration had got to when it was last written down.\n\n## `MigrationRecord`\n\n*record* — `MigrationJournal.cs`\n\nOne migration, as recorded on disk.\n\n## `MigrationJournal`\n\n*class* — `MigrationJournal.cs`\n\nThe durable note that says whether a migration is in flight.\n\n**Remarks.** **It exists for the case where nothing gets to run.** Power loss, a kill, a bug that\ntakes the process out mid-migration: no cleanup handler fires, no finally block completes. What\nsurvives is what was already on disk, so recovery has to be something the *next* start can\ndo from a file — and that file has to be written before the risky part, not after.\n\n\n\n\n\n**Written by atomic replace, never in place.** A journal updated in place can be found\nhalf-written by exactly the crash it exists to survive. Writing a temporary file and renaming it\nmeans a reader sees either the old record or the new one, never a torn one.\n\n\n\n\n\n**Readers must share delete for that to hold on Windows**, which is the part that is\neasy to get wrong: a rename over a file another handle has open fails unless that handle opened\nwith `Delete`. With the ordinary `File.ReadAllText`, a concurrent\nreader does not see a torn file — it makes the *writer* throw instead.\n\n\n\n\n\n**Latest state only, not a log.** The journal answers one question — \"is a migration in\nflight?\" — and an append-only file would turn that read into a parse, with the recovery path\ndepending on correctly interpreting a history.\n\n\n\n\n\n**A torn or unreadable journal reads as \"nothing in flight\".** The alternative is that\nthe recovery path is the thing that crashes after a crash. That is a deliberate bias: an\nunreadable journal means we cannot prove a migration was running, and proceeding as though one\nwas would restore a snapshot over a store that may be fine.\n\n| Member | Summary |\n|---|---|\n| `MigrationRecord? Read()` | The current record, or `null` when there is nothing to recover. |\n| `void Begin(string migrationId, int fromSchema, int toSchema, string snapshotPath)` | Records that a migration is about to run. Call before touching the store. |\n| `void Complete()` | Records that the migration finished and its gate passed. |\n| `void RolledBack()` | Records that the migration was undone. |\n\n## `StoreSnapshot`\n\n*class* — `UpgradeCoordinator.cs`\n\nCopies the store aside so a migration can be undone.\n\n**Remarks.** **Copied, never moved.** Renaming the store into place as a snapshot would leave a window in\nwhich no store exists at all — which is the one state a crash must never find, and the exact\ninstant this whole mechanism is defending.\n\n| Member | Summary |\n|---|---|\n| `string Capture(string storePath, string directory)` | Copies  into . |\n| `void Restore(string snapshotPath, string storePath)` | Puts a snapshot back. |\n\n## `UpgradeResult`\n\n*record* — `UpgradeCoordinator.cs`\n\nWhat an upgrade attempt did.\n\n## `RecoveryResult`\n\n*record* — `UpgradeCoordinator.cs`\n\nWhat a startup recovery found.\n\n## `UpgradeCoordinator`\n\n*class* — `UpgradeCoordinator.cs`\n\nThe upgrade choreography: snapshot, migrate, gate, and either keep it or put it back.\n\n**Remarks.** **The ordering is the design.** An upgrade that fails halfway is worse than one that\nnever started: a store migrated to a schema the running binary cannot read is a workspace nobody\ncan open, with the user's evidence inside it. So the snapshot is taken before anything changes,\nthe journal is written before the migration runs, and the point of no return — deleting the\nsnapshot — comes only after the gate has passed.\n\n\n\n\n\n**Rollback is not \"do not migrate\".** It is \"undo a migration that already happened\",\nwhich is why a snapshot exists at all rather than a decision to proceed.\n\n\n\n\n\n**Recovery is a separate entry point** (`RecoverIfIncomplete`) because the\ncase it handles is the one where this class never got to finish. Nothing in the failure path can\nbe relied on to run at the moment of a power loss, so the next start reads the journal and\ncompletes the sentence.\n\n| Member | Summary |\n|---|---|\n| `UpgradeResult Run(` | Runs one migration behind its gate. |\n| `RecoveryResult RecoverIfIncomplete(string storePath, string workDirectory)` | Undoes a migration that was interrupted before it could finish. |\n\n### `RecoveryResult RecoverIfIncomplete(string storePath, string workDirectory)`\n\nUndoes a migration that was interrupted before it could finish.\n\n**Remarks.** Called at startup, before the store is opened. A journal in\n`Started` means a process died between \"about to migrate\" and\n\"migrated and verified\" — so the store may be anything, and the only thing known to be good\nis the snapshot.\n"}, {"id": "api-aide-core-watcher", "title": "AiDe.Core.Watcher", "group": "API reference", "markdown": "\n# API: `AiDe.Core.Watcher`\n\n**162 public types · 312 public members · 65% documented.**\n\n> Extracted from the source by `tools/api-reference.py`. Prose here is the code's own\n> `///` comment, never written for the reference; a member with no comment is listed as a\n> gap rather than given invented text. The extractor is a lexical reader, not a compiler:\n> it does not resolve generics, partial classes across files, or conditional compilation.\n\n## `IAdvisoryCredentialSource`\n\n*interface* — `AdvisoryEvaluators.cs`\n\nA presence-only check that a credential exists for a would-egress evaluator (ADR-0024 credential-backed-grading-egress). It never\nexposes the secret itself - the watcher store holds non-secret facts only (architecture §4), so
