# .agents/artifacts.yml - what each artifact IS decides how it merges.
# Format: pattern: class [regenerate command]. Longest matching pattern wins.
# Everything not listed stays `authored` - the safe default, resolved by a human through
# conventional conflict markers. Do not enumerate it.
#
# Every `derived` command in the managed block was RUN before it was written: a wrong
# command resolves the merge silently and leaves the artifact permanently stale while
# reporting as handled. Re-verify with `coord classify init --force` after changing a
# generator - it rewrites the managed block and leaves everything else alone.
#
# Add THIS repo's own generated and append-only artifacts below the end marker, under the
# same rule: run the command first.

# >>> coord classify init - managed block. --force regenerates BETWEEN these
docs/docs-index.js: derived python docs/ai-forward-pack/scripts/docs-graph.py derive
docs/audit/audit-data.js: derived python docs/ai-forward-pack/scripts/audit-log.py --root docs --project ai-de render
docs/audit/index.html: derived python docs/ai-forward-pack/scripts/audit-log.py --root docs --project ai-de render
docs/audit/audit-log.jsonl: register
docs/audit/change-log.jsonl: register
docs/health-history.jsonl: register
# <<< coord classify init - end managed block. Add your own entries BELOW.

# INTERPRETER TOKEN — `coord classify init` writes sys.executable (coord-core.py:899), i.e. this
# machine's absolute python.exe, into a file the pack requires to travel with the repo. Normalised
# to `python` here. That token is CONTINGENT: python.org Windows ships no `python3`, while on POSIX
# `python` may be absent (pack defect class PACK-C warns against blind substitution for exactly this
# reason). It is correct for this repo because these commands run only where a merge happens — a
# developer machine, all Windows — and NO workflow invokes coord, the merge drivers or `coord regen`
# (verified against .github/workflows/, 2026-09-07). Wire coord into CI (ubuntu-latest) and this
# token must be revisited. `classify init --force` re-bakes the absolute path; re-normalise after it.
