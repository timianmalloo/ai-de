<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AiDe composer</title>
<!--
  THE COMPOSER'S PAGE. It renders fields and posts text. It has no send verb, no path, and no
  identity — that is the one-line rule the whole design holds in its head, and this document is
  where it is easiest to break.

  WHY THE MODULE IS EXTERNAL. `script-src 'self'` with no `'unsafe-inline'` is what makes an
  injected <script> inert, and an inline module would have forced `'unsafe-inline'` back on — which
  would have made the strictest directive here decorative.

  WHY `style-src` KEEPS `'unsafe-inline'`. CodeMirror's style-mod injects a <style> element at
  mount. That was Inferred rather than known, so the composer probe asserts the editor RENDERS under
  this exact policy; the probe settles it, not an argument.
-->
<style>
  /*
    ONE PALETTE (INV-0008, Fix C). Every colour here is a CSS custom property the host pushes on
    host.init from the shell's token dictionary (ComposerPageTheme). The fallback beside each is
    that token's declared value, for the frame before the push arrives — never a second palette:
    the page used to carry its own (#1E1E1E / #D4D4D4 / #7F858A) and its hint measured 4.47:1.
    The shell contrast census measures this page rendered; a fallback that drifts from the token
    is caught there, not here.
  */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--surface, #12151A); color: var(--text, #E4E9EF); }
  body { font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #fields { display: flex; flex-direction: column; gap: 10px; padding: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted, #98A3B2); }
  .field .hint { font-size: 11px; color: var(--text-muted, #98A3B2); }
  .field .required { color: var(--danger, #E07A6F); }
  .editor { border: 1px solid var(--border, #2A313B); border-radius: 4px; background: var(--surface-sunken, #0D1014); }
  .editor .cm-editor { font: 13px/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .editor .cm-focused { outline: 2px solid var(--focus, #8FC0EA); }
  input, select { background: var(--surface-sunken, #0D1014); color: var(--text, #E4E9EF); border: 1px solid var(--border, #2A313B); border-radius: 4px; padding: 4px 6px; font: inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus, #8FC0EA); outline-offset: 1px; }
  .list-row { display: flex; gap: 6px; }
  .list-row input { flex: 1; }
  button { background: var(--surface-raised, #1A1F26); color: var(--text, #E4E9EF); border: 1px solid var(--border, #2A313B); border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button:disabled { color: var(--text-disabled, #7C8896); cursor: default; }
  .cm-mention-chip { background: var(--accent, #5B9DD9); border-radius: 4px; padding: 0 4px; color: var(--accent-contrast, #0D1014); }
  #error { padding: 12px; color: var(--danger, #E07A6F); white-space: pre-wrap; font: 12px/1.5 "Cascadia Mono", Consolas, monospace; }
  #drop-hint { padding: 6px 10px; color: var(--text-muted, #98A3B2); font-size: 11px; border-top: 1px solid var(--border, #2A313B); }
</style>

<div id="fields"></div>
<div id="drop-hint"></div>
<pre id="error" hidden></pre>

<script type="module" src="./composer.mjs"></script>
