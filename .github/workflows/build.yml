name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\AiDe.sln

      - name: Build
        run: dotnet build .\AiDe.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\AiDe.sln --configuration Release --no-build
