name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Restore
        run: dotnet restore .\AiDe.sln

      - name: Build
        run: dotnet build .\AiDe.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\AiDe.sln --configuration Release --no-build
