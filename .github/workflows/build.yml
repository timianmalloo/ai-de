name: Build

# EVERY branch, not just main. The gates ran on `push: main` and on pull requests, and the design
# session pushes to a long-lived feature branch with no PR open — so its work met no gate until it
# reached main, by which point it was merged. A defect-register entry arrived with an unbackticked
# Status value twice, and a duplicate DC id six times, all caught by whoever merged next rather than
# by the branch that introduced them. A gate that only guards the destination is a gate that reports
# problems to the wrong person.
on:
  push:
  pull_request:
  # RING 2 (CE4): a daily full sweep, so anything the per-push scoping below skips is still proven
  # within 24h. This is the safety net under the mutation-replay scoping, not a second opinion.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------
  # RING 0 — the control suite. Linux, no .NET, no build.
  #
  # These 24 checks are pure Python over files and git history: ~31s COMBINED, measured on the
  # runner. They are split out for two reasons, and the smaller one is money.
  #
  # The REASON is independence. They used to be steps in the .NET job, so anything that failed
  # earlier took them with it — Actions skips the rest of a job after a failure. One
  # hardware-sensitive WPF assertion did exactly that for two days: 38 consecutive red runs in which
  # not one of these ever executed, including the id-allocator and derived-view gates, on the days
  # those defects landed (INV-0005). As their own job they now report even when the build is broken,
  # which is precisely when a docs/register defect is most likely to be riding along.
  #
  # The money is small and worth stating honestly: ~31s moving from a 2x runner to a 1x one. The big
  # multiplier win — moving the 1,719 Core tests to Linux — is NOT available: they launch the
  # net10.0-windows daemon as a real process and exercise ConPTY via CREATE_NEW_CONSOLE, so that
  # lock is real rather than a target-framework label (CE9 — recorded as a cost to remove later,
  # not accepted as a floor).
  # ---------------------------------------------------------------------------------------------
  gates:
    runs-on: ubuntu-latest

    # EVERY GATE RUNS, EVEN AFTER ONE FAILS (`if: !cancelled()` on each step below).
    #
    # Actions stops a job at the first failing step, which is the same defect this whole job exists
    # to escape — one step's failure hiding every check behind it (INV-0005 RC-2). Without this, a
    # single red gate means one finding per push and a round trip to CI for the next one; that cost
    # two cycles the day this job was created. A failing step still fails the JOB, so the gate stays
    # fail-closed — it just reports everything it found first.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history. The extractor-generation gate finds the commit where the generation last
          # changed, and checkout is SHALLOW by default — with depth 1 that search finds nothing and
          # the gate reports "no prior change to compare against" and passes. A gate that cannot
          # fire is the defect it was written to prevent, one layer up.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ---------------------------------------------------------------------------------------
      # STEP ORDER IS COST-ASCENDING, AND THAT IS LOAD-BEARING (INV-0005).
      #
      # Actions skips every later step once one fails. The test step used to sit here, ahead of the
      # gates below — so when one hardware-sensitive WPF assertion started failing on the runner, all
      # 26 of these were reported `skipped` on every run for two days. The whole control suite went
      # dark, including the id-allocator and derived-view gates, on the days those exact defects
      # landed. 38 of 40 consecutive runs were red and none of them ever reached a gate.
      #
      # Measured on the runner: everything from here to "Extractor generation gate" is ~31s COMBINED.
      # The test step is 317s, mutation replay 612s. Cheap and broad first, expensive and narrow last,
      # so a failure is reported by the cheapest check that can see it.
      #
      # If you add a step, put it in cost order. Anything ahead of these gates must be cheaper than
      # ~31s and must not depend on the machine it runs on.
      # ---------------------------------------------------------------------------------------

      # A defect class cited by ID in prose cannot fail. Three of them (DC-009/010/011) were cited as
      # authoritative by four committed artifacts while having no entry in the register at all, and
      # the register's own header claimed twelve classes over nine. This is DC-001's control widened:
      # every cited DC-NNN must resolve, the sequence must have no gaps, and the counts are derived
      # rather than typed.
      - name: Defect-register integrity gate
        if: ${{ !cancelled() }}
        run: python tools/verify-defect-register.py

      # DC-095: a comment that names the test enforcing a property, where that name resolves to
      # nothing. It reads as the strongest evidence available - a named, locatable control - and
      # nothing checks it, because compilers do not resolve identifiers inside <c> tags. Two
      # instances in one evening, the second committed in the SAME change that registered the class,
      # which is why this is a gate rather than a reading rule.
      - name: Cited-controls gate
        if: ${{ !cancelled() }}
        run: |
          python tools/verify-cited-controls.py --self-test
          python tools/verify-cited-controls.py

      # DC-104: a new control's first run is evidence about TWO things, and the likelier defect is
      # in the control — which is the one nobody looks for, because the control is what they just
      # reasoned about carefully. Four controls were wrong on their first run in a single day. A
      # --self-test is how a gate shows it can fail at all.
      #
      # A RATCHET, not a rule: nine gates predate the convention and are frozen by name, because
      # failing the build on tools nobody is rewriting is how a gate gets switched off. New debt is
      # refused; a name that no longer owns its debt must be removed.
      - name: Gate self-test ratchet
        if: ${{ !cancelled() }}
        run: |
          python tools/verify-gate-self-tests.py --self-test
          python tools/verify-gate-self-tests.py

      # The owner stipulated Proof Pack capture. MEASURED first: of 292 skill entries only 33 carry
      # goal + done_when, so 259 never become Work Episodes at all — nothing can score or observe
      # them. Of the 111 that do, 14 carry evidence. AL5b already requires the first half in prose,
      # and 259 entries are what prose is worth (CI6).
      #
      # A RATCHET frozen at al-0449, because the log is append-only and those goals are gone. An
      # honest --signal-verification-path false counts as capture: forcing a Proof Pack onto a turn
      # that verified nothing is the false positive that gets a gate switched off (DC-104). What is
      # refused is silence.
      - name: Audit capture ratchet — a skill run says what it was for
        if: ${{ !cancelled() }}
        run: |
          python tools/verify-audit-capture.py --self-test
          python tools/verify-audit-capture.py

      # 111 episodes scored, 1 observation written, and the recurrence threshold is two — so the
      # learning corpus could only ever be empty. The cause was not the engine: the instruction that
      # makes scoring possible lived only in Copilot's instructions directory, so the harness doing
      # most of the work was never told and could not have known.
      #
      # The channel is harness-neutral by construction; being TOLD is not. This fails when a harness
      # root stops carrying the capture instruction, and catches the next harness the moment its
      # root appears without it.
      - name: Proof Pack capture instruction gate
        if: ${{ !cancelled() }}
        run: |
          python tools/verify-capture-instruction.py --self-test
          python tools/verify-capture-instruction.py

      # DC-106: site/collaboration.html and site/index.html carried COMMITTED conflict markers on
      # main, duplicating four data-figure cells on the PUBLISHED pages. verify-site-figures read
      # each duplicated cell, found the same correct number in all of them, and reported success —
      # a content check cannot see structural damage. A conflict marker has no legitimate instance
      # in a tracked file, so this is the rare gate with no judgement in it.
      - name: No conflict markers in tracked files
        if: ${{ !cancelled() }}
        run: |
          python tools/verify-no-conflict-markers.py --self-test
          python tools/verify-no-conflict-markers.py

      # DC-107: a frame-budget assertion compared a measured p95 against 16.67 ms, a number taken on
      # a developer workstation. The CI runner is ~3x slower, so it failed 38 consecutive runs while
      # the draw path was correct. Refuses an UPPER bound on a measured duration against a constant;
      # a lower bound is fine (slower hardware only makes it more true), as is a hang guard.
      - name: No wall-clock budget assertions
        if: ${{ !cancelled() }}
        run: |
          python tools/verify-perf-assertions.py --self-test
          python tools/verify-perf-assertions.py

      # DC-021: a fixture that restates a list the product declares. Three occurrences before it was
      # registered, because each repair was cheap enough that nobody asked why. The register recorded
      # the residual honestly — derivation was a convention and nothing failed when the next fixture
      # typed the list out again. This is the missing half. It found two live cases the hour it was
      # written, one of them a day old.
      - name: Fixture-derivation gate
        if: ${{ !cancelled() }}
        run: python tools/verify-fixture-derivation.py

      # An embedded page gets no compiler, no analyzer and no test. A stray quote in the canvas page
      # broke its whole <script>, so the Graph pane rendered NOTHING — invisible to the build,
      # invisible to 628 tests, and the one probe that would have caught it was running a stale
      # binary (DC-023). Uses node --check where Node exists and says so when it falls back.
      - name: Embedded-script syntax gate
        if: ${{ !cancelled() }}
        run: python tools/verify-embedded-scripts.py

      # Audit ids are allocated by "highest present, plus one", which is correct in one checkout and
      # wrong with two — and worktree discipline means there are usually two. It has collided twice.
      # Append-only logs can merge cleanly with two records under one id, where nothing fails and one
      # silently wins every lookup (defect class DC-013).
      - name: Audit-log id uniqueness gate
        if: ${{ !cancelled() }}
        run: python tools/verify-audit-log.py

      # verify-audit-log covers two JSONL logs. DC-013 recurred a fourth time in a THIRD allocator
      # nobody had classified as one — the defect register, where the file merged cleanly with two
      # entries under DC-032. This asks the generalising question instead: what else here is numbered
      # by reading the highest and adding one? It also reports an UNDECLARED sequence, so the next
      # allocator is guarded on the day it is invented rather than the day it collides.
      #
      # It also compares BRANCHES, which is why fetch-depth: 0 and `on: push` (every branch) both
      # matter here. DC-054, DC-055, DC-059, DC-061, DC-062 and DC-063 were each allocated twice in
      # two days — once per session, in separate worktrees — and every file involved was internally
      # consistent, so the within-a-file check passed in both trees until the branches met. The
      # cross-branch half reports the collision to the branch that introduces it; a collision
      # between two OTHER branches is a note, not a failure, so nobody's build goes red waiting on
      # somebody else.
      - name: Monotonic id allocator gate
        if: ${{ !cancelled() }}
        run: python tools/verify-id-allocators.py

      # The control must be observed failing, not asserted to work (CI6). Both halves have a
      # planted-failure self-test, and the cross-branch one builds a throwaway two-branch
      # repository because the shape it guards cannot be reproduced inside a single tree.
      - name: Monotonic id allocator gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-id-allocators.py --self-test

      # The derived views are generated from frontmatter and from the append-only logs, and they
      # are line-oriented JSON — so a rebase merges them into something that PARSES, carries no
      # conflict marker, and is wrong. Nothing in the test suite reads them, so nothing fails.
      # That has happened three times in two days (DC-060). The response was "always regenerate
      # after a rebase", which is a habit; this is the executable form.
      - name: Derived views match their generators
        if: ${{ !cancelled() }}
        run: python tools/verify-derived-views.py

      - name: Derived views gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-derived-views.py --self-test

      # A stand-in wired into production outlives the thing it stood in for, and every signal stays
      # green because the seam works exactly as designed (DC-073). MockNodeContentSource shipped a
      # labelled SAMPLE to the code viewer for a day after the real query landed, with zero calls to
      # it anywhere in the App. Not a ban — a forcing function: each one names the condition that
      # makes it right, and the next reader is asked whether that condition still holds.
      - name: Production stand-ins are accounted for
        if: ${{ !cancelled() }}
        run: python tools/verify-standins.py

      - name: Stand-ins gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-standins.py --self-test

      # ONLY the self-test runs here, and that is deliberate. The real check looks across every
      # worktree for an append-only log left uncommitted in a tree nobody is working in; a CI runner
      # has exactly one checkout and it is clean by construction, so running the check here would
      # pass every time without ever being able to fail — a control that cannot fire in the
      # environment that verifies it (DC-016), which is the defect it exists to prevent, one layer
      # up. The self-test builds its own repository and CAN fail, so CI proves the control is alive
      # while the control itself runs where the hazard is: a developer's machine, pre-commit.
      - name: Stranded audit-log gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-stranded-audit.py --self-test

      # §2 of the session contract assigns four of thirteen surfaces. The other nine were built
      # after it was written, and it fails by OMISSION — every line still correct, nothing checking
      # what it does not say. With no entry to look up, an owner gets inferred from what the symptom
      # looks like, which already sent a Core-owned registry defect to the design session. This
      # cannot decide who should own a new surface; it refuses to let one exist with no answer.
      - name: Every surface has a declared owner
        if: ${{ !cancelled() }}
        run: python tools/verify-surface-ownership.py

      - name: Surface-ownership gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-surface-ownership.py --self-test

      # Every STA harness in the App suite wrapped assertion failures in "STA work failed", so the
      # runner's headline named the environment while the real sentence sat in an inner exception.
      # That reads as flakiness, and the response to flakiness is a re-run rather than an
      # investigation — a false claim aimed at the person diagnosing, which is why it outranks the
      # announcement classes it came from. 16 harnesses, found by sweeping after a copy exposed one.
      - name: An assertion failure is reported as itself
        if: ${{ !cancelled() }}
        run: python tools/verify-harness-diagnostics.py

      - name: Harness-diagnostics gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-harness-diagnostics.py --self-test

      # api-reference.py stripped the XML-doc prefix with `[A-Za-z]:?` — colon optional, letter
      # mandatory — so a cref with no prefix lost its first character. `Profiles` rendered as
      # `rofiles`, and worse, `IAdvisoryEvaluator` rendered as `AdvisoryEvaluator`, which looks
      # entirely legitimate. 13 committed files, and nothing compared a generated doc against the
      # source it documents.
      - name: Generated API docs name real identifiers
        if: ${{ !cancelled() }}
        run: python tools/verify-api-crefs.py

      - name: API-cref gate — self-test
        if: ${{ !cancelled() }}
        run: python tools/verify-api-crefs.py --self-test

      # Three times in one session a comment stated a bound the code did not apply: an evidence page
      # documented as fitting a cap it exceeded fifteenfold, a search reporting MaxBytes 65,536 while
      # returning 461,750, and a regex whose exclusion existed only in prose (DC-038). Every constant
      # whose NAME claims a limit must appear in a comparison, a clamp or a take.
      - name: Bounds-are-enforced gate
        if: ${{ !cancelled() }}
        run: python tools/verify-bounds-are-enforced.py

      # ScopeFingerprints.ExtractorGeneration invalidates every cached extraction when the product
      # upgrades. The mechanism was complete; bumping it was a thing somebody had to remember, and
      # a day of extractor changes shipped without it — so existing workspaces kept serving results
      # from the previous generation and the Knowledge chip read 0 on a repository holding 2,343
      # knowledge nodes. Needs full history to find the last bump.
      - name: Extractor generation gate
        if: ${{ !cancelled() }}
        run: python tools/verify-extractor-generation.py

  # ---------------------------------------------------------------------------------------------
  # THE PORTABLE 94% OF THE CORE SUITE, ON LINUX AT 1x.
  #
  # AiDe.Core.Tests targets net10.0 and 1,621 of its 1,719 cases are platform-agnostic. What pinned
  # the whole suite to a 2x Windows runner was ONE build-order ProjectReference to AiDe.Daemon
  # (net10.0-windows), which cannot be built off Windows - present for the 9 cases that launch the
  # daemon as a process. That reference is now conditioned on Windows, and the cases that need it
  # declare [Trait("Platform", "Windows")].
  #
  # CHEAPER IS NEVER WEAKER (CE19): the halves are not independent minimums. `splits` in
  # tools/expected-test-counts.json asserts they still total 1,719, checked on every invocation on
  # both operating systems, so lowering one half to make a run pass fails loudly instead.
  # ---------------------------------------------------------------------------------------------
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test — the portable half (with run-integrity gate)
        run: python tools/verify-test-run.py --only AiDe.Core.Tests --filter 'Platform!=Windows' --key AiDe.Core.Tests.portable

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: artifacts/test-results/*.trx
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # RING 0/1 — everything that needs .NET, on Windows because it genuinely needs Windows: WPF
  # (net10.0-windows), ConPTY, and the daemon launched as a separate process.
  #
  # Steps stay in COST-ASCENDING order, measured on the runner: test 317s, compilation coverage 82s,
  # published layout 4s, mutation replay 612s. Cheapest first, so a failure is reported by the
  # cheapest check that can see it. If you add a step here, put it in cost order.
  # ---------------------------------------------------------------------------------------------
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history. The extractor-generation gate finds the commit where the generation last
          # changed, and checkout is SHALLOW by default — with depth 1 that search finds nothing and
          # the gate reports "no prior change to compare against" and passes. A gate that cannot
          # fire is the defect it was written to prevent, one layer up.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore .\AiDe.sln

      - name: Build
        run: dotnet build .\AiDe.sln --configuration Release --no-restore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Not a bare `dotnet test`. That command prints "Passed!" for a run whose host CRASHED
      # partway through — nothing failed, execution just stopped — so a green step can hide any
      # number of tests that never ran (defect class DC-012). The gate asserts on that negative:
      # every project must produce results, report itself Completed, and execute at least as many
      # tests as the committed baseline.
      #
      # THIS JOB NOW RUNS ONLY WHAT NEEDS WINDOWS. `AiDe.App.Tests` is WPF, so all 399 of it. Of
      # `AiDe.Core.Tests`, only the 98 cases that launch the net10.0-windows daemon or drive ConPTY -
      # they carry [Trait("Platform", "Windows")]. The other 1,621 run on Linux in `core-tests`, at
      # 1x instead of 2x. tools/expected-test-counts.json asserts the two halves still total 1,719,
      # so the split can be re-balanced but coverage cannot quietly shrink.
      - name: Test — the Windows-locked half (with run-integrity gate)
        run: |
          python tools/verify-test-run.py --only AiDe.App.Tests
          python tools/verify-test-run.py --only AiDe.Core.Tests --filter 'Platform=Windows' --key AiDe.Core.Tests.windows

      # The joins harness is not in AiDe.sln, so a change to GraphAsync broke it while the solution
      # build stayed green and the next measurement silently ran a STALE BINARY (DC-023, with the
      # twist that the gate was not stale but NARROW). Builds every tracked project the solution does
      # not contain: 19 of them, measured at 16 seconds, which is why this is here and not nightly.
      - name: Project compilation coverage gate
        run: python tools/verify-project-coverage.py

      # The shell resolves its daemon at <BaseDirectory>/daemon/AiDe.Daemon.exe. A build-time target
      # put it there, so every developer run and every test worked; publish writes elsewhere and did
      # not carry it, so the SHIPPED build could not open a workspace at all. The layout that was
      # tested was never the layout that shipped. Publishes to a scratch directory and looks.
      - name: Published layout gate
        run: python tools/verify-published-layout.py

      # Does this push touch anything a mutation could reach? Mutation replay edits C# and runs the
      # test suites, so a change to Markdown, a gate script or a workflow cannot alter its verdict —
      # it would spend 401s re-proving the identical thing.
      #
      # Computed from the diff rather than an `on.push.paths` filter, deliberately: a workflow-level
      # path filter makes the whole JOB not exist, and a job that does not exist reports neither
      # success nor failure. Should this repository ever adopt branch protection, that is the shape
      # that reads as green (CE7). Skipping one STEP keeps the job, and the job's verdict, real.
      - name: Scope — did any mutable code change?
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "not a push — running the full sweep"; exit 0
          fi
          before="${{ github.event.before }}"
          # All-zeros is a new branch with no `before` to diff against; unknown scope means run it.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "no comparable base — running the full sweep"; exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}"             -- src tests tools/mutation-replay.py tools/mutation-sets | head -20)
          if [ -n "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "mutable code changed:"; echo "$changed"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "no src/, tests/ or mutation-set change"
          fi

      # DC-099: a test written in the same edit as its fix has never been shown capable of failing.
      # Breaks the code on purpose and requires a test to notice. The four CROSS-BOUNDARY/CROSS-AUTHOR
      # mutations are the ones no single-sided sweep can find: each component's own sweep mutates only
      # its own code, so a dependency that runs A -> B is invisible from both ends.
      #
      # RE-MEASURED ON THE RUNNER, 2026-09-05: 401s — the largest step in this job by a wide margin.
      # The comment here used to justify every-push scheduling with "74s for 18 mutations on this
      # machine", which was 5.4x wrong because it was measured on a laptop and never re-taken where
      # the gate runs (DC-107, INV-0005). It now runs when mutable code changed, on a schedule, or on
      # demand — and the number above is the runner's, so the next person to re-ring it is arguing
      # with a measurement rather than with a memory.
      - name: Mutation replay — the controls can actually fail
        if: ${{ steps.scope.outputs.code == 'true' }}
        run: |
          python tools/mutation-replay.py --self-test
          python tools/mutation-replay.py --set tools/mutation-sets/daydream-seam.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
