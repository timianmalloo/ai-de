name: Build

# EVERY branch, not just main. The gates ran on `push: main` and on pull requests, and the design
# session pushes to a long-lived feature branch with no PR open — so its work met no gate until it
# reached main, by which point it was merged. A defect-register entry arrived with an unbackticked
# Status value twice, and a duplicate DC id six times, all caught by whoever merged next rather than
# by the branch that introduced them. A gate that only guards the destination is a gate that reports
# problems to the wrong person.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history. The extractor-generation gate finds the commit where the generation last
          # changed, and checkout is SHALLOW by default — with depth 1 that search finds nothing and
          # the gate reports "no prior change to compare against" and passes. A gate that cannot
          # fire is the defect it was written to prevent, one layer up.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4

      - name: Restore
        run: dotnet restore .\AiDe.sln

      - name: Build
        run: dotnet build .\AiDe.sln --configuration Release --no-restore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Not a bare `dotnet test`. That command prints "Passed!" for a run whose host CRASHED
      # partway through — nothing failed, execution just stopped — so a green step can hide any
      # number of tests that never ran (defect class DC-012). The gate asserts on that negative:
      # every project must produce results, report itself Completed, and execute at least as many
      # tests as the committed baseline.
      - name: Test (with run-integrity gate)
        run: python tools/verify-test-run.py

      # A defect class cited by ID in prose cannot fail. Three of them (DC-009/010/011) were cited as
      # authoritative by four committed artifacts while having no entry in the register at all, and
      # the register's own header claimed twelve classes over nine. This is DC-001's control widened:
      # every cited DC-NNN must resolve, the sequence must have no gaps, and the counts are derived
      # rather than typed.
      - name: Defect-register integrity gate
        run: python tools/verify-defect-register.py

      # DC-021: a fixture that restates a list the product declares. Three occurrences before it was
      # registered, because each repair was cheap enough that nobody asked why. The register recorded
      # the residual honestly — derivation was a convention and nothing failed when the next fixture
      # typed the list out again. This is the missing half. It found two live cases the hour it was
      # written, one of them a day old.
      - name: Fixture-derivation gate
        run: python tools/verify-fixture-derivation.py

      # An embedded page gets no compiler, no analyzer and no test. A stray quote in the canvas page
      # broke its whole <script>, so the Graph pane rendered NOTHING — invisible to the build,
      # invisible to 628 tests, and the one probe that would have caught it was running a stale
      # binary (DC-023). Uses node --check where Node exists and says so when it falls back.
      - name: Embedded-script syntax gate
        run: python tools/verify-embedded-scripts.py

      # Audit ids are allocated by "highest present, plus one", which is correct in one checkout and
      # wrong with two — and worktree discipline means there are usually two. It has collided twice.
      # Append-only logs can merge cleanly with two records under one id, where nothing fails and one
      # silently wins every lookup (defect class DC-013).
      - name: Audit-log id uniqueness gate
        run: python tools/verify-audit-log.py

      # verify-audit-log covers two JSONL logs. DC-013 recurred a fourth time in a THIRD allocator
      # nobody had classified as one — the defect register, where the file merged cleanly with two
      # entries under DC-032. This asks the generalising question instead: what else here is numbered
      # by reading the highest and adding one? It also reports an UNDECLARED sequence, so the next
      # allocator is guarded on the day it is invented rather than the day it collides.
      #
      # It also compares BRANCHES, which is why fetch-depth: 0 and `on: push` (every branch) both
      # matter here. DC-054, DC-055, DC-059, DC-061, DC-062 and DC-063 were each allocated twice in
      # two days — once per session, in separate worktrees — and every file involved was internally
      # consistent, so the within-a-file check passed in both trees until the branches met. The
      # cross-branch half reports the collision to the branch that introduces it; a collision
      # between two OTHER branches is a note, not a failure, so nobody's build goes red waiting on
      # somebody else.
      - name: Monotonic id allocator gate
        run: python tools/verify-id-allocators.py

      # The control must be observed failing, not asserted to work (CI6). Both halves have a
      # planted-failure self-test, and the cross-branch one builds a throwaway two-branch
      # repository because the shape it guards cannot be reproduced inside a single tree.
      - name: Monotonic id allocator gate — self-test
        run: python tools/verify-id-allocators.py --self-test

      # The joins harness is not in AiDe.sln, so a change to GraphAsync broke it while the solution
      # build stayed green and the next measurement silently ran a STALE BINARY (DC-023, with the
      # twist that the gate was not stale but NARROW). Builds every tracked project the solution does
      # not contain: 19 of them, measured at 16 seconds, which is why this is here and not nightly.
      - name: Project compilation coverage gate
        run: python tools/verify-project-coverage.py

      # Three times in one session a comment stated a bound the code did not apply: an evidence page
      # documented as fitting a cap it exceeded fifteenfold, a search reporting MaxBytes 65,536 while
      # returning 461,750, and a regex whose exclusion existed only in prose (DC-038). Every constant
      # whose NAME claims a limit must appear in a comparison, a clamp or a take.
      - name: Bounds-are-enforced gate
        run: python tools/verify-bounds-are-enforced.py

      # ScopeFingerprints.ExtractorGeneration invalidates every cached extraction when the product
      # upgrades. The mechanism was complete; bumping it was a thing somebody had to remember, and
      # a day of extractor changes shipped without it — so existing workspaces kept serving results
      # from the previous generation and the Knowledge chip read 0 on a repository holding 2,343
      # knowledge nodes. Needs full history to find the last bump.
      - name: Extractor generation gate
        run: python tools/verify-extractor-generation.py

      # The shell resolves its daemon at <BaseDirectory>/daemon/AiDe.Daemon.exe. A build-time target
      # put it there, so every developer run and every test worked; publish writes elsewhere and did
      # not carry it, so the SHIPPED build could not open a workspace at all. The layout that was
      # tested was never the layout that shipped. Publishes to a scratch directory and looks.
      - name: Published layout gate
        run: python tools/verify-published-layout.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
